[package]
name = "memcordon-windows-loader-lab"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
clap.workspace = true
hex.workspace = true
memcordon-core = { path = "../../crates/memcordon-core", version = "=0.5.2-rc.11" }
memcordon-windows-launch-core = { path = "../../crates/memcordon-windows-launch-core", version = "=0.5.2-rc.11" }
