[package]
name = "memcordon-ci"
default-run = "memcordon-ci"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.88"
repository.workspace = true
publish = false

[dependencies]
cargo_metadata.workspace = true
base64.workspace = true
getrandom = "0.3"
hyper = { version = "1.7", features = ["server", "http1"] }
hyper-util = { version = "0.1.17", features = ["tokio"] }
http-body-util = "0.1.3"
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
clap.workspace = true
flate2.workspace = true
hex.workspace = true
libc.workspace = true
memcordon-core = { path = "../../crates/memcordon-core", version = "=0.5.8-dev" }
memcordon-platform = { path = "../../crates/memcordon-platform", version = "=0.5.8-dev" }
memcordon-testkit = { path = "../../crates/memcordon-testkit", version = "=0.5.8-dev" }
memcordon-windows-launch-core = { path = "../../crates/memcordon-windows-launch-core", version = "=0.5.8-dev" }
rustix = { version = "1.1.4", features = ["net", "process", "fs"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
syn.workspace = true
tar.workspace = true
tempfile.workspace = true
time = { version = "0.3.55", features = ["parsing"] }
thiserror.workspace = true
toml.workspace = true
ureq.workspace = true
url = "2.5.8"
walkdir.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Environment", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[lints]
workspace = true
