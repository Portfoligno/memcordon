# Fixed upstream contract. Runtime discovery and observed results cannot narrow it.
format = "memcordon.consumer-readiness"
revision = 1
profile = "memcordon.consumer-readiness.v1"
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
channels = ["candidate-native", "candidate-cargo", "public-native", "public-cargo"]
requirements = ["CR-01", "CR-02", "CR-03", "CR-04", "CR-05", "CR-06", "CR-07", "CR-08", "CR-09", "CR-10", "CR-11", "CR-12", "CR-13", "CR-14"]
linux_profile = "linux-tcp4-unix-private-v1"
linux_request_revision = 3
linux_result_revision = 2
windows_profile = "windows-host-network-external-v1"
windows_request_revision = 1
windows_result_revision = 1
windows_churn_creations = 4096
windows_churn_generations = 3
windows_churn_live_cohort = 64
windows_population_processes = 257

[[cases]]
family = "C-PACKAGE"
platform = "both"
evidence_class = "installed_product"
scenarios = ["fresh-install","verify","upgrade","final-uninstall"]
requirements = ["CR-02","CR-04","CR-13"]

[[cases]]
family = "C-IO"
platform = "both"
evidence_class = "installed_product"
scenarios = ["empty-input","empty-message","binary-streams","binary-file","native-argv","bounded-large-output"]
requirements = ["CR-01","CR-06","CR-07"]

[[cases]]
family = "C-STATUS"
platform = "both"
evidence_class = "installed_product"
scenarios = ["zero","nonzero","exit-123","exit-124","exit-125","exit-126","exit-127","deadline","memory"]
requirements = ["CR-08","CR-09"]

[[cases]]
