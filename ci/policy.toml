[workspace]
production_packages = [
  "memcordon-core",
  "memcordon-windows-launch-core",
  "memcordon-platform",
  "memcordon",
  "memcordon-testkit",
]
ci_packages = ["memcordon-ci", "memcordon-windows-loader-lab", "memcordon-deadline-oracle"]
ci_package_rust_versions = { memcordon-ci = "1.88.0", memcordon-windows-loader-lab = "1.85.0", memcordon-deadline-oracle = "1.85.0" }
publish_packages = ["memcordon-core", "memcordon-platform", "memcordon-windows-launch-core", "memcordon"]
non_publish_packages = ["memcordon-testkit", "memcordon-ci", "memcordon-windows-loader-lab", "memcordon-deadline-oracle"]

[workflow]
required_public_matrix = [
  "linux-x64",
  "linux-arm64",
  "macos-arm64",
  "macos-x64",
  "windows-x64",
  "windows-arm64",
]
self_extracting_shell_allowlist = []
environment_allowlist = [
  { file = ".github/workflows/release.yml", steps = ["Read original preparation artifacts", "Publish prepared bytes"], variable = "GH_TOKEN", source = "${{ github.token }}" },
  { file = ".github/workflows/release.yml", steps = ["Publish prepared bytes"], variable = "CARGO_REGISTRY_TOKEN", source = "${{ steps.registry-auth.outputs.token }}" },
]
allowed_run_commands = [
  "git config --global core.autocrlf false",
  "./target/ci/release/memcordon-ci ci performance-plan",
  "./target/ci/release/memcordon-ci release verify-source",
  "./target/ci/release/memcordon-ci release consumer-cache",
  "./target/ci/release/memcordon-ci release working-windows-prepare",
  "./target/ci/release/memcordon-ci release working-windows-consumer --channel native --destination target/ci/windows-installed/native",
  "./target/ci/release/memcordon-ci release working-windows-consumer --channel cargo --destination target/ci/windows-installed/cargo",
  "./target/ci/release/memcordon-ci release installed-consumers --channel native --destination .release/installed-results/native",
  "./target/ci/release/memcordon-ci release installed-consumers --channel cargo --destination .release/installed-results/cargo",
  "./target/ci/release/memcordon-ci ci aggregate-stress",
  "./target/ci/release/memcordon-ci ci aggregate-macos",
  "./.release/tool/memcordon-ci release public-consumer",
  "./target/ci/release/memcordon-ci ci prepare --profile miri",
  "./target/ci/release/memcordon-ci ci prepare --profile fuzz",
  "./target/ci/release/memcordon-ci ci cache-context --purpose miri --shard complete",
  "./target/ci/release/memcordon-ci ci cache-context --purpose fuzz --shard complete",
  "./target/ci/release/memcordon-ci ci cache-context --purpose stress --shard complete",
  "./target/ci/release/memcordon-ci ci cache-context --purpose stress-packages --shard complete",
  "./target/ci/release/memcordon-ci ci cache-context --purpose stress-lifecycle --shard complete",
  "./target/ci/release/memcordon-ci release select",
  "./target/ci/release/memcordon-ci release recovery-inputs",
  "./target/ci/release/memcordon-ci release packages",
  "./target/ci/release/memcordon-ci release publication-tool",
  "./target/ci/release/memcordon-ci release build-target",
  "./target/ci/release/memcordon-ci release installed-consumers",
  "./target/ci/release/memcordon-ci ci cache-context --purpose native --shard complete",
  "./target/ci/release/memcordon-ci release consumer-cache --target target/ci/windows-prepared/native-payload --packages target/ci/windows-prepared/cargo-payload",
  "./target/ci/release/memcordon-ci ci cache-context --purpose macos --shard combined",
  "./target/ci/release/memcordon-ci ci cache-context --purpose macos --shard native",
  "./target/ci/release/memcordon-ci ci cache-context --purpose macos --shard acceptance",
  "./.release/tool/memcordon-ci release assemble",
  "./.release/tool/memcordon-ci release publish",
  "tar -xzf .release/tool/memcordon-publication-tool.tar.gz -C .release/tool",
  "rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci",
  "./target/ci/release/memcordon-ci suite macos-deadline",
  "./target/ci/release/memcordon-ci suite backend-linux-cgroup",
  "./target/ci/release/memcordon-ci suite backend-linux-private",
  "./target/ci/release/memcordon-ci ci cache-context --purpose private --shard complete",
  "./target/ci/release/memcordon-ci ci cache-context --purpose quality --shard complete",
  "./target/ci/release/memcordon-ci ci cache-context --purpose msrv --shard complete",
  "./target/ci/release/memcordon-ci ci cache-context --purpose supply --shard complete",
  "./target/ci/release/memcordon-ci ci cache-context --purpose backend --shard complete",
  "./target/ci/release/memcordon-ci ci cache-context --purpose deadline --shard complete",
  "./target/ci/release/memcordon-ci suite backend-windows-job",
  "rustup toolchain install 1.97.1 --profile minimal",
  "rustup run 1.97.1 cargo build --locked --release -p memcordon-ci --bin memcordon-ci",
  "rustup run 1.97.1 cargo build --locked --release -p memcordon --features test-fixtures --bin memcordon-test-fixture",
  "rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt",
  "rustup toolchain install 1.85.0 --profile minimal",
  "./target/ci/release/memcordon-ci suite policy",
  "./target/ci/release/memcordon-ci suite quality",
  "./target/ci/release/memcordon-ci suite msrv",
  "./target/ci/release/memcordon-ci suite native",
  "./target/ci/release/memcordon-ci suite supply-chain",
  "./target/ci/release/memcordon-ci suite miri",
  "./target/ci/release/memcordon-ci suite miri-first",
  "./target/ci/release/memcordon-ci suite miri-second",
  "./target/ci/release/memcordon-ci suite fuzz",
  "./target/ci/release/memcordon-ci suite fuzz-first",
  "./target/ci/release/memcordon-ci suite fuzz-second",
  "./target/ci/release/memcordon-ci suite fuzz-quarter-one",
  "./target/ci/release/memcordon-ci suite fuzz-quarter-two",
  "./target/ci/release/memcordon-ci suite fuzz-quarter-three",
  "./target/ci/release/memcordon-ci suite fuzz-quarter-four",
  "./target/ci/release/memcordon-ci suite stress",
  "./target/ci/release/memcordon-ci suite stress-packages",
  "./target/ci/release/memcordon-ci suite stress-lifecycle",
  "./target/ci/release/memcordon-ci suite release-macos-native",
  "./target/ci/release/memcordon-ci suite release-macos-acceptance",
  "./target/ci/release/memcordon-ci suite backend-macos-watchdog",
]

[test]
fast_short_child_iterations = 128
deep_short_child_iterations = 4096
release_short_child_iterations = 4096
