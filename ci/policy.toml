[workspace]
production_packages = [
  "memcordon-core",
  "memcordon-windows-launch-core",
  "memcordon-platform",
  "memcordon",
  "memcordon-testkit",
]
ci_packages = ["memcordon-ci", "memcordon-windows-loader-lab", "memcordon-deadline-oracle"]
ci_package_rust_versions = { memcordon-ci = "1.88.0", memcordon-windows-loader-lab = "1.85.0", memcordon-deadline-oracle = "1.85.0" }
publish_packages = ["memcordon-core", "memcordon-windows-launch-core", "memcordon-platform", "memcordon"]
non_publish_packages = ["memcordon-testkit", "memcordon-ci", "memcordon-windows-loader-lab", "memcordon-deadline-oracle"]

[workflow]
required_public_matrix = [
  "linux-x64",
  "linux-arm64",
  "macos-arm64",
  "macos-x64",
  "windows-x64",
  "windows-arm64",
]
self_extracting_shell_allowlist = []
environment_allowlist = [
  { file = ".github/workflows/release.yml", steps = ["Read original preparation artifacts", "Publish prepared bytes", "Publish original prepared bytes"], variable = "GH_TOKEN", source = "${{ github.token }}" },
  { file = ".github/workflows/release.yml", steps = ["Publish prepared bytes", "Publish original prepared bytes"], variable = "CARGO_REGISTRY_TOKEN", source = "${{ steps.registry-auth.outputs.token }}" },
]
allowed_run_commands = [
  "./.release/rehearsal-tool/memcordon-release-rehearsal run --publisher .release/tool/memcordon-ci --input .release/rehearsal-input --report-dir .release/rehearsal-results --jobs 2",
