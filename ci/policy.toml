  "memcordon-core",
  "memcordon-windows-launch-core",
  "memcordon-platform",
  "memcordon",
  "memcordon-testkit",
]
ci_packages = ["memcordon-ci", "memcordon-readiness-verifier", "memcordon-windows-loader-lab", "memcordon-deadline-oracle"]
ci_package_rust_versions = { memcordon-ci = "1.88.0", memcordon-readiness-verifier = "1.88.0", memcordon-windows-loader-lab = "1.85.0", memcordon-deadline-oracle = "1.85.0" }
