[workspace]
production_packages = [
  "memcordon-core",
  "memcordon-platform",
  "memcordon-sealed-agent",
  "memcordon",
  "memcordon-testkit",
]
ci_packages = ["memcordon-ci"]
ci_package_rust_versions = { memcordon-ci = "1.88.0" }
publish_packages = ["memcordon-core", "memcordon-platform", "memcordon"]
non_publish_packages = ["memcordon-sealed-agent", "memcordon-testkit", "memcordon-ci"]

[workflow]
required_public_matrix = [
  "linux-x64",
  "linux-arm64",
  "macos-arm64",
  "macos-x64",
  "windows-x64",
  "windows-arm64",
]
self_extracting_shell_allowlist = []
allowed_run_commands = [
  "rustup toolchain install 1.97.1 --profile minimal",
  "rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt",
  "rustup toolchain install 1.85.0 --profile minimal",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite policy",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite quality",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite msrv",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite native",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite supply-chain",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite miri",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite fuzz",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite stress",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite backend-linux-sealed",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite backend-windows-job",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite backend-macos-watchdog",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite release-preflight",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite release-native",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite release-macos",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- release assemble",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/publish-bootstrap --package memcordon-ci -- release stage-github",
  "target/ci/publish-bootstrap/debug/memcordon-ci release publish-next",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/publish-bootstrap --package memcordon-ci -- release verify-crates",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/publish-bootstrap --package memcordon-ci -- release finalize-github",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/verify-bootstrap --package memcordon-ci -- release verify-public",
]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "GITHUB_TOKEN"
source = "${{ github.token }}"
steps = ["Stage GitHub draft and assets", "Finalize GitHub release"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "CARGO_HOME"
source = "target/ci/cargo-publish-home/slot-1"
steps = ["Publish next crate in slot 1"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "CARGO_REGISTRIES_CRATES_IO_TOKEN"
source = "${{ steps.crates_auth_1.outputs.token }}"
steps = ["Publish next crate in slot 1"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "CARGO_HOME"
source = "target/ci/cargo-publish-home/slot-2"
steps = ["Publish next crate in slot 2"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "CARGO_REGISTRIES_CRATES_IO_TOKEN"
source = "${{ steps.crates_auth_2.outputs.token }}"
steps = ["Publish next crate in slot 2"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "CARGO_HOME"
source = "target/ci/cargo-publish-home/slot-3"
steps = ["Publish next crate in slot 3"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "CARGO_REGISTRIES_CRATES_IO_TOKEN"
source = "${{ steps.crates_auth_3.outputs.token }}"
steps = ["Publish next crate in slot 3"]

[test]
fast_short_child_iterations = 128
deep_short_child_iterations = 4096
release_short_child_iterations = 4096
