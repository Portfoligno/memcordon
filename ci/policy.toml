[workspace]
production_packages = [
  "memcordon-core",
  "memcordon-windows-launch-core",
  "memcordon-platform",
  "memcordon",
  "memcordon-testkit",
]
ci_packages = ["memcordon-ci", "memcordon-windows-loader-lab", "memcordon-deadline-oracle"]
ci_package_rust_versions = { memcordon-ci = "1.88.0", memcordon-windows-loader-lab = "1.85.0", memcordon-deadline-oracle = "1.85.0" }
publish_packages = ["memcordon-core", "memcordon-platform", "memcordon-windows-launch-core", "memcordon"]
non_publish_packages = ["memcordon-testkit", "memcordon-ci", "memcordon-windows-loader-lab", "memcordon-deadline-oracle"]

[workflow]
required_public_matrix = [
  "linux-x64",
  "linux-arm64",
  "macos-arm64",
  "macos-x64",
  "windows-x64",
  "windows-arm64",
]
self_extracting_shell_allowlist = []
allowed_run_commands = [
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci audit-build-context --input target/ci/native-inputs.bin",
  "rustup run 1.97.1 rustc --edition=2021 tools/ci-native-fingerprint.rs -o ci-native-fingerprint.exe",
  "./ci-native-fingerprint.exe --output target/ci/native-inputs.bin",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite macos-deadline",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite backend-linux-cgroup",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite backend-windows-job",
  "rustup toolchain install 1.97.1 --profile minimal",
  "rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt",
  "rustup toolchain install 1.85.0 --profile minimal",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite policy",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite quality",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite msrv",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite native",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite supply-chain",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite miri",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite miri-first",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite miri-second",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite fuzz",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite fuzz-first",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite fuzz-second",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite fuzz-quarter-one",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite fuzz-quarter-two",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite fuzz-quarter-three",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite fuzz-quarter-four",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite stress",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite backend-linux-sealed-v2",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite backend-windows-sealed-v2",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite windows-loader-production",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite windows-provider-lifecycle",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite windows-package-channel",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite windows-loader-production --native-channel required-downloaded-archive",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite windows-provider-lifecycle --native-channel required-downloaded-archive",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite windows-package-channel --native-channel required-downloaded-archive",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite windows-loader-lab",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite package-windows-sealed",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite channel-parity-windows-sealed",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite backend-macos-watchdog",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite release-preflight",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite release-native",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite release-macos",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin release assemble",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin release rehearse-public --bundle target/ci/release-bundle --report target/ci/public-rehearsal/report.json",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/publish-bootstrap --package memcordon-ci -- release stage-github",
  "target/ci/publish-bootstrap/debug/memcordon-ci release attempt-oidc --publication-slot 1",
  "target/ci/publish-bootstrap/debug/memcordon-ci release authorize-new-crate-fallback --publication-slot 1",
  "target/ci/publish-bootstrap/debug/memcordon-ci release publish-token-fallback --publication-slot 1",
  "target/ci/publish-bootstrap/debug/memcordon-ci release attempt-oidc --publication-slot 2",
  "target/ci/publish-bootstrap/debug/memcordon-ci release authorize-new-crate-fallback --publication-slot 2",
  "target/ci/publish-bootstrap/debug/memcordon-ci release publish-token-fallback --publication-slot 2",
  "target/ci/publish-bootstrap/debug/memcordon-ci release attempt-oidc --publication-slot 3",
  "target/ci/publish-bootstrap/debug/memcordon-ci release authorize-new-crate-fallback --publication-slot 3",
  "target/ci/publish-bootstrap/debug/memcordon-ci release publish-token-fallback --publication-slot 3",
  "target/ci/publish-bootstrap/debug/memcordon-ci release attempt-oidc --publication-slot 4",
  "target/ci/publish-bootstrap/debug/memcordon-ci release authorize-new-crate-fallback --publication-slot 4",
  "target/ci/publish-bootstrap/debug/memcordon-ci release publish-token-fallback --publication-slot 4",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/publish-bootstrap --package memcordon-ci -- release verify-crates",
  "rustup run 1.97.1 cargo run --locked --target-dir target/ci/publish-bootstrap --package memcordon-ci -- release finalize-github",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin release verify-public-global",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin release verify-public-host",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin release verify-private-candidate",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin release collect-private-q-certificate --intent /etc/memcordon/release-trust/candidate-collector.v3.json --build target/ci/release-inputs/release-native-linux-x64/private-candidate-linux-x64/candidate-build-v2.json --signing-intent /etc/memcordon/release-trust/native-q-signing.v1.json --credential-fd 3 --output-dir /var/lib/memcordon/release-handoff/q/x64",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin release collect-private-q-certificate --intent /etc/memcordon/release-trust/candidate-collector.v3.json --build target/ci/release-inputs/release-native-linux-arm64/private-candidate-linux-arm64/candidate-build-v2.json --signing-intent /etc/memcordon/release-trust/native-q-signing.v1.json --credential-fd 3 --output-dir /var/lib/memcordon/release-handoff/q/arm64",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin release seal-private-final --intent /etc/memcordon/release-trust/final-seal.v1.json --candidate target/ci/release-inputs/release-native-linux-x64/private-candidate-linux-x64 --qualification target/ci/release-inputs/private-qualified-x64 --output-dir /var/lib/memcordon/release-handoff/seal/x64",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin release seal-private-final --intent /etc/memcordon/release-trust/final-seal.v1.json --candidate target/ci/release-inputs/release-native-linux-arm64/private-candidate-linux-arm64 --qualification target/ci/release-inputs/private-qualified-arm64 --output-dir /var/lib/memcordon/release-handoff/seal/arm64",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin release collect-private-p --intent /etc/memcordon/release-trust/public-collector.v2.json --build target/ci/release-inputs/release-native-linux-x64/private-candidate-linux-x64/candidate-build-v2.json --signing-intent /etc/memcordon/release-trust/public-p-signing.v1.json --credential-fd 3 --output-dir /var/lib/memcordon/release-handoff/p/x64",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin release collect-private-p --intent /etc/memcordon/release-trust/public-collector.v2.json --build target/ci/release-inputs/release-native-linux-arm64/private-candidate-linux-arm64/candidate-build-v2.json --signing-intent /etc/memcordon/release-trust/public-p-signing.v1.json --credential-fd 3 --output-dir /var/lib/memcordon/release-handoff/p/arm64",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin release verify-private-completion --intent /etc/memcordon/release-trust/public-completion.v1.json --qualification /var/lib/memcordon/release-handoff/complete/x64",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin release verify-private-completion --intent /etc/memcordon/release-trust/public-completion.v1.json --qualification /var/lib/memcordon/release-handoff/complete/arm64",
  "sudo -E ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin release install-private-candidate",
  "sudo apt-get update",
  "sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev linux-tools-common",
  "sudo -E ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin build-private-kernel-probe",
  "sudo -E ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite backend-linux-private-v4 --stage candidate-capability --target native --collector-intent-sha256 \"$COLLECTOR_INTENT_SHA256\" --policy-intent-sha256 \"$POLICY_INTENT_SHA256\" --observer-intent /etc/memcordon/release-trust/candidate-observer.v1.json --observer-intent-sha256 \"$OBSERVER_INTENT_SHA256\"",
  "sudo -E ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin release install-private-final --intent /etc/memcordon/release-trust/final-install-intent.v1.json --archive \"$PRIVATE_FINAL_ARCHIVE\"",
  "sudo -E ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite backend-linux-private-v4 --stage candidate-capability --target native",
  "sudo -E ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite backend-linux-private-v4 --stage final-public --target native",
  "sudo -E ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite backend-linux-private-v4 --stage final-public --target native --observer-intent /etc/memcordon/release-trust/public-observer.v2.json --observer-intent-sha256 \"$PUBLIC_OBSERVER_INTENT_SHA256\"",
  "./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite backend-linux-private-v4 --stage final-public --target native",
]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "GITHUB_TOKEN"
source = "${{ github.token }}"
steps = ["Stage GitHub draft and assets", "Finalize GitHub release", "Private candidate suite", "Final installed public source suite on the same enrolled host", "Collect authenticated private Q and CQ", "Seal authenticated private final A", "Collect authenticated private P and CP"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "COLLECTOR_INTENT_SHA256"
source = "${{ inputs[format('collector_intent_sha256_{0}', matrix.id)] }}"
steps = ["Private candidate suite"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "POLICY_INTENT_SHA256"
source = "${{ inputs[format('policy_intent_sha256_{0}', matrix.id)] }}"
steps = ["Private candidate suite"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "OBSERVER_INTENT_SHA256"
source = "${{ inputs[format('observer_intent_sha256_{0}', matrix.id)] }}"
steps = ["Private candidate suite"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "PUBLIC_OBSERVER_INTENT_SHA256"
source = "${{ inputs[format('public_observer_intent_sha256_{0}', matrix.id)] }}"
steps = ["Final installed public source suite on the same enrolled host"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "PRIVATE_FINAL_ARCHIVE"
source = "target/ci/release-inputs/private-final-a-${{ matrix.id }}/memcordon-private-final-${{ matrix.id }}.tar.gz"
steps = ["Install and qualify final archive on this host"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "CARGO_HOME"
source = "target/ci/cargo-publish-home/slot-1"
steps = ["Attempt crates.io OIDC publication in slot 1", "Publish new crate with fallback credential in slot 1"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "CARGO_REGISTRIES_CRATES_IO_TOKEN"
source = "${{ steps.crates_auth_1.outputs.token }}"
steps = ["Attempt crates.io OIDC publication in slot 1"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "CARGO_REGISTRIES_CRATES_IO_TOKEN"
source = "${{ secrets.MEMCORDON_CRATES_IO_NEW_CRATE_FALLBACK }}"
steps = ["Publish new crate with fallback credential in slot 1"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "CARGO_HOME"
source = "target/ci/cargo-publish-home/slot-2"
steps = ["Attempt crates.io OIDC publication in slot 2", "Publish new crate with fallback credential in slot 2"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "CARGO_REGISTRIES_CRATES_IO_TOKEN"
source = "${{ steps.crates_auth_2.outputs.token }}"
steps = ["Attempt crates.io OIDC publication in slot 2"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "CARGO_REGISTRIES_CRATES_IO_TOKEN"
source = "${{ secrets.MEMCORDON_CRATES_IO_NEW_CRATE_FALLBACK }}"
steps = ["Publish new crate with fallback credential in slot 2"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "CARGO_HOME"
source = "target/ci/cargo-publish-home/slot-3"
steps = ["Attempt crates.io OIDC publication in slot 3", "Publish new crate with fallback credential in slot 3"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "CARGO_REGISTRIES_CRATES_IO_TOKEN"
source = "${{ steps.crates_auth_3.outputs.token }}"
steps = ["Attempt crates.io OIDC publication in slot 3"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "CARGO_REGISTRIES_CRATES_IO_TOKEN"
source = "${{ secrets.MEMCORDON_CRATES_IO_NEW_CRATE_FALLBACK }}"
steps = ["Publish new crate with fallback credential in slot 3"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "CARGO_HOME"
source = "target/ci/cargo-publish-home/slot-4"
steps = ["Attempt crates.io OIDC publication in slot 4", "Publish new crate with fallback credential in slot 4"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "CARGO_REGISTRIES_CRATES_IO_TOKEN"
source = "${{ steps.crates_auth_4.outputs.token }}"
steps = ["Attempt crates.io OIDC publication in slot 4"]

[[workflow.environment_allowlist]]
file = ".github/workflows/release.yml"
variable = "CARGO_REGISTRIES_CRATES_IO_TOKEN"
source = "${{ secrets.MEMCORDON_CRATES_IO_NEW_CRATE_FALLBACK }}"
steps = ["Publish new crate with fallback credential in slot 4"]

[test]
fast_short_child_iterations = 128
deep_short_child_iterations = 4096
release_short_child_iterations = 4096
