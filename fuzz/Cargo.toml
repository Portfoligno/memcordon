[package]
name = "memcordon-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
memcordon-core = { path = "../crates/memcordon-core", features = ["test-support"] }
memcordon = { path = "../crates/memcordon-cli" }
memcordon-ci = { path = "../tools/memcordon-ci" }
memcordon-platform = { path = "../crates/memcordon-platform", features = ["test-support"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

