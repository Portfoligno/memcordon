[package]
name = "memcordon-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../../docs/package-readme-platform.md"
description = "Native Linux, macOS, and Windows workload-containment backends for MemCordon"
keywords = ["memory", "cgroup", "job-object", "process"]
categories = ["os", "development-tools"]
publish = ["crates-io"]

[features]
test-support = ["dep:tempfile"]

[dependencies]
libc.workspace = true
memcordon-core = { path = "../memcordon-core", version = "=0.5.2-dev" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[[test]]
name = "test_support"
required-features = ["test-support"]

[[test]]
name = "sealed_exec"
required-features = ["test-support"]

[lints]
workspace = true
