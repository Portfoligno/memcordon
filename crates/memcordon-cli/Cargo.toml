[package]
name = "memcordon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../../docs/package-readme-cli.md"
description = "Cross-platform command memory containment and watchdog CLI"
keywords = ["memory", "process", "cgroup", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]

[features]
test-fixtures = ["memcordon-platform/test-support"]

[[bin]]
name = "memcordon-test-fixture"
path = "src/bin/memcordon-test-fixture.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "memcordon-embedding-fixture"
path = "src/bin/memcordon-embedding-fixture.rs"
required-features = ["test-fixtures"]

[dependencies]
anstream.workspace = true
anstyle.workspace = true
anstyle-query.workspace = true
clap.workspace = true
libc.workspace = true
memcordon-core = { path = "../memcordon-core", version = "=0.5.0-rc.4" }
memcordon-platform = { path = "../memcordon-platform", version = "=0.5.0-rc.4" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
memcordon-testkit = { path = "../memcordon-testkit" }
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
