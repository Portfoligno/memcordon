[package]
name = "memcordon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../../docs/package-readme-cli.md"
description = "Cross-platform command memory containment and watchdog CLI"
keywords = ["memory", "process", "cgroup", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
autobins = false

[features]
test-fixtures = ["memcordon-platform/test-support"]
test-support = ["memcordon-platform/test-support"]

[[bin]]
name = "memcordon"
path = "src/main.rs"

[[bin]]
name = "memcordon-sealed-agent"
path = "src/bin/memcordon-sealed-agent/main.rs"
doc = false

[[bin]]
name = "memcordon-target-desktop-bootstrap"
path = "src/bin/memcordon-target-desktop-bootstrap.rs"
doc = false

[[bin]]
name = "memcordon-session-broker"
path = "src/bin/memcordon-session-broker.rs"
doc = false

[[bin]]
name = "memcordon-test-fixture"
path = "src/bin/memcordon-test-fixture.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "memcordon-sealed-test-fixture"
path = "src/bin/memcordon-sealed-test-fixture.rs"
required-features = ["test-support"]

[[bin]]
name = "memcordon-embedding-fixture"
path = "src/bin/memcordon-embedding-fixture.rs"
required-features = ["test-fixtures"]

[dependencies]
anstream.workspace = true
anstyle.workspace = true
anstyle-query.workspace = true
clap.workspace = true
libc.workspace = true
memcordon-core = { path = "../memcordon-core", version = "=0.5.2-rc.11" }
memcordon-platform = { path = "../memcordon-platform", version = "=0.5.2-rc.11" }
memcordon-windows-launch-core = { path = "../memcordon-windows-launch-core", version = "=0.5.2-rc.11" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
memcordon-testkit = { path = "../memcordon-testkit" }
tempfile.workspace = true
toml.workspace = true

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true
