[workspace]
members = [
    "crates/memcordon-core",
    "crates/memcordon-platform",
    "crates/memcordon-cli",
    "crates/memcordon-testkit",
]
resolver = "2"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5.53", features = ["derive"] }
libc = "0.2.178"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
