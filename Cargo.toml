[workspace]
members = [
    "crates/memcordon-core",
    "crates/memcordon-platform",
    "crates/memcordon-cli",
    "crates/memcordon-testkit",
    "tools/memcordon-ci",
]
resolver = "2"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/Portfoligno/memcordon"
readme = "README.md"

[workspace.dependencies]
clap = { version = "4.5.53", features = ["derive"] }
libc = "0.2.178"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
windows-sys = "0.61.2"
cargo_metadata = "0.19.2"
flate2 = "1.1.2"
hex = "0.4.3"
semver = { version = "1.0.26", features = ["serde"] }
serde_yaml = "0.9.34"
sha2 = "0.10.9"
syn = { version = "2.0.111", features = ["full", "visit"] }
tar = "0.4.44"
tempfile = "3.20.0"
toml = "0.8.23"
ureq = { version = "2.12.1", features = ["json"] }
walkdir = "2.5.0"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
