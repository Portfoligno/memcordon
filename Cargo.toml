[workspace]
members = [
    "crates/memcordon-core",
    "crates/memcordon-platform",
    "crates/memcordon-sealed-agent",
    "crates/memcordon-cli",
    "crates/memcordon-testkit",
    "tools/memcordon-ci",
]
resolver = "2"

[workspace.package]
version = "0.5.1-dev"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/Portfoligno/memcordon"
readme = "README.md"

[workspace.dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anstyle-query = "1.1.5"
base64 = "0.23.1"
clap = { version = "4.5.53", features = ["derive"] }
libc = "0.2.178"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
windows-sys = "0.61.2"
cargo_metadata = "0.23.1"
flate2 = "1.1.2"
hex = "0.4.3"
semver = { version = "1.0.26", features = ["serde"] }
serde_yaml = { package = "yaml_serde", version = "0.10.4" }
sha2 = "0.11.0"
syn = { version = "3.0.3", features = ["full", "visit"] }
tar = "0.4.44"
tempfile = "3.20.0"
toml = "1.1.4"
ureq = { version = "3.3.0", default-features = false, features = ["gzip", "json", "rustls"] }
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(miri)'] }

[workspace.lints.clippy]
all = "warn"
