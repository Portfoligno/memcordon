name: Upload a required artifact with bounded retries
description: Retry transient artifact-service failures without accepting partial uploads.

inputs:
  name:
    description: Artifact name.
    default: artifact
  path:
    description: File, directory, or wildcard pattern to upload.
    required: true
  if-no-files-found:
    description: Behavior when the path matches no files.
    default: warn
  retention-days:
    description: Artifact retention period in days.
    default: "0"
  compression-level:
    description: Zlib compression level from 0 through 9.
    default: "6"
  include-hidden-files:
    description: Whether hidden files are included.
    default: "false"

runs:
  using: composite
  steps:
    - id: initial
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        overwrite: false
    - id: retry-one
      if: ${{ steps.initial.outcome == 'failure' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        overwrite: true
    - id: retry-two
      if: ${{ steps.initial.outcome == 'failure' && steps.retry-one.outcome == 'failure' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        overwrite: true
