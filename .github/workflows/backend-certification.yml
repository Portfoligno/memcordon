name: Native backend tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-performance-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      split: ${{ steps.plan.outputs.macos-split }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: plan
        run: ./target/ci/release/memcordon-ci ci performance-plan

  macos-combined:
    needs: macos-performance-plan
    if: needs.macos-performance-plan.outputs.split == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-x64
            runner: macos-15-intel
          - id: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: macos-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'ci/**', '.cargo/**', 'rust-toolchain.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose macos --shard combined
      - id: compiled
        if: steps.context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/backend-macos
          key: macos-compiled-v1-${{ steps.context.outputs.product-key }}
      - id: native
        run: ./target/ci/release/memcordon-ci suite backend-macos-watchdog
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: macos-combined-${{ matrix.id }}
          path: target/ci/reports
          if-no-files-found: error
          include-hidden-files: true
      - if: always() && steps.context.outputs.compiled-cache-usable == 'true' && steps.native.outputs.cache-quiescent == 'true' && steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/backend-macos
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - if: always() && steps.native.outputs.cache-quiescent == 'true' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.deps.outputs.cache-primary-key }}

  macos-native:
    needs: macos-performance-plan
    if: needs.macos-performance-plan.outputs.split == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-x64
            runner: macos-15-intel
          - id: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: macos-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'ci/**', '.cargo/**', 'rust-toolchain.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose macos --shard native
      - id: compiled
        if: steps.context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/backend-macos
          key: macos-compiled-v1-${{ steps.context.outputs.product-key }}
      - id: native
        run: ./target/ci/release/memcordon-ci suite release-macos-native
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: macos-native-${{ matrix.id }}
          path: target/ci/reports
          if-no-files-found: error
          include-hidden-files: true
      - if: always() && steps.context.outputs.compiled-cache-usable == 'true' && steps.native.outputs.cache-quiescent == 'true' && steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/backend-macos
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - if: always() && steps.native.outputs.cache-quiescent == 'true' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.deps.outputs.cache-primary-key }}

  macos-acceptance:
    needs: macos-performance-plan
    if: needs.macos-performance-plan.outputs.split == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-x64
            runner: macos-15-intel
          - id: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: macos-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'ci/**', '.cargo/**', 'rust-toolchain.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose macos --shard acceptance
      - id: compiled
        if: steps.context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/backend-macos
          key: macos-compiled-v1-${{ steps.context.outputs.product-key }}
      - id: native
        run: ./target/ci/release/memcordon-ci suite release-macos-acceptance
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: macos-acceptance-${{ matrix.id }}
          path: target/ci/reports
          if-no-files-found: error
          include-hidden-files: true
      - if: always() && steps.context.outputs.compiled-cache-usable == 'true' && steps.native.outputs.cache-quiescent == 'true' && steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/backend-macos
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - if: always() && steps.native.outputs.cache-quiescent == 'true' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.deps.outputs.cache-primary-key }}

  macos-assessment:
    if: always()
    needs: [macos-performance-plan, macos-combined, macos-native, macos-acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: macos-*
          path: target/ci/macos-artifacts
          digest-mismatch: error
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - run: ./target/ci/release/memcordon-ci ci aggregate-macos
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: macos-assessment
          path: target/ci/reports/macos-assessment.json
          if-no-files-found: error
          include-hidden-files: true

  windows-payload-x64:
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: [{id: x64}]
    steps: &windows-working-producer
      - name: Configure checkout line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: &windows-working-source-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: working-windows-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'ci/toolchains.toml', 'ci/tools.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose native --shard complete
      - id: products
        if: steps.context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: &windows-working-product-paths |
            target/ci-build/product
            target/ci/native
          key: working-windows-products-${{ steps.context.outputs.product-key }}
      - id: build
        run: ./target/ci/release/memcordon-ci release working-windows-prepare
      - uses: ./.github/actions/upload-artifact
        with:
          name: windows-prepared-${{ matrix.id }}
          path: target/ci/windows-prepared
          if-no-files-found: error
      - if: always() && steps.context.outputs.compiled-cache-usable == 'true' && steps.build.outputs.cache-quiescent == 'true' && steps.products.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *windows-working-product-paths
          key: ${{ steps.products.outputs.cache-primary-key }}
      - if: always() && steps.build.outputs.cache-quiescent == 'true' && steps.sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *windows-working-source-paths
          key: ${{ steps.sources.outputs.cache-primary-key }}

  windows-payload-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: [{id: arm64}]
    steps: *windows-working-producer

  windows-installed-x64:
    needs: windows-payload-x64
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: [{id: x64, channel: native}, {id: x64, channel: cargo}]
    steps: &windows-working-consumer
      - name: Configure checkout line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-prepared-${{ matrix.id }}
          path: target/ci/windows-prepared
          digest-mismatch: error
      - id: sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *windows-working-source-paths
          key: working-windows-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'ci/toolchains.toml', 'ci/tools.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: context
        if: matrix.channel == 'cargo'
        run: ./target/ci/release/memcordon-ci release consumer-cache --target target/ci/windows-prepared/native-payload --packages target/ci/windows-prepared/cargo-payload
      - id: consumers
        if: matrix.channel == 'cargo' && steps.context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci-consumers
          key: working-windows-consumers-${{ steps.context.outputs.consumer-key }}
      - id: native
        if: matrix.channel == 'native'
        run: ./target/ci/release/memcordon-ci release working-windows-consumer --channel native --destination target/ci/windows-installed/native
      - id: cargo
        if: matrix.channel == 'cargo'
        run: ./target/ci/release/memcordon-ci release working-windows-consumer --channel cargo --destination target/ci/windows-installed/cargo
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: windows-installed-${{ matrix.id }}-${{ matrix.channel }}
          path: target/ci/windows-installed
          if-no-files-found: error
          include-hidden-files: true
      - if: always() && matrix.channel == 'cargo' && steps.context.outputs.compiled-cache-usable == 'true' && steps.cargo.outputs.cache-quiescent == 'true' && steps.consumers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci-consumers
          key: ${{ steps.consumers.outputs.cache-primary-key }}
      - if: always() && (steps.native.conclusion == 'skipped' || steps.native.outputs.cache-quiescent == 'true') && (steps.cargo.conclusion == 'skipped' || steps.cargo.outputs.cache-quiescent == 'true') && steps.sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *windows-working-source-paths
          key: ${{ steps.sources.outputs.cache-primary-key }}

  windows-installed-arm64:
    needs: windows-payload-arm64
    runs-on: windows-11-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: [{id: arm64, channel: native}, {id: arm64, channel: cargo}]
    steps: *windows-working-consumer

  private-linux:
    name: Linux private TCP / ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-24.04
          - id: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: private-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ordinary-sources-private-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: private-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose private --shard complete
      - id: private-compiled
        if: steps.private-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci-build
            target/ci-consumers
            target/ci/native
          key: private-native-v1-${{ steps.private-context.outputs.product-key }}
      - id: private-run
        run: ./target/ci/release/memcordon-ci suite backend-linux-private
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: private-installed-${{ matrix.id }}
          path: target/ci/private-installed
          if-no-files-found: error
          include-hidden-files: true
      - if: always() && steps.private-context.outputs.compiled-cache-usable == 'true' && steps.private-run.outputs.cache-quiescent == 'true' && steps.private-compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci-build
            target/ci-consumers
            target/ci/native
          key: ${{ steps.private-compiled.outputs.cache-primary-key }}
      - if: always() && steps.private-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.private-deps.outputs.cache-primary-key }}

  standard-linux:
    name: Linux standard cgroup v2 / x64
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: standard-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ordinary-sources-v1-cargo-deps-backend-standard-v1-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'ci/**', '.cargo/**', 'rust-toolchain.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: backend-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose backend --shard complete
      - id: backend-compiled
        if: steps.backend-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/standard-backend
          key: backend-outputs-v1-${{ steps.backend-context.outputs.product-key }}
      - id: backend-run
        run: ./target/ci/release/memcordon-ci suite backend-linux-cgroup
      - if: always() && steps.backend-context.outputs.compiled-cache-usable == 'true' && steps.backend-run.outputs.cache-quiescent == 'true' && steps.backend-compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/standard-backend
          key: ${{ steps.backend-compiled.outputs.cache-primary-key }}
      - if: always() && steps.standard-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.standard-deps.outputs.cache-primary-key }}

  standard-windows:
    name: Windows standard Job Object / x64
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: standard-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ordinary-sources-v1-cargo-deps-backend-standard-v1-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'ci/**', '.cargo/**', 'rust-toolchain.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: backend-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose backend --shard complete
      - id: backend-compiled
        if: steps.backend-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/standard-backend
          key: backend-outputs-v1-${{ steps.backend-context.outputs.product-key }}
      - id: backend-run
        run: ./target/ci/release/memcordon-ci suite backend-windows-job
      - if: always() && steps.backend-context.outputs.compiled-cache-usable == 'true' && steps.backend-run.outputs.cache-quiescent == 'true' && steps.backend-compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/standard-backend
          key: ${{ steps.backend-compiled.outputs.cache-primary-key }}
      - if: always() && steps.standard-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.standard-deps.outputs.cache-primary-key }}

  standard-windows-arm64:
    name: Windows standard Job Object / arm64
    runs-on: windows-11-arm
    timeout-minutes: 75
    steps:
      - id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: standard-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ordinary-sources-v1-cargo-deps-backend-standard-v1-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'ci/**', '.cargo/**', 'rust-toolchain.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: backend-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose backend --shard complete
      - id: backend-compiled
        if: steps.backend-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/standard-backend
          key: backend-outputs-v1-${{ steps.backend-context.outputs.product-key }}
      - id: backend-run
        run: ./target/ci/release/memcordon-ci suite backend-windows-job
      - if: always() && steps.backend-context.outputs.compiled-cache-usable == 'true' && steps.backend-run.outputs.cache-quiescent == 'true' && steps.backend-compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/standard-backend
          key: ${{ steps.backend-compiled.outputs.cache-primary-key }}
      - if: always() && steps.standard-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.standard-deps.outputs.cache-primary-key }}
