      - if: always() && steps.backend-context.outputs.compiled-cache-usable == 'true' && steps.backend-run.outputs.cache-quiescent == 'true' && steps.backend-compiled.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.backend-compiled.outputs.cache-primary-key != '' && steps.backend-compiled-save-context.outcome == 'success' && steps.backend-compiled-save-context.outputs.product-key == steps.backend-context.outputs.product-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.backend-context.outputs.product-paths }}
          key: ${{ steps.backend-compiled.outputs.cache-primary-key }}
      - if: always() && steps.workspace-download-context.outputs.bootstrap-home-matches == 'true' && steps.standard-deps.outputs.cache-hit != 'true' && success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.standard-deps.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.standard-deps.outputs.cache-primary-key }}

  standard-windows-arm64:
    needs: macos-performance-plan
    if: needs.macos-performance-plan.outputs.standalone-common == 'true'
    name: Windows standard Job Object / arm64
    runs-on: windows-11-arm
    timeout-minutes: 75
    steps:
      - id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: standard-deps
        continue-on-error: true
        if: hashFiles('Cargo.lock') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: mc-download-bootstrap-v5-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'ci/toolchains.toml') }}
          restore-keys: mc-download-bootstrap-v5-${{ runner.os }}-
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: workspace-download-context
        run: ./target/ci/release/memcordon-ci ci download-cache-context --family workspace
      - id: workspace-downloads
        if: steps.workspace-download-context.outputs.source-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-download-context.outputs.source-key }}
          restore-keys: ${{ steps.workspace-download-context.outputs.source-restore-prefix }}
      - id: workspace-fetch
        run: ./target/ci/release/memcordon-ci ci fetch-downloads --family workspace
      - id: backend-context
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose backend --shard complete
      - id: backend-compiled
        continue-on-error: true
        if: steps.backend-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.backend-context.outputs.product-paths }}
          key: ${{ steps.backend-context.outputs.product-key }}
          restore-keys: ${{ steps.backend-context.outputs.product-restore-prefix }}
      - name: Sanitize backend-compiled discard restore
        if: steps.backend-compiled.outcome == 'failure'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose backend --shard complete --mode discard
      - name: Sanitize backend-compiled exact restore
        if: steps.backend-compiled.outcome == 'success' && steps.backend-compiled.outputs.cache-hit == 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose backend --shard complete --mode exact
      - name: Sanitize backend-compiled compatible restore
        if: steps.backend-compiled.outcome == 'success' && steps.backend-compiled.outputs.cache-matched-key != '' && steps.backend-compiled.outputs.cache-hit != 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose backend --shard complete --mode compatible
      - id: backend-run
        run: ./target/ci/release/memcordon-ci suite backend-windows-job
      - id: backend-compiled-save-context
        if: always() && steps.backend-context.outputs.compiled-cache-usable == 'true' && steps.backend-run.outputs.cache-quiescent == 'true' && steps.backend-compiled.outputs.cache-hit != 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose backend --shard complete
      - if: always() && steps.backend-context.outputs.compiled-cache-usable == 'true' && steps.backend-run.outputs.cache-quiescent == 'true' && steps.backend-compiled.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.backend-compiled.outputs.cache-primary-key != '' && steps.backend-compiled-save-context.outcome == 'success' && steps.backend-compiled-save-context.outputs.product-key == steps.backend-context.outputs.product-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.backend-context.outputs.product-paths }}
          key: ${{ steps.backend-compiled.outputs.cache-primary-key }}
      - if: always() && steps.workspace-download-context.outputs.bootstrap-home-matches == 'true' && steps.standard-deps.outputs.cache-hit != 'true' && success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.standard-deps.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.standard-deps.outputs.cache-primary-key }}
