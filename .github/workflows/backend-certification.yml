name: Backend Certification

on:
  schedule:
    - cron: "43 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux cgroup v2
    runs-on: [self-hosted, memcordon, linux, x64, cgroup-v2, ephemeral]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite backend-linux-cgroup
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-linux-cgroup-v2
          path: target/ci/reports/backend-linux-cgroup-v2.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    name: Windows Job Object
    runs-on: [self-hosted, memcordon, windows, x64, job-object, ephemeral]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite backend-windows-job
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-windows-job-object
          path: target/ci/reports/backend-windows-job-object.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
