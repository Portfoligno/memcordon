  tooling-contracts:
    name: Current tooling contracts
    if: github.event.deleted != true
    permissions:
      contents: read
    steps:
      - name: Configure checkout line endings
        run: git config --global core.autocrlf false
        timeout-minutes: 1
      - uses: *action_0
        with:
          persist-credentials: false
        timeout-minutes: 6
      - name: Install pinned Cargo toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
        timeout-minutes: 15
      - id: public-source-seed-restore
        uses: *action_1
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: |-
            target/ci-cargo-home/registry/cache/index.crates.io-1949cf8c6b5b557f/*.crate
            target/ci-cargo-home/registry/cache/index.crates.io-6f17d22bba15001f/*.crate
            target/ci-cargo-home/registry/index/index.crates.io-1949cf8c6b5b557f/.cache
            target/ci-cargo-home/registry/index/index.crates.io-1949cf8c6b5b557f/config.json
          key: mc-ci-public-source-v1-${{ runner.os }}-${{ hashFiles('ci/toolchains.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'tools/*/Cargo.toml', '.cargo/**') }}
          restore-keys: mc-ci-public-source-v1-${{ runner.os }}-${{ hashFiles('ci/toolchains.toml') }}-
      - id: tooling-contracts-restore
        uses: *action_1
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: target/ci-tooling-contracts
          key: mc-tooling-contracts-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/toolchains.toml', 'Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'tools/*/Cargo.toml', '.cargo/**') }}-${{ hashFiles('tools/memcordon-ci/**/*.rs', 'crates/**/*.rs', 'fuzz/Cargo.toml', 'fuzz/corpus/**', '.github/workflows/deep-ci.yml') }}
          restore-keys: mc-tooling-contracts-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/toolchains.toml', 'Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'tools/*/Cargo.toml', '.cargo/**') }}-
      - name: Current external consumer contracts
        run: rustup run 1.97.1 cargo test --locked --target-dir target/ci-tooling-contracts -p memcordon-ci --test external_consumer --test windows_installed_paths --test target_shard --test fuzz_targets --test msrv_source --test workflow_policy
        timeout-minutes: 10
      - id: tooling-contracts-save
        uses: *action_2
        if: always() && steps.tooling-contracts-restore.outcome != 'skipped' && steps.tooling-contracts-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: target/ci-tooling-contracts
          key: mc-tooling-contracts-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/toolchains.toml', 'Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'tools/*/Cargo.toml', '.cargo/**') }}-${{ hashFiles('tools/memcordon-ci/**/*.rs', 'crates/**/*.rs', 'fuzz/Cargo.toml', 'fuzz/corpus/**', '.github/workflows/deep-ci.yml') }}
      - id: current-contracts-source-save
        uses: *action_2
        if: always() && steps.public-source-seed-restore.outputs.cache-primary-key != '' && steps.public-source-seed-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: |-
            target/ci-cargo-home/registry/cache/index.crates.io-1949cf8c6b5b557f/*.crate
            target/ci-cargo-home/registry/cache/index.crates.io-6f17d22bba15001f/*.crate
            target/ci-cargo-home/registry/index/index.crates.io-1949cf8c6b5b557f/.cache
            target/ci-cargo-home/registry/index/index.crates.io-1949cf8c6b5b557f/config.json
          key: ${{ steps.public-source-seed-restore.outputs.cache-primary-key }}
    runs-on: ubuntu-24.04
    timeout-minutes: 47
    env:
      CARGO_HOME: ${{ github.workspace }}/target/ci-cargo-home
