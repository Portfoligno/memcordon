  source-seed:
    name: Public Cargo source seed / ${{ matrix.runner }}
    if: github.event.deleted != true && (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 56
    continue-on-error: true
    env:
      CARGO_HOME: ${{ github.workspace }}/target/ci-cargo-home
    steps:
      - name: Configure checkout line endings
        run: git config --global core.autocrlf false
        timeout-minutes: 1
      - uses: *action_0
        with:
          persist-credentials: false
        timeout-minutes: 6
      - name: Install pinned Cargo toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
        timeout-minutes: 15
      - id: public-source-seed-restore
        uses: *action_1
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: |-
            target/ci-cargo-home/registry/cache/index.crates.io-1949cf8c6b5b557f/*.crate
            target/ci-cargo-home/registry/cache/index.crates.io-6f17d22bba15001f/*.crate
            target/ci-cargo-home/registry/index/index.crates.io-1949cf8c6b5b557f/.cache
            target/ci-cargo-home/registry/index/index.crates.io-1949cf8c6b5b557f/config.json
          key: mc-ci-public-source-v1-${{ runner.os }}-${{ hashFiles('ci/toolchains.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'tools/*/Cargo.toml', '.cargo/**') }}
          restore-keys: mc-ci-public-source-v1-${{ runner.os }}-${{ hashFiles('ci/toolchains.toml') }}-
      - name: Acquire locked public workspace sources
        run: rustup run 1.97.1 cargo fetch --locked
        timeout-minutes: 25
        id: public-source-fetch
      - id: public-source-seed-save
        if: always() && steps.public-source-fetch.outcome == 'success' && steps.public-source-seed-restore.outputs.cache-primary-key != '' && steps.public-source-seed-restore.outputs.cache-hit != 'true' && ((github.event_name == 'push' && ((startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/') || (startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/tags/'))) || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/'))
        uses: *action_2
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: |-
            target/ci-cargo-home/registry/cache/index.crates.io-1949cf8c6b5b557f/*.crate
            target/ci-cargo-home/registry/cache/index.crates.io-6f17d22bba15001f/*.crate
            target/ci-cargo-home/registry/index/index.crates.io-1949cf8c6b5b557f/.cache
            target/ci-cargo-home/registry/index/index.crates.io-1949cf8c6b5b557f/config.json
          key: ${{ steps.public-source-seed-restore.outputs.cache-primary-key }}
