      - name: Save observed registry-archives
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.archive-seed-snapshot.outputs.snapshot-ready == 'true' && steps.archive-seed-snapshot.outputs.seed-compatibility == steps.archive-seed-context.outputs.seed-compatibility && steps.archive-seed-probe.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.archive-seed-snapshot.outputs.snapshot-key }}
          path: ${{ steps.archive-seed-snapshot.outputs.snapshot-path }}
      - if: always() && steps.archive-seed-context.outputs.seed-lookup-key != '' && (steps.native-run.outputs.cache-quiescent == 'true' || steps.native-diagnostic.outputs.cache-quiescent == 'true' || (steps.native-compile.outputs.cache-quiescent == 'true' && steps.native-run.outcome == 'skipped' && steps.native-diagnostic.outcome == 'skipped'))
        run: ./target/ci/release/memcordon-ci ci cleanup-cache-snapshot --kind registry-archives
      - id: index-snapshot-snapshot
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (steps.native-run.outputs.cache-quiescent == 'true' || steps.native-diagnostic.outputs.cache-quiescent == 'true' || (steps.native-compile.outputs.cache-quiescent == 'true' && steps.native-run.outcome == 'skipped' && steps.native-diagnostic.outcome == 'skipped'))
        run: ./target/ci/release/memcordon-ci ci cache-snapshot --kind registry-index
      - id: index-snapshot-probe
        if: always() && steps.index-snapshot-snapshot.outputs.snapshot-ready == 'true' && steps.index-snapshot-snapshot.outputs.seed-compatibility == steps.index-snapshot-context.outputs.seed-compatibility
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.index-snapshot-snapshot.outputs.snapshot-key }}
          path: ${{ steps.index-snapshot-snapshot.outputs.snapshot-path }}
          lookup-only: true
      - name: Save observed registry-index
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.index-snapshot-snapshot.outputs.snapshot-ready == 'true' && steps.index-snapshot-snapshot.outputs.seed-compatibility == steps.index-snapshot-context.outputs.seed-compatibility && steps.index-snapshot-probe.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.index-snapshot-snapshot.outputs.snapshot-key }}
          path: ${{ steps.index-snapshot-snapshot.outputs.snapshot-path }}
      - if: always() && steps.index-snapshot-context.outputs.seed-lookup-key != '' && (steps.native-run.outputs.cache-quiescent == 'true' || steps.native-diagnostic.outputs.cache-quiescent == 'true' || (steps.native-compile.outputs.cache-quiescent == 'true' && steps.native-run.outcome == 'skipped' && steps.native-diagnostic.outcome == 'skipped'))
        run: ./target/ci/release/memcordon-ci ci cleanup-cache-snapshot --kind registry-index
  macos-deadline:
    if: github.event_name != 'push'
    name: macOS deadline / ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: arm64
            runner: macos-15
          - id: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: deadline-deps
        continue-on-error: true
        if: hashFiles('Cargo.lock') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: mc-download-bootstrap-v5-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'ci/toolchains.toml') }}
          restore-keys: mc-download-bootstrap-v5-${{ runner.os }}-
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: workspace-download-context
        run: ./target/ci/release/memcordon-ci ci download-cache-context --family workspace
      - id: workspace-downloads
        if: steps.workspace-download-context.outputs.source-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-download-context.outputs.source-key }}
          restore-keys: ${{ steps.workspace-download-context.outputs.source-restore-prefix }}
      - id: workspace-fetch
        run: ./target/ci/release/memcordon-ci ci fetch-downloads --family workspace
      - id: deadline-context
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose deadline --shard complete
      - id: deadline-compiled
        continue-on-error: true
        if: steps.deadline-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.deadline-context.outputs.product-paths }}
          key: ${{ steps.deadline-context.outputs.product-key }}
          restore-keys: ${{ steps.deadline-context.outputs.product-restore-prefix }}
      - name: Sanitize deadline-compiled discard restore
        if: steps.deadline-compiled.outcome == 'failure'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose deadline --shard complete --mode discard
      - name: Sanitize deadline-compiled exact restore
        if: steps.deadline-compiled.outcome == 'success' && steps.deadline-compiled.outputs.cache-hit == 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose deadline --shard complete --mode exact
      - name: Sanitize deadline-compiled compatible restore
        if: steps.deadline-compiled.outcome == 'success' && steps.deadline-compiled.outputs.cache-matched-key != '' && steps.deadline-compiled.outputs.cache-hit != 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose deadline --shard complete --mode compatible
      - id: deadline-run
        run: ./target/ci/release/memcordon-ci suite macos-deadline
      - id: deadline-compiled-save-context
        if: always() && steps.deadline-context.outputs.compiled-cache-usable == 'true' && steps.deadline-run.outputs.cache-quiescent == 'true' && steps.deadline-compiled.outputs.cache-hit != 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose deadline --shard complete
      - if: always() && success() && steps.deadline-context.outputs.compiled-cache-usable == 'true' && steps.deadline-run.outputs.cache-quiescent == 'true' && steps.deadline-compiled.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.deadline-compiled.outputs.cache-primary-key != '' && steps.deadline-compiled-save-context.outcome == 'success' && steps.deadline-compiled-save-context.outputs.product-key == steps.deadline-context.outputs.product-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.deadline-context.outputs.product-paths }}
          key: ${{ steps.deadline-compiled.outputs.cache-primary-key }}
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: macos-deadline-${{ matrix.id }}
          path: target/ci/deadline-evidence
          if-no-files-found: error
          retention-days: 14
      - if: always() && steps.workspace-download-context.outputs.bootstrap-home-matches == 'true' && steps.deadline-deps.outputs.cache-hit != 'true' && success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.deadline-deps.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.deadline-deps.outputs.cache-primary-key }}
