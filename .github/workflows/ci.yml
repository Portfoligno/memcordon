name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
    inputs:
      failure-mode:
        description: Stop quickly or collect all native test failures
        type: choice
        default: stop-after-failure
        options: [stop-after-failure, collect-all]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    if: github.event_name != 'push'
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Cargo sources
        continue-on-error: true
        if: hashFiles('Cargo.lock') != ''
        id: policy-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: mc-download-bootstrap-v5-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'ci/toolchains.toml') }}
          restore-keys: mc-download-bootstrap-v5-${{ runner.os }}-
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: workspace-download-context
        run: ./target/ci/release/memcordon-ci ci download-cache-context --family workspace
      - id: workspace-downloads
        if: steps.workspace-download-context.outputs.source-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-download-context.outputs.source-key }}
          restore-keys: ${{ steps.workspace-download-context.outputs.source-restore-prefix }}
      - id: workspace-fetch
        run: ./target/ci/release/memcordon-ci ci fetch-downloads --family workspace
      - name: Run repository policy
        run: ./target/ci/release/memcordon-ci suite policy
      - name: Save Cargo sources
        continue-on-error: true
        if: always() && steps.workspace-download-context.outputs.bootstrap-home-matches == 'true' && steps.policy-deps.outputs.cache-hit != 'true' && success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.policy-deps.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.policy-deps.outputs.cache-primary-key }}

  quality:
    if: github.event_name != 'push'
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Cargo sources
        continue-on-error: true
        if: hashFiles('Cargo.lock') != ''
        id: quality-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: mc-download-bootstrap-v5-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'ci/toolchains.toml') }}
          restore-keys: mc-download-bootstrap-v5-${{ runner.os }}-
      - name: Install quality Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: workspace-download-context
        run: ./target/ci/release/memcordon-ci ci download-cache-context --family workspace
      - id: workspace-downloads
        if: steps.workspace-download-context.outputs.source-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-download-context.outputs.source-key }}
          restore-keys: ${{ steps.workspace-download-context.outputs.source-restore-prefix }}
      - id: workspace-fetch
        run: ./target/ci/release/memcordon-ci ci fetch-downloads --family workspace
      - id: quality-context
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose quality --shard complete
      - id: quality-compiled
        continue-on-error: true
        if: steps.quality-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.quality-context.outputs.product-paths }}
          key: ${{ steps.quality-context.outputs.product-key }}
          restore-keys: ${{ steps.quality-context.outputs.product-restore-prefix }}
      - name: Sanitize quality-compiled discard restore
        if: steps.quality-compiled.outcome == 'failure'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose quality --shard complete --mode discard
      - name: Sanitize quality-compiled exact restore
        if: steps.quality-compiled.outcome == 'success' && steps.quality-compiled.outputs.cache-hit == 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose quality --shard complete --mode exact
      - name: Sanitize quality-compiled compatible restore
        if: steps.quality-compiled.outcome == 'success' && steps.quality-compiled.outputs.cache-matched-key != '' && steps.quality-compiled.outputs.cache-hit != 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose quality --shard complete --mode compatible
      - name: Run quality suite
        id: quality-run
        if: github.event_name != 'workflow_dispatch' || inputs.failure-mode != 'collect-all'
        run: ./target/ci/release/memcordon-ci suite quality --failure-mode stop-after-failure
      - name: Run quality suite
        id: quality-run-diagnostic
        if: github.event_name == 'workflow_dispatch' && inputs.failure-mode == 'collect-all'
        run: ./target/ci/release/memcordon-ci suite quality --failure-mode collect-all
      - id: quality-compiled-save-context
        if: always() && steps.quality-context.outputs.compiled-cache-usable == 'true' && (steps.quality-run.outputs.cache-quiescent || steps.quality-run-diagnostic.outputs.cache-quiescent) == 'true' && steps.quality-compiled.outputs.cache-hit != 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose quality --shard complete
      - if: always() && success() && steps.quality-context.outputs.compiled-cache-usable == 'true' && (steps.quality-run.outputs.cache-quiescent || steps.quality-run-diagnostic.outputs.cache-quiescent) == 'true' && steps.quality-compiled.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.quality-compiled.outputs.cache-primary-key != '' && steps.quality-compiled-save-context.outcome == 'success' && steps.quality-compiled-save-context.outputs.product-key == steps.quality-context.outputs.product-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.quality-context.outputs.product-paths }}
          key: ${{ steps.quality-compiled.outputs.cache-primary-key }}
      - name: Save Cargo sources
        continue-on-error: true
        if: always() && steps.workspace-download-context.outputs.bootstrap-home-matches == 'true' && steps.quality-deps.outputs.cache-hit != 'true' && ((steps.quality-run.outputs.cache-quiescent || steps.quality-run-diagnostic.outputs.cache-quiescent) == 'true') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.quality-deps.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.quality-deps.outputs.cache-primary-key }}
      - id: workspace-download-save-context
        if: always() && steps.workspace-downloads.outputs.cache-hit != 'true' && ((steps.quality-run.outputs.cache-quiescent || steps.quality-run-diagnostic.outputs.cache-quiescent) == 'true') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.workspace-downloads.outputs.cache-primary-key != ''
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci download-cache-context --family workspace
      - name: Save complete workspace downloads
        if: always() && steps.workspace-downloads.outputs.cache-hit != 'true' && ((steps.quality-run.outputs.cache-quiescent || steps.quality-run-diagnostic.outputs.cache-quiescent) == 'true') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.workspace-downloads.outputs.cache-primary-key != '' && steps.workspace-download-save-context.outcome == 'success' && steps.workspace-download-save-context.outputs.source-key == steps.workspace-download-context.outputs.source-key && steps.workspace-fetch.outputs.cache-quiescent == 'true' && steps.workspace-fetch.outputs.workspace-downloads-populated == 'true' && steps.workspace-download-save-context.outputs.source-key == steps.workspace-fetch.outputs.workspace-downloads-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-downloads.outputs.cache-primary-key }}

  msrv:
    if: github.event_name != 'push'
    name: MSRV 1.85.0
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Cargo sources
        continue-on-error: true
        if: hashFiles('Cargo.lock') != ''
        id: msrv-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: mc-download-bootstrap-v5-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'ci/toolchains.toml') }}
          restore-keys: mc-download-bootstrap-v5-${{ runner.os }}-
      - name: Install CI driver Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install declared MSRV
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: workspace-download-context
        run: ./target/ci/release/memcordon-ci ci download-cache-context --family workspace
      - id: workspace-downloads
        if: steps.workspace-download-context.outputs.source-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-download-context.outputs.source-key }}
          restore-keys: ${{ steps.workspace-download-context.outputs.source-restore-prefix }}
      - id: workspace-fetch
        run: ./target/ci/release/memcordon-ci ci fetch-downloads --family workspace
      - id: msrv-context
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose msrv --shard complete
      - id: msrv-compiled
        continue-on-error: true
        if: steps.msrv-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.msrv-context.outputs.product-paths }}
          key: ${{ steps.msrv-context.outputs.product-key }}
          restore-keys: ${{ steps.msrv-context.outputs.product-restore-prefix }}
      - name: Sanitize msrv-compiled discard restore
        if: steps.msrv-compiled.outcome == 'failure'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose msrv --shard complete --mode discard
      - name: Sanitize msrv-compiled exact restore
        if: steps.msrv-compiled.outcome == 'success' && steps.msrv-compiled.outputs.cache-hit == 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose msrv --shard complete --mode exact
      - name: Sanitize msrv-compiled compatible restore
        if: steps.msrv-compiled.outcome == 'success' && steps.msrv-compiled.outputs.cache-matched-key != '' && steps.msrv-compiled.outputs.cache-hit != 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose msrv --shard complete --mode compatible
      - name: Run MSRV suite
        id: msrv-run
        if: github.event_name != 'workflow_dispatch' || inputs.failure-mode != 'collect-all'
        run: ./target/ci/release/memcordon-ci suite msrv --failure-mode stop-after-failure
      - name: Run MSRV suite
        id: msrv-run-diagnostic
        if: github.event_name == 'workflow_dispatch' && inputs.failure-mode == 'collect-all'
        run: ./target/ci/release/memcordon-ci suite msrv --failure-mode collect-all
      - id: msrv-compiled-save-context
        if: always() && steps.msrv-context.outputs.compiled-cache-usable == 'true' && (steps.msrv-run.outputs.cache-quiescent || steps.msrv-run-diagnostic.outputs.cache-quiescent) == 'true' && steps.msrv-compiled.outputs.cache-hit != 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose msrv --shard complete
      - if: always() && success() && steps.msrv-context.outputs.compiled-cache-usable == 'true' && (steps.msrv-run.outputs.cache-quiescent || steps.msrv-run-diagnostic.outputs.cache-quiescent) == 'true' && steps.msrv-compiled.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.msrv-compiled.outputs.cache-primary-key != '' && steps.msrv-compiled-save-context.outcome == 'success' && steps.msrv-compiled-save-context.outputs.product-key == steps.msrv-context.outputs.product-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.msrv-context.outputs.product-paths }}
          key: ${{ steps.msrv-compiled.outputs.cache-primary-key }}
      - name: Save Cargo sources
        continue-on-error: true
        if: always() && steps.workspace-download-context.outputs.bootstrap-home-matches == 'true' && steps.msrv-deps.outputs.cache-hit != 'true' && ((steps.msrv-run.outputs.cache-quiescent || steps.msrv-run-diagnostic.outputs.cache-quiescent) == 'true') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.msrv-deps.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.msrv-deps.outputs.cache-primary-key }}
      - id: workspace-download-save-context
        if: always() && steps.workspace-downloads.outputs.cache-hit != 'true' && ((steps.msrv-run.outputs.cache-quiescent || steps.msrv-run-diagnostic.outputs.cache-quiescent) == 'true') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.workspace-downloads.outputs.cache-primary-key != ''
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci download-cache-context --family workspace
      - name: Save complete workspace downloads
        if: always() && steps.workspace-downloads.outputs.cache-hit != 'true' && ((steps.msrv-run.outputs.cache-quiescent || steps.msrv-run-diagnostic.outputs.cache-quiescent) == 'true') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.workspace-downloads.outputs.cache-primary-key != '' && steps.workspace-download-save-context.outcome == 'success' && steps.workspace-download-save-context.outputs.source-key == steps.workspace-download-context.outputs.source-key && steps.workspace-fetch.outputs.cache-quiescent == 'true' && steps.workspace-fetch.outputs.workspace-downloads-populated == 'true' && steps.workspace-download-save-context.outputs.source-key == steps.workspace-fetch.outputs.workspace-downloads-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-downloads.outputs.cache-primary-key }}

  supply-chain:
    if: github.event_name != 'push'
    name: supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Cargo sources
        continue-on-error: true
        if: hashFiles('Cargo.lock') != ''
        id: supply-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: mc-download-bootstrap-v5-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'ci/toolchains.toml') }}
          restore-keys: mc-download-bootstrap-v5-${{ runner.os }}-
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: workspace-download-context
        run: ./target/ci/release/memcordon-ci ci download-cache-context --family workspace
      - id: workspace-downloads
        if: steps.workspace-download-context.outputs.source-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-download-context.outputs.source-key }}
          restore-keys: ${{ steps.workspace-download-context.outputs.source-restore-prefix }}
      - id: archive-seed-context
        run: ./target/ci/release/memcordon-ci ci seed-context --kind registry-archives
      - id: archive-seed-restore
        if: steps.archive-seed-context.outputs.seed-lookup-key != '' && steps.workspace-downloads.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.archive-seed-context.outputs.seed-lookup-key }}
          restore-keys: ${{ steps.archive-seed-context.outputs.seed-restore-prefix }}
          path: ${{ steps.archive-seed-context.outputs.seed-import-path }}
      - if: steps.archive-seed-restore.outcome == 'success' && steps.archive-seed-restore.outputs.cache-matched-key != ''
        run: ./target/ci/release/memcordon-ci ci import-cache-snapshot --kind registry-archives
      - id: index-snapshot-context
        run: ./target/ci/release/memcordon-ci ci seed-context --kind registry-index
      - id: index-snapshot-restore
        if: steps.index-snapshot-context.outputs.seed-lookup-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.index-snapshot-context.outputs.seed-lookup-key }}
          restore-keys: ${{ steps.index-snapshot-context.outputs.seed-restore-prefix }}
          path: ${{ steps.index-snapshot-context.outputs.seed-import-path }}
      - if: steps.index-snapshot-restore.outcome == 'success' && steps.index-snapshot-restore.outputs.cache-matched-key != ''
        run: ./target/ci/release/memcordon-ci ci import-cache-snapshot --kind registry-index
      - id: workspace-fetch
        run: ./target/ci/release/memcordon-ci ci fetch-downloads --family workspace
      - id: supply-context
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose supply --shard complete
      - id: cache-cargo-audit
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose cargo-audit --shard complete
      - id: cache-cargo-audit-downloads
        if: steps.cache-cargo-audit.outputs.source-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.cache-cargo-audit.outputs.source-paths }}
          key: ${{ steps.cache-cargo-audit.outputs.source-key }}
          restore-keys: ${{ steps.cache-cargo-audit.outputs.source-restore-prefix }}
      - id: cache-cargo-audit-binary
        if: steps.cache-cargo-audit.outputs.tool-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.cache-cargo-audit.outputs.tool-path }}
          key: ${{ steps.cache-cargo-audit.outputs.tool-key }}
      - id: cache-cargo-audit-build
        if: steps.cache-cargo-audit.outputs.tool-build-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.cache-cargo-audit.outputs.tool-build-path }}
          key: ${{ steps.cache-cargo-audit.outputs.tool-build-key }}
          restore-keys: ${{ steps.cache-cargo-audit.outputs.tool-build-restore-prefix }}
      - id: cache-cargo-deny
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose cargo-deny --shard complete
      - id: cache-cargo-deny-downloads
        if: steps.cache-cargo-deny.outputs.source-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.cache-cargo-deny.outputs.source-paths }}
          key: ${{ steps.cache-cargo-deny.outputs.source-key }}
          restore-keys: ${{ steps.cache-cargo-deny.outputs.source-restore-prefix }}
      - id: cache-cargo-deny-binary
        if: steps.cache-cargo-deny.outputs.tool-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.cache-cargo-deny.outputs.tool-path }}
          key: ${{ steps.cache-cargo-deny.outputs.tool-key }}
      - id: cache-cargo-deny-build
        if: steps.cache-cargo-deny.outputs.tool-build-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.cache-cargo-deny.outputs.tool-build-path }}
          key: ${{ steps.cache-cargo-deny.outputs.tool-build-key }}
          restore-keys: ${{ steps.cache-cargo-deny.outputs.tool-build-restore-prefix }}
      - name: Run supply-chain suite
        id: supply-run
        if: github.event_name != 'workflow_dispatch' || inputs.failure-mode != 'collect-all'
        run: ./target/ci/release/memcordon-ci suite supply-chain --failure-mode stop-after-failure
      - name: Run supply-chain suite
        id: supply-run-diagnostic
        if: github.event_name == 'workflow_dispatch' && inputs.failure-mode == 'collect-all'
        run: ./target/ci/release/memcordon-ci suite supply-chain --failure-mode collect-all
      - name: Save Cargo sources
        continue-on-error: true
