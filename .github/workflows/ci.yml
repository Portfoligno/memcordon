name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Cargo sources
        id: policy-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'rust-toolchain.toml') }}
      - name: Restore policy target
        id: policy-target
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci
          key: cargo-target-v1-${{ runner.os }}-${{ runner.arch }}-policy-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'tools/**', 'ci/**', '.github/**') }}
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Run repository policy
        run: rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite policy
      - name: Save policy target
        if: always() && steps.policy-target.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci
          key: ${{ steps.policy-target.outputs.cache-primary-key }}
      - name: Save Cargo sources
        if: always() && steps.policy-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.policy-deps.outputs.cache-primary-key }}

  quality:
    name: quality
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Cargo sources
        id: quality-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'rust-toolchain.toml') }}
      - name: Restore quality target
        id: quality-target
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci
          key: cargo-target-v1-${{ runner.os }}-${{ runner.arch }}-quality-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**', 'tools/**', 'ci/**', '.github/workflows/**') }}
      - name: Install quality Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - name: Run quality suite
        run: rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite quality
      - name: Save quality target
        if: always() && steps.quality-target.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci
          key: ${{ steps.quality-target.outputs.cache-primary-key }}
      - name: Save Cargo sources
        if: always() && steps.quality-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.quality-deps.outputs.cache-primary-key }}

  msrv:
    name: MSRV 1.85.0
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Cargo sources
        id: msrv-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-1.85.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore MSRV target
        id: msrv-target
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci
          key: cargo-target-v1-${{ runner.os }}-${{ runner.arch }}-msrv-1.85.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**', 'ci/**') }}
      - name: Install CI driver Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install declared MSRV
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Run MSRV suite
        run: rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite msrv
      - name: Save MSRV target
        if: always() && steps.msrv-target.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci
          key: ${{ steps.msrv-target.outputs.cache-primary-key }}
      - name: Save Cargo sources
        if: always() && steps.msrv-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.msrv-deps.outputs.cache-primary-key }}

  supply-chain:
    name: supply chain
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Cargo sources
        id: supply-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'tools/**/Cargo.toml', 'ci/tools.toml', 'ci/deny.toml') }}
      - name: Restore pinned tools
        id: supply-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci-tools
          key: cargo-tools-v1-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('ci/tools.toml') }}
      - name: Restore supply target
        id: supply-target
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci
          key: cargo-target-v1-${{ runner.os }}-${{ runner.arch }}-supply-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'tools/**', 'ci/**', '.github/**') }}
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Run supply-chain suite
        run: rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite supply-chain
      - name: Save supply target
        if: always() && steps.supply-target.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci
          key: ${{ steps.supply-target.outputs.cache-primary-key }}
      - name: Save pinned tools
        if: always() && steps.supply-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci-tools
          key: ${{ steps.supply-tools.outputs.cache-primary-key }}
      - name: Save Cargo sources
        if: always() && steps.supply-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.supply-deps.outputs.cache-primary-key }}

  native:
    name: native / ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-24.04
          - id: linux-arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - id: macos-arm64
            runner: macos-15
          - id: macos-x64
            runner: macos-15-intel
          - id: windows-x64
            runner: windows-2025
          - id: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Cargo sources
        id: native-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml') }}
      - name: Restore native target
        id: native-target
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci
          key: cargo-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.id }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**', 'tools/**', 'ci/**') }}
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Run native suite
        run: rustup run 1.97.1 cargo run --locked --target-dir target/ci/bootstrap --package memcordon-ci -- suite native
      - name: Save native target
        if: always() && steps.native-target.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci
          key: ${{ steps.native-target.outputs.cache-primary-key }}
      - name: Save Cargo sources
        if: always() && steps.native-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.native-deps.outputs.cache-primary-key }}
