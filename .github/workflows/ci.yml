name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    if: github.event_name != 'push'
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Cargo sources
        id: policy-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ordinary-sources-v1-cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'rust-toolchain.toml') }}
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - name: Run repository policy
        run: ./target/ci/release/memcordon-ci suite policy
      - name: Save Cargo sources
        if: always() && steps.policy-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.policy-deps.outputs.cache-primary-key }}

  quality:
    if: github.event_name != 'push'
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Cargo sources
        id: quality-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ordinary-sources-v1-cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'rust-toolchain.toml') }}
      - name: Install quality Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: quality-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose quality --shard complete
      - id: quality-compiled
        if: steps.quality-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/quality
          key: quality-outputs-v1-${{ steps.quality-context.outputs.product-key }}
      - name: Run quality suite
        id: quality-run
        run: ./target/ci/release/memcordon-ci suite quality
      - if: always() && steps.quality-context.outputs.compiled-cache-usable == 'true' && steps.quality-run.outputs.cache-quiescent == 'true' && steps.quality-compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/quality
          key: ${{ steps.quality-compiled.outputs.cache-primary-key }}
      - name: Save Cargo sources
        if: always() && steps.quality-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.quality-deps.outputs.cache-primary-key }}

  msrv:
    if: github.event_name != 'push'
    name: MSRV 1.85.0
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Cargo sources
        id: msrv-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ordinary-sources-v1-cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-1.85.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Install CI driver Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install declared MSRV
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: msrv-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose msrv --shard complete
      - id: msrv-compiled
        if: steps.msrv-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/msrv
          key: msrv-outputs-v1-${{ steps.msrv-context.outputs.product-key }}
      - name: Run MSRV suite
        id: msrv-run
        run: ./target/ci/release/memcordon-ci suite msrv
      - if: always() && steps.msrv-context.outputs.compiled-cache-usable == 'true' && steps.msrv-run.outputs.cache-quiescent == 'true' && steps.msrv-compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/msrv
          key: ${{ steps.msrv-compiled.outputs.cache-primary-key }}
      - name: Save Cargo sources
        if: always() && steps.msrv-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.msrv-deps.outputs.cache-primary-key }}

  supply-chain:
    if: github.event_name != 'push'
    name: supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Cargo sources
        id: supply-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ordinary-sources-v1-cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'tools/**/Cargo.toml', 'ci/tools.toml', 'ci/deny.toml') }}
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: supply-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose supply --shard complete
      - id: supply-compiled
        if: steps.supply-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci-tools/bin
            target/ci-tools-build
          key: supply-tools-v1-${{ steps.supply-context.outputs.product-key }}
      - name: Run supply-chain suite
        id: supply-run
        run: ./target/ci/release/memcordon-ci suite supply-chain
      - if: always() && steps.supply-context.outputs.compiled-cache-usable == 'true' && steps.supply-run.outputs.cache-quiescent == 'true' && steps.supply-compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci-tools/bin
            target/ci-tools-build
          key: ${{ steps.supply-compiled.outputs.cache-primary-key }}
      - name: Save Cargo sources
        if: always() && steps.supply-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.supply-deps.outputs.cache-primary-key }}

  native:
    if: github.event.deleted != true
    name: native / ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-24.04
          - id: linux-arm64
            runner: ubuntu-24.04-arm
          - id: macos-arm64
            runner: macos-15
          - id: macos-x64
            runner: macos-15-intel
          - id: windows-x64
            runner: windows-2025
          - id: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    # The job budget covers driver compilation, cache setup, and native tests.
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Cargo sources
        id: native-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ordinary-sources-v1-cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml') }}
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: compiled-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose native-debug --shard complete
      - id: compiled
        if: steps.compiled-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/native
            target/debug
            target/release
          key: ${{ steps.compiled-context.outputs.product-key }}
      - name: Run native suite
        id: native-run
        run: ./target/ci/release/memcordon-ci suite native
      - if: always() && steps.compiled-context.outputs.compiled-cache-usable == 'true' && steps.native-run.outputs.cache-quiescent == 'true' && steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/native
            target/debug
            target/release
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - name: Save Cargo sources
        if: always() && steps.native-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.native-deps.outputs.cache-primary-key }}

  macos-deadline:
    if: github.event_name != 'push'
    name: macOS deadline / ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: arm64
            runner: macos-15
          - id: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: deadline-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ordinary-sources-v1-deadline-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', '.cargo/**', 'ci/toolchains.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: deadline-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose deadline --shard complete
      - id: deadline-compiled
        if: steps.deadline-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/deadline-build
            target/ci/deadline-oracle-build
          key: deadline-outputs-v1-${{ steps.deadline-context.outputs.product-key }}
      - id: deadline-run
        run: ./target/ci/release/memcordon-ci suite macos-deadline
      - if: always() && steps.deadline-context.outputs.compiled-cache-usable == 'true' && steps.deadline-run.outputs.cache-quiescent == 'true' && steps.deadline-compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/deadline-build
            target/ci/deadline-oracle-build
          key: ${{ steps.deadline-compiled.outputs.cache-primary-key }}
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: macos-deadline-${{ matrix.id }}
          path: target/ci/deadline-evidence
          if-no-files-found: error
          retention-days: 14
      - if: always() && steps.deadline-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.deadline-deps.outputs.cache-primary-key }}
