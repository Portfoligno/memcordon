          key: ${{ steps.native-deps.outputs.cache-primary-key }}
      - id: workspace-download-save-context
        if: always() && steps.workspace-downloads.outputs.cache-hit != 'true' && (steps.native-run.outputs.cache-quiescent == 'true' || steps.native-diagnostic.outputs.cache-quiescent == 'true') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.workspace-downloads.outputs.cache-primary-key != ''
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci download-cache-context --family workspace
      - name: Save complete workspace downloads
        if: always() && steps.workspace-downloads.outputs.cache-hit != 'true' && (steps.native-run.outputs.cache-quiescent == 'true' || steps.native-diagnostic.outputs.cache-quiescent == 'true') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.workspace-downloads.outputs.cache-primary-key != '' && steps.workspace-download-save-context.outcome == 'success' && steps.workspace-download-save-context.outputs.source-key == steps.workspace-download-context.outputs.source-key && steps.workspace-fetch.outputs.cache-quiescent == 'true' && steps.workspace-fetch.outputs.workspace-downloads-populated == 'true' && steps.workspace-download-save-context.outputs.source-key == steps.workspace-fetch.outputs.workspace-downloads-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-downloads.outputs.cache-primary-key }}

      - id: archive-seed-snapshot
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (steps.native-run.outputs.cache-quiescent == 'true' || steps.native-diagnostic.outputs.cache-quiescent == 'true' || (steps.native-compile.outputs.cache-quiescent == 'true' && steps.native-run.outcome == 'skipped' && steps.native-diagnostic.outcome == 'skipped'))
        run: ./target/ci/release/memcordon-ci ci cache-snapshot --kind registry-archives
      - id: archive-seed-probe
        if: always() && steps.archive-seed-snapshot.outputs.snapshot-ready == 'true' && steps.archive-seed-snapshot.outputs.seed-compatibility == steps.archive-seed-context.outputs.seed-compatibility
        continue-on-error: true
