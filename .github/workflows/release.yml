        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.driver-cold-adopt.outputs.source-complete-key }}
          path: ${{ steps.driver-cold-adopt.outputs.source-complete-path }}
          lookup-only: true
      - id: driver-cold-adopt-source-complete-save
        if: always() && steps.driver-cold-adopt.outputs.source-complete-save == 'true' && steps.driver-cold-adopt-source-complete-probe.outputs.cache-hit != 'true'
