        env:
          CARGO_HOME: target/ci/cargo-publish-home/slot-2
          CARGO_REGISTRIES_CRATES_IO_TOKEN: ${{ steps.crates_auth_2.outputs.token }}
        run: target/ci/publish-bootstrap/debug/memcordon-ci release attempt-oidc --publication-slot 2
      - name: Authorize new-crate token fallback in slot 2
        id: authorize_fallback_2
        if: steps.publish_oidc_2.outcome == 'failure'
        run: target/ci/publish-bootstrap/debug/memcordon-ci release authorize-new-crate-fallback --publication-slot 2
      - name: Publish new crate with fallback credential in slot 2
        if: steps.authorize_fallback_2.outcome == 'success' && steps.authorize_fallback_2.outputs.authorized == 'true'
        env:
          CARGO_HOME: target/ci/cargo-publish-home/slot-2
          CARGO_REGISTRIES_CRATES_IO_TOKEN: ${{ secrets.MEMCORDON_CRATES_IO_NEW_CRATE_FALLBACK }}
        run: target/ci/publish-bootstrap/debug/memcordon-ci release publish-token-fallback --publication-slot 2
      - name: Acquire crates.io token for publication slot 3
        id: crates_auth_3
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Attempt crates.io OIDC publication in slot 3
        id: publish_oidc_3
        continue-on-error: true
        env:
          CARGO_HOME: target/ci/cargo-publish-home/slot-3
          CARGO_REGISTRIES_CRATES_IO_TOKEN: ${{ steps.crates_auth_3.outputs.token }}
        run: target/ci/publish-bootstrap/debug/memcordon-ci release attempt-oidc --publication-slot 3
      - name: Authorize new-crate token fallback in slot 3
        id: authorize_fallback_3
        if: steps.publish_oidc_3.outcome == 'failure'
        run: target/ci/publish-bootstrap/debug/memcordon-ci release authorize-new-crate-fallback --publication-slot 3
      - name: Publish new crate with fallback credential in slot 3
        if: steps.authorize_fallback_3.outcome == 'success' && steps.authorize_fallback_3.outputs.authorized == 'true'
        env:
          CARGO_HOME: target/ci/cargo-publish-home/slot-3
          CARGO_REGISTRIES_CRATES_IO_TOKEN: ${{ secrets.MEMCORDON_CRATES_IO_NEW_CRATE_FALLBACK }}
        run: target/ci/publish-bootstrap/debug/memcordon-ci release publish-token-fallback --publication-slot 3
      - name: Acquire crates.io token for publication slot 4
        id: crates_auth_4
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Attempt crates.io OIDC publication in slot 4
        id: publish_oidc_4
        continue-on-error: true
        env:
          CARGO_HOME: target/ci/cargo-publish-home/slot-4
          CARGO_REGISTRIES_CRATES_IO_TOKEN: ${{ steps.crates_auth_4.outputs.token }}
        run: target/ci/publish-bootstrap/debug/memcordon-ci release attempt-oidc --publication-slot 4
      - name: Authorize new-crate token fallback in slot 4
        id: authorize_fallback_4
        if: steps.publish_oidc_4.outcome == 'failure'
        run: target/ci/publish-bootstrap/debug/memcordon-ci release authorize-new-crate-fallback --publication-slot 4
      - name: Publish new crate with fallback credential in slot 4
        if: steps.authorize_fallback_4.outcome == 'success' && steps.authorize_fallback_4.outputs.authorized == 'true'
        env:
          CARGO_HOME: target/ci/cargo-publish-home/slot-4
          CARGO_REGISTRIES_CRATES_IO_TOKEN: ${{ secrets.MEMCORDON_CRATES_IO_NEW_CRATE_FALLBACK }}
        run: target/ci/publish-bootstrap/debug/memcordon-ci release publish-token-fallback --publication-slot 4
      - name: Upload publication evidence
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: release-publication-evidence
          path: target/ci/publication-evidence/publication-evidence.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
      - run: rustup run 1.97.1 cargo run --locked --target-dir target/ci/publish-bootstrap --package memcordon-ci -- release verify-crates
      - name: Finalize GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: rustup run 1.97.1 cargo run --locked --target-dir target/ci/publish-bootstrap --package memcordon-ci -- release finalize-github
      - uses: ./.github/actions/upload-artifact
        with:
          name: release-publication-report
          path: target/ci/release-bundle/publication-report.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  verify-public:
    name: Release / verify public state / ${{ matrix.id }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-24.04
          - id: windows-x64
            runner: windows-2025
          - id: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out pushed tag
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out dispatched tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-bundle
          path: target/ci/release-bundle
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-publication-report
          path: target/ci/release-bundle
      - id: verify-public-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: managed-sources-v2-cargo-deps-release-verify-public-v2-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'rust-toolchain.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 rustc --edition=2021 tools/ci-native-fingerprint.rs -o ci-native-fingerprint.exe
      - id: build-context-prepare
        run: ./ci-native-fingerprint.exe --output target/ci/native-inputs.bin
      - id: inventory-observation
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: inventory-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            target/ci/reports/inventory-observation/v1/**/run-start.json
            target/ci/reports/inventory-observation/v1/**/phase-*.json
            target/ci/reports/inventory-observation/v1/**/inventory-*.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - id: verify-public-target
        if: steps.build-context-prepare.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/verify-bootstrap
          key: managed-v2-cargo-target-release-verify-public-v2-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('target/ci/native-inputs.bin', 'Cargo.lock', 'Cargo.toml', 'crates/**', 'tools/**', 'ci/**', 'packaging/**', 'rust-toolchain.toml', '.github/workflows/release.yml') }}
      - run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin release verify-public
      - id: build-context-audit
        if: always() && steps.build-context-prepare.outcome == 'success'
        run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci audit-build-context --input target/ci/native-inputs.bin
      - if: always() && steps.verify-public-target.outputs.cache-hit != 'true' && steps.build-context-audit.outcome == 'success' && steps.build-context-prepare.outcome == 'success' && steps.verify-public-target.outputs.cache-primary-key != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/verify-bootstrap
          key: ${{ steps.verify-public-target.outputs.cache-primary-key }}
      - if: always() && steps.verify-public-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: ${{ steps.verify-public-deps.outputs.cache-primary-key }}
