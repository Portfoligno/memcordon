  assemble:
    needs: [select, packages, source-checks, miri, fuzz, native-linux-x64, native-linux-arm64, native-macos-x64, native-macos-arm64, native-windows-x64, native-windows-arm64, installed-linux-x64, installed-linux-arm64, installed-macos-x64, installed-macos-arm64, installed-windows-x64-native, installed-windows-x64-cargo, installed-windows-arm64-native, installed-windows-arm64-cargo]
