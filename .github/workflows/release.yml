      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.recovery-inputs.outputs.tool-artifact-id }}
          run-id: ${{ needs.recovery-inputs.outputs.original-run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: .release/tool
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.recovery-inputs.outputs.prepared-artifact-id }}
          run-id: ${{ needs.recovery-inputs.outputs.original-run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: .release/prepared
          merge-multiple: true
          digest-mismatch: error
      - run: tar -xzf .release/tool/memcordon-publication-tool.tar.gz -C .release/tool
      - id: registry-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish original prepared bytes
        run: ./.release/tool/memcordon-ci release publish
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.registry-auth.outputs.token }}

  published-consumer:
    needs: [select, assemble, publish, recovery-inputs, recovery-publish]
    if: always() && (needs.publish.result == 'success' || needs.recovery-publish.result == 'success') && needs.select.outputs.preparation-kind == 'tagged' && needs.select.outputs.public-consumer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - if: needs.select.outputs.recovery-mode == 'reprepare'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.assemble.outputs.publication-tool-artifact-id }}
          path: .release/tool
          merge-multiple: true
          digest-mismatch: error
      - if: needs.select.outputs.recovery-mode == 'reprepare'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.assemble.outputs.prepared-artifact-id }}
          path: .release/prepared
          merge-multiple: true
          digest-mismatch: error
      - if: needs.select.outputs.recovery-mode == 'publication-only'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.recovery-inputs.outputs.tool-artifact-id }}
          run-id: ${{ needs.recovery-inputs.outputs.original-run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: .release/tool
          merge-multiple: true
          digest-mismatch: error
      - if: needs.select.outputs.recovery-mode == 'publication-only'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.recovery-inputs.outputs.prepared-artifact-id }}
          run-id: ${{ needs.recovery-inputs.outputs.original-run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: .release/prepared
          merge-multiple: true
          digest-mismatch: error
      - run: tar -xzf .release/tool/memcordon-publication-tool.tar.gz -C .release/tool
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: ./.release/tool/memcordon-ci release public-consumer
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-consumer-${{ github.run_id }}
          path: .release/prepared/public-consumer-results
          if-no-files-found: error
          include-hidden-files: true
