      - id: driver-cold-adopt-bootstrap-save
        if: always() && steps.driver-cold-adopt.outputs.bootstrap-save == 'true' && steps.driver-cold-adopt-bootstrap-probe.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.driver-cold-adopt.outputs.bootstrap-key }}
          path: ${{ steps.driver-cold-adopt.outputs.bootstrap-path }}
      - id: driver-cold-adopt-source-complete-probe
        if: always() && steps.driver-cold-adopt.outputs.source-complete-save == 'true'
        continue-on-error: true
