        if: hashFiles('Cargo.lock') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: mc-download-bootstrap-v5-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'ci/toolchains.toml') }}
          restore-keys: mc-download-bootstrap-v5-${{ runner.os }}-
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: workspace-download-context
        run: ./target/ci/release/memcordon-ci ci download-cache-context --family workspace
      - id: workspace-downloads
        if: steps.workspace-download-context.outputs.source-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-download-context.outputs.source-key }}
          restore-keys: ${{ steps.workspace-download-context.outputs.source-restore-prefix }}
      - id: workspace-fetch
        run: ./target/ci/release/memcordon-ci ci fetch-downloads --family workspace
      - if: matrix.producer-job != ''
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin consumer-readiness
      - if: matrix.producer-job != ''
        run: ./target/ci/release/consumer-readiness identity --github-context --build-source .release/build-source.json --output .release/readiness-identity.json
      - id: readiness-cache
        if: matrix.producer-job != ''
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose consumer-readiness --shard candidate
      - id: readiness
        if: matrix.producer-job != ''
        run: ./target/ci/release/consumer-readiness acquire --github-context --driver ./target/ci/release/memcordon-ci --identity .release/readiness-identity.json --destination .release/readiness-cell
      - id: readiness-cleanup
        if: always() && matrix.producer-job != ''
        run: ./target/ci/release/consumer-readiness cleanup --github-context --driver ./target/ci/release/memcordon-ci --identity .release/readiness-identity.json --destination .release/readiness-cell
      - if: always() && matrix.producer-job != ''
        run: ./target/ci/release/consumer-readiness seal-producer --github-context --identity .release/readiness-identity.json --manifest ci/consumer-readiness-v1.toml --cell .release/readiness-cell/cell.json --output .release/readiness-cell/producer-manifest.json
      - id: readiness-upload
        if: always() && matrix.producer-job != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: readiness-${{ matrix.producer-job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/readiness-cell
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
      - id: cache
        if: matrix.producer-job == '' && matrix.channel == 'cargo'
        run: ./target/ci/release/memcordon-ci release consumer-cache --channel cargo --profile readiness
      - id: native-cache
        if: matrix.producer-job == '' && matrix.channel != 'cargo'
        run: ./target/ci/release/memcordon-ci release consumer-cache --channel native --profile readiness
      - id: native
        if: matrix.producer-job == '' && matrix.channel != 'cargo'
        run: ./target/ci/release/memcordon-ci release installed-consumers --channel native --destination .release/installed-results/native
      - id: cargo
        if: matrix.producer-job == '' && matrix.channel != 'native'
        run: ./target/ci/release/memcordon-ci release installed-consumers --channel cargo --destination .release/installed-results/cargo
      - if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installed-results-${{ matrix.target }}-${{ matrix.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/installed-results
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: false
      - if: always() && steps.workspace-download-context.outputs.bootstrap-home-matches == 'true' && matrix.producer-job == '' && (steps.native.conclusion == 'skipped' || steps.native.outputs.cache-quiescent == 'true') && (steps.cargo.conclusion == 'skipped' || steps.cargo.outputs.cache-quiescent == 'true') && steps.deps.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.deps.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - id: workspace-download-save-context
        if: always() && matrix.producer-job == '' && (steps.native.conclusion == 'skipped' || steps.native.outputs.cache-quiescent == 'true') && (steps.cargo.conclusion == 'skipped' || steps.cargo.outputs.cache-quiescent == 'true') && steps.workspace-downloads.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.workspace-downloads.outputs.cache-primary-key != ''
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci download-cache-context --family workspace
      - name: Save complete workspace downloads
        if: always() && matrix.producer-job == '' && (steps.native.conclusion == 'skipped' || steps.native.outputs.cache-quiescent == 'true') && (steps.cargo.conclusion == 'skipped' || steps.cargo.outputs.cache-quiescent == 'true') && steps.workspace-downloads.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.workspace-downloads.outputs.cache-primary-key != '' && steps.workspace-download-save-context.outcome == 'success' && steps.workspace-download-save-context.outputs.source-key == steps.workspace-download-context.outputs.source-key && steps.workspace-fetch.outputs.cache-quiescent == 'true' && steps.workspace-fetch.outputs.workspace-downloads-populated == 'true' && steps.workspace-download-save-context.outputs.source-key == steps.workspace-fetch.outputs.workspace-downloads-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-downloads.outputs.cache-primary-key }}

      - name: Retain bounded preparation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostics-${{ github.job }}-${{ matrix.target }}-${{ matrix.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: *diagnostic-paths
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: false

  candidate-linux-arm64-native:
    name: candidate-linux-arm64-native
    needs: [select, packages, native-linux-arm64]
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, native-job: native-linux-arm64, channel: candidate-native, producer-job: candidate-linux-arm64-native}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    outputs: *readiness-producer-outputs
    steps: *installed-target-steps

  candidate-linux-x64-cargo:
    name: candidate-linux-x64-cargo
    needs: [select, packages, native-linux-x64]
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, native-job: native-linux-x64, channel: candidate-cargo, producer-job: candidate-linux-x64-cargo}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    outputs: *readiness-producer-outputs
    steps: *installed-target-steps

  candidate-linux-arm64-cargo:
    name: candidate-linux-arm64-cargo
    needs: [select, packages, native-linux-arm64]
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, native-job: native-linux-arm64, channel: candidate-cargo, producer-job: candidate-linux-arm64-cargo}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    outputs: *readiness-producer-outputs
    steps: *installed-target-steps

  candidate-windows-x64-native:
