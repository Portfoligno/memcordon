name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing unprefixed release tag
        required: true
        type: string
      recovery-mode:
        description: Rebuild or reuse the original prepared bytes
        required: true
        default: reprepare
        type: choice
        options: [reprepare, publication-only]
      original-run-id:
        description: Original preparation run for publication-only
        type: string
      prepared-artifact-id:
        description: Original immutable prepared artifact id
        type: string
      tool-artifact-id:
        description: Original immutable publication tool artifact id
        type: string

permissions:
  contents: read

concurrency:
  group: memcordon-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      selected-commit: ${{ steps.source.outputs.selected-commit }}
      public-consumer: ${{ steps.source.outputs.public-consumer }}
      recovery-mode: ${{ steps.source.outputs.recovery-mode }}
      tool-artifact-id: ${{ steps.tool.outputs.artifact-id || steps.recovery.outputs.tool-artifact-id }}
      prepared-artifact-id: ${{ steps.recovery.outputs.prepared-artifact-id }}
      original-run-id: ${{ steps.recovery.outputs.original-run-id }}
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: deps
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: release-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'ci/toolchains.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: source
        run: ./target/ci/release/memcordon-ci release select
      - id: recovery
        name: Read original preparation artifacts
        if: steps.source.outputs.recovery-mode == 'publication-only'
        run: ./target/ci/release/memcordon-ci release recovery-inputs
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.source.outputs.recovery-mode == 'reprepare'
        run: ./target/ci/release/memcordon-ci release publication-tool
      - if: steps.source.outputs.recovery-mode == 'reprepare'
        uses: ./.github/actions/upload-artifact
        with:
          name: selected-source-${{ github.run_id }}
          path: .release/source.json
          if-no-files-found: error
      - id: tool
        if: steps.source.outputs.recovery-mode == 'reprepare'
        uses: ./.github/actions/upload-artifact
        with:
          name: publication-tool-${{ github.run_id }}
          path: .release/tool
          if-no-files-found: error
      - if: always() && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.deps.outputs.cache-primary-key }}

  packages:
    needs: select
    if: needs.select.outputs.recovery-mode == 'reprepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: selected-source-${{ github.run_id }}
          path: .release
          digest-mismatch: error
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: &release-check-source-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: release-check-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml', 'ci/toolchains.toml', 'ci/tools.toml', 'rust-toolchain.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - run: ./target/ci/release/memcordon-ci release verify-source
      - id: packages
        run: ./target/ci/release/memcordon-ci release packages
      - uses: ./.github/actions/upload-artifact
        with:
          name: packages-${{ github.run_id }}
          path: .release/packages
          if-no-files-found: error
      - if: always() && steps.packages.outputs.cache-quiescent == 'true' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *release-check-source-paths
          key: ${{ steps.deps.outputs.cache-primary-key }}

  source-checks:
    needs: select
    if: needs.select.outputs.recovery-mode == 'reprepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: selected-source-${{ github.run_id }}
          path: .release
          digest-mismatch: error
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *release-check-source-paths
          key: release-check-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml', 'ci/toolchains.toml', 'ci/tools.toml', 'rust-toolchain.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - run: ./target/ci/release/memcordon-ci release verify-source
      - run: ./target/ci/release/memcordon-ci suite policy
      - id: quality-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose quality --shard complete
      - id: quality-products
        if: steps.quality-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/quality
          key: ${{ steps.quality-context.outputs.product-key }}
      - id: quality
        run: ./target/ci/release/memcordon-ci suite quality
      - run: rustup toolchain install 1.85.0 --profile minimal
      - id: msrv-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose msrv --shard complete
      - id: msrv-products
        if: steps.msrv-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/msrv
          key: ${{ steps.msrv-context.outputs.product-key }}
      - id: msrv
        run: ./target/ci/release/memcordon-ci suite msrv
      - id: supply-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose supply --shard complete
      - id: supply-products
        if: steps.supply-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: &release-check-tool-paths |
            target/ci-tools/bin
            target/ci-tools-build
          key: ${{ steps.supply-context.outputs.product-key }}
      - id: supply
        run: ./target/ci/release/memcordon-ci suite supply-chain
      - if: always() && steps.quality-context.outputs.compiled-cache-usable == 'true' && steps.quality.outputs.cache-quiescent == 'true' && steps.quality-products.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/quality
          key: ${{ steps.quality-products.outputs.cache-primary-key }}
      - if: always() && steps.msrv-context.outputs.compiled-cache-usable == 'true' && steps.msrv.outputs.cache-quiescent == 'true' && steps.msrv-products.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/msrv
          key: ${{ steps.msrv-products.outputs.cache-primary-key }}
      - if: always() && steps.supply-context.outputs.compiled-cache-usable == 'true' && steps.supply.outputs.cache-quiescent == 'true' && steps.supply-products.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *release-check-tool-paths
          key: ${{ steps.supply-products.outputs.cache-primary-key }}
      - if: always() && steps.quality.outputs.cache-quiescent == 'true' && steps.msrv.outputs.cache-quiescent == 'true' && steps.supply.outputs.cache-quiescent == 'true' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *release-check-source-paths
          key: ${{ steps.deps.outputs.cache-primary-key }}

  miri:
    needs: select
    if: needs.select.outputs.recovery-mode == 'reprepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [first, second]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: selected-source-${{ github.run_id }}
          path: .release
          digest-mismatch: error
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *release-check-source-paths
          key: release-check-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml', 'ci/toolchains.toml', 'ci/tools.toml', 'rust-toolchain.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - run: ./target/ci/release/memcordon-ci release verify-source
      - run: ./target/ci/release/memcordon-ci ci prepare --profile miri
      - id: context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose miri --shard complete
      - id: products
        if: steps.context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/miri-*
          key: ${{ steps.context.outputs.product-key }}-${{ matrix.shard }}
      - id: first
        if: matrix.shard == 'first'
        run: ./target/ci/release/memcordon-ci suite miri-first
      - id: second
        if: matrix.shard == 'second'
        run: ./target/ci/release/memcordon-ci suite miri-second
      - if: always() && steps.context.outputs.compiled-cache-usable == 'true' && (steps.first.conclusion == 'skipped' || steps.first.outputs.cache-quiescent == 'true') && (steps.second.conclusion == 'skipped' || steps.second.outputs.cache-quiescent == 'true') && steps.products.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/miri-*
          key: ${{ steps.products.outputs.cache-primary-key }}
      - if: always() && (steps.first.conclusion == 'skipped' || steps.first.outputs.cache-quiescent == 'true') && (steps.second.conclusion == 'skipped' || steps.second.outputs.cache-quiescent == 'true') && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *release-check-source-paths
          key: ${{ steps.deps.outputs.cache-primary-key }}

  fuzz:
    needs: select
    if: needs.select.outputs.recovery-mode == 'reprepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [first, second]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: selected-source-${{ github.run_id }}
          path: .release
          digest-mismatch: error
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *release-check-source-paths
          key: release-check-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml', 'ci/toolchains.toml', 'ci/tools.toml', 'rust-toolchain.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - run: ./target/ci/release/memcordon-ci release verify-source
      - id: prepare
        run: ./target/ci/release/memcordon-ci ci prepare --profile fuzz
      - id: context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose fuzz --shard complete
      - id: products
        if: steps.context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: &release-fuzz-product-paths |
            fuzz/target
            target/ci-tools/bin
            target/ci-tools-build
          key: ${{ steps.context.outputs.product-key }}-${{ matrix.shard }}
      - id: first
        if: matrix.shard == 'first'
        run: ./target/ci/release/memcordon-ci suite fuzz-first
      - id: second
        if: matrix.shard == 'second'
        run: ./target/ci/release/memcordon-ci suite fuzz-second
      - if: always() && steps.context.outputs.compiled-cache-usable == 'true' && steps.prepare.outputs.cache-quiescent == 'true' && (steps.first.conclusion == 'skipped' || steps.first.outputs.cache-quiescent == 'true') && (steps.second.conclusion == 'skipped' || steps.second.outputs.cache-quiescent == 'true') && steps.products.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *release-fuzz-product-paths
          key: ${{ steps.products.outputs.cache-primary-key }}
      - if: always() && steps.prepare.outputs.cache-quiescent == 'true' && (steps.first.conclusion == 'skipped' || steps.first.outputs.cache-quiescent == 'true') && (steps.second.conclusion == 'skipped' || steps.second.outputs.cache-quiescent == 'true') && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *release-check-source-paths
          key: ${{ steps.deps.outputs.cache-primary-key }}

  native-linux-x64:
    needs: select
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps: &native-target-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: selected-source-${{ github.run_id }}
          path: .release
          digest-mismatch: error
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: release-native-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'ci/toolchains.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: cache
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose native --shard complete
      - id: products
        if: steps.cache.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci-build
            target/ci/native
          key: ${{ steps.cache.outputs.product-key }}
      - id: build
        run: ./target/ci/release/memcordon-ci release build-target
      - uses: ./.github/actions/upload-artifact
        with:
          name: native-${{ matrix.target }}-${{ github.run_id }}
          path: .release/target
          if-no-files-found: error
      - if: always() && steps.cache.outputs.compiled-cache-usable == 'true' && steps.build.outputs.cache-quiescent == 'true' && steps.products.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci-build
            target/ci/native
          key: ${{ steps.products.outputs.cache-primary-key }}
      - if: always() && steps.build.outputs.cache-quiescent == 'true' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.deps.outputs.cache-primary-key }}

  native-linux-arm64:
    needs: select
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps: *native-target-steps

  native-macos-x64:
    needs: select
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{target: x86_64-apple-darwin, runner: macos-15-intel}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps: *native-target-steps

  native-macos-arm64:
    needs: select
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{target: aarch64-apple-darwin, runner: macos-15}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps: *native-target-steps

  native-windows-x64:
    needs: select
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{target: x86_64-pc-windows-msvc, runner: windows-2025}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps: *native-target-steps

  native-windows-arm64:
    needs: select
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{target: aarch64-pc-windows-msvc, runner: windows-11-arm}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps: *native-target-steps

  installed-linux-x64:
    needs: [select, packages, native-linux-x64]
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, channel: both}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps: &installed-target-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-${{ matrix.target }}-${{ github.run_id }}
          path: .release/target
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: packages-${{ github.run_id }}
          path: .release/packages
          digest-mismatch: error
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: release-installed-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'ci/toolchains.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: cache
        run: ./target/ci/release/memcordon-ci release consumer-cache
      - id: consumers
        if: steps.cache.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci-consumers
            target/ci-build/private-native-tests
          key: ${{ steps.cache.outputs.consumer-key }}
      - id: native
        if: matrix.channel != 'cargo'
        run: ./target/ci/release/memcordon-ci release installed-consumers --channel native --destination .release/installed-results/native
      - id: cargo
        if: matrix.channel != 'native'
        run: ./target/ci/release/memcordon-ci release installed-consumers --channel cargo --destination .release/installed-results/cargo
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: installed-results-${{ matrix.target }}-${{ matrix.channel }}-${{ github.run_id }}
          path: .release/installed-results
          if-no-files-found: warn
      - if: always() && steps.cache.outputs.compiled-cache-usable == 'true' && (steps.native.conclusion == 'skipped' || steps.native.outputs.cache-quiescent == 'true') && (steps.cargo.conclusion == 'skipped' || steps.cargo.outputs.cache-quiescent == 'true') && steps.consumers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci-consumers
            target/ci-build/private-native-tests
          key: ${{ steps.consumers.outputs.cache-primary-key }}
      - if: always() && (steps.native.conclusion == 'skipped' || steps.native.outputs.cache-quiescent == 'true') && (steps.cargo.conclusion == 'skipped' || steps.cargo.outputs.cache-quiescent == 'true') && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.deps.outputs.cache-primary-key }}

  installed-linux-arm64:
    needs: [select, packages, native-linux-arm64]
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, channel: both}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps: *installed-target-steps

  installed-macos-x64:
    needs: [select, packages, native-macos-x64]
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{target: x86_64-apple-darwin, runner: macos-15-intel, channel: both}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps: *installed-target-steps

  installed-macos-arm64:
    needs: [select, packages, native-macos-arm64]
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{target: aarch64-apple-darwin, runner: macos-15, channel: both}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps: *installed-target-steps

  installed-windows-x64-native:
    needs: [select, packages, native-windows-x64]
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{target: x86_64-pc-windows-msvc, runner: windows-2025, channel: native}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps: *installed-target-steps

  installed-windows-x64-cargo:
    needs: [select, packages, native-windows-x64]
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{target: x86_64-pc-windows-msvc, runner: windows-2025, channel: cargo}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps: *installed-target-steps

  installed-windows-arm64-native:
    needs: [select, packages, native-windows-arm64]
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{target: aarch64-pc-windows-msvc, runner: windows-11-arm, channel: native}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps: *installed-target-steps

  installed-windows-arm64-cargo:
    needs: [select, packages, native-windows-arm64]
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{target: aarch64-pc-windows-msvc, runner: windows-11-arm, channel: cargo}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps: *installed-target-steps

  assemble:
    needs: [select, packages, source-checks, miri, fuzz, native-linux-x64, native-linux-arm64, native-macos-x64, native-macos-arm64, native-windows-x64, native-windows-arm64, installed-linux-x64, installed-linux-arm64, installed-macos-x64, installed-macos-arm64, installed-windows-x64-native, installed-windows-x64-cargo, installed-windows-arm64-native, installed-windows-arm64-cargo]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      prepared-artifact-id: ${{ steps.prepared.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: publication-tool-${{ github.run_id }}
          path: .release/tool
          digest-mismatch: error
      - run: tar -xzf .release/tool/memcordon-publication-tool.tar.gz -C .release/tool
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: selected-source-${{ github.run_id }}
          path: .release
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: packages-${{ github.run_id }}
          path: .release/packages
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: native-*-${{ github.run_id }}
          path: .release/targets
          digest-mismatch: error
      - run: ./.release/tool/memcordon-ci release assemble
      - id: prepared
        uses: ./.github/actions/upload-artifact
        with:
          name: prepared-${{ github.run_id }}
          path: .release/prepared
          if-no-files-found: error

  publish:
    needs: [select, assemble]
    if: always() && needs.select.result == 'success' && (needs.assemble.result == 'success' || needs.select.outputs.recovery-mode == 'publication-only')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: memcordon-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - if: needs.select.outputs.recovery-mode == 'reprepare'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.tool-artifact-id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: .release/tool
          merge-multiple: true
          digest-mismatch: error
      - if: needs.select.outputs.recovery-mode == 'reprepare'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.assemble.outputs.prepared-artifact-id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: .release/prepared
          merge-multiple: true
          digest-mismatch: error
      - if: needs.select.outputs.recovery-mode == 'publication-only'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.tool-artifact-id }}
          run-id: ${{ needs.select.outputs.original-run-id }}
          github-token: ${{ github.token }}
          path: .release/tool
          merge-multiple: true
          digest-mismatch: error
      - if: needs.select.outputs.recovery-mode == 'publication-only'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.prepared-artifact-id }}
          run-id: ${{ needs.select.outputs.original-run-id }}
          github-token: ${{ github.token }}
          path: .release/prepared
          merge-multiple: true
          digest-mismatch: error
      - run: tar -xzf .release/tool/memcordon-publication-tool.tar.gz -C .release/tool
      - id: registry-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish prepared bytes
        run: ./.release/tool/memcordon-ci release publish
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.registry-auth.outputs.token }}

  published-consumer:
    needs: [select, assemble, publish]
    if: always() && needs.publish.result == 'success' && needs.select.outputs.public-consumer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - if: needs.select.outputs.recovery-mode == 'reprepare'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.tool-artifact-id }}
          path: .release/tool
          merge-multiple: true
          digest-mismatch: error
      - if: needs.select.outputs.recovery-mode == 'reprepare'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.assemble.outputs.prepared-artifact-id }}
          path: .release/prepared
          merge-multiple: true
          digest-mismatch: error
      - if: needs.select.outputs.recovery-mode == 'publication-only'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.tool-artifact-id }}
          run-id: ${{ needs.select.outputs.original-run-id }}
          github-token: ${{ github.token }}
          path: .release/tool
          merge-multiple: true
          digest-mismatch: error
      - if: needs.select.outputs.recovery-mode == 'publication-only'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.prepared-artifact-id }}
          run-id: ${{ needs.select.outputs.original-run-id }}
          github-token: ${{ github.token }}
          path: .release/prepared
          merge-multiple: true
          digest-mismatch: error
      - run: tar -xzf .release/tool/memcordon-publication-tool.tar.gz -C .release/tool
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: ./.release/tool/memcordon-ci release public-consumer
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-consumer-${{ github.run_id }}
          path: .release/prepared/public-consumer-results
          if-no-files-found: error
          include-hidden-files: true
