        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.driver-cold-adopt-windows.outputs.archives-partial-key }}
          path: ${{ steps.driver-cold-adopt-windows.outputs.archives-partial-path }}
      - id: driver-cold-adopt-windows-index-partial-save
        if: always() && steps.driver-cold-adopt-windows.outputs.index-partial-save == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.driver-cold-adopt-windows.outputs.index-partial-key }}
          path: ${{ steps.driver-cold-adopt-windows.outputs.index-partial-path }}
      - id: driver-cold-cleanup-windows
        if: always() && steps.driver-cold-adopt-windows.outcome == 'success'
        timeout-minutes: 2
        run: ./target/ci-runtime/current/memcordon-ci.exe ci driver-cleanup
      - id: driver-workflows-check-windows
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: ./target/ci-runtime/current/memcordon-ci.exe ci workflows --check
      - id: readiness-tools-bind
        timeout-minutes: 5
        run: ./target/ci-runtime/current/memcordon-ci.exe ci preparation-tools package --kind readiness
      - id: readiness-tools-package
        timeout-minutes: 5
        run: tar -czf target/readiness-tools.tar.gz target/ci-runtime/current target/ci-driver-cold/release/consumer-readiness.exe target/ci/release/consumer-readiness.exe target/ci-preparation/readiness.json
      - id: readiness-tools-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 6
        with:
          name: readiness-tools-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/readiness-tools.tar.gz
          if-no-files-found: error
          overwrite: false
    outputs:
      artifact-id: ${{ steps.readiness-tools-upload.outputs.artifact-id }}
  readiness-tools-windows-arm64:
    name: Readiness helper / windows-arm64
    needs: select
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{"target": "aarch64-pc-windows-msvc", "runner": "windows-11-arm", "producer-job": "native-windows-arm64"}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 108
    steps:
      - name: Configure checkout line endings
        run: git config --global core.autocrlf false
        timeout-minutes: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          fetch-depth: 0
          persist-credentials: false
        timeout-minutes: 6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.selection-artifact-id }}
          path: .release
          merge-multiple: true
          digest-mismatch: error
        timeout-minutes: 6
      - id: deps
        continue-on-error: true
        if: hashFiles('Cargo.lock') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: mc-download-bootstrap-v5-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'ci/toolchains.toml') }}
          restore-keys: mc-download-bootstrap-v5-${{ runner.os }}-
        timeout-minutes: 2
      - run: rustup toolchain install 1.97.1 --profile minimal
        timeout-minutes: 15
      - id: driver-cold-build-windows
        if: runner.os == 'Windows'
        timeout-minutes: 30
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci-driver-cold -p memcordon-ci --bin memcordon-ci --bin consumer-readiness
      - id: driver-cold-adopt-windows
        if: steps.driver-cold-build-windows.outcome == 'success'
        timeout-minutes: 15
        run: ./target/ci-driver-cold/release/memcordon-ci.exe ci driver-adopt-cold
      - id: driver-cold-adopt-windows-bootstrap-probe
        if: always() && steps.driver-cold-adopt-windows.outputs.bootstrap-save == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.driver-cold-adopt-windows.outputs.bootstrap-key }}
          path: ${{ steps.driver-cold-adopt-windows.outputs.bootstrap-path }}
          lookup-only: true
      - id: driver-cold-adopt-windows-bootstrap-save
        if: always() && steps.driver-cold-adopt-windows.outputs.bootstrap-save == 'true' && steps.driver-cold-adopt-windows-bootstrap-probe.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.driver-cold-adopt-windows.outputs.bootstrap-key }}
          path: ${{ steps.driver-cold-adopt-windows.outputs.bootstrap-path }}
      - id: driver-cold-adopt-windows-source-complete-probe
        if: always() && steps.driver-cold-adopt-windows.outputs.source-complete-save == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.driver-cold-adopt-windows.outputs.source-complete-key }}
          path: ${{ steps.driver-cold-adopt-windows.outputs.source-complete-path }}
          lookup-only: true
      - id: driver-cold-adopt-windows-source-complete-save
        if: always() && steps.driver-cold-adopt-windows.outputs.source-complete-save == 'true' && steps.driver-cold-adopt-windows-source-complete-probe.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.driver-cold-adopt-windows.outputs.source-complete-key }}
          path: ${{ steps.driver-cold-adopt-windows.outputs.source-complete-path }}
      - id: driver-cold-adopt-windows-archives-partial-save
        if: always() && steps.driver-cold-adopt-windows.outputs.archives-partial-save == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.driver-cold-adopt-windows.outputs.archives-partial-key }}
          path: ${{ steps.driver-cold-adopt-windows.outputs.archives-partial-path }}
      - id: driver-cold-adopt-windows-index-partial-save
        if: always() && steps.driver-cold-adopt-windows.outputs.index-partial-save == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.driver-cold-adopt-windows.outputs.index-partial-key }}
          path: ${{ steps.driver-cold-adopt-windows.outputs.index-partial-path }}
      - id: driver-cold-cleanup-windows
        if: always() && steps.driver-cold-adopt-windows.outcome == 'success'
        timeout-minutes: 2
        run: ./target/ci-runtime/current/memcordon-ci.exe ci driver-cleanup
      - id: driver-workflows-check-windows
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: ./target/ci-runtime/current/memcordon-ci.exe ci workflows --check
      - id: readiness-tools-bind
        timeout-minutes: 5
        run: ./target/ci-runtime/current/memcordon-ci.exe ci preparation-tools package --kind readiness
      - id: readiness-tools-package
        timeout-minutes: 5
        run: tar -czf target/readiness-tools.tar.gz target/ci-runtime/current target/ci-driver-cold/release/consumer-readiness.exe target/ci/release/consumer-readiness.exe target/ci-preparation/readiness.json
      - id: readiness-tools-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 6
        with:
          name: readiness-tools-windows-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/readiness-tools.tar.gz
          if-no-files-found: error
          overwrite: false
    outputs:
      artifact-id: ${{ steps.readiness-tools-upload.outputs.artifact-id }}
