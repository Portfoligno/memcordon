    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    outputs: *readiness-producer-outputs
    steps: *installed-target-steps

  candidate-windows-x64-cargo:
    name: candidate-windows-x64-cargo
    needs: [select, packages, native-windows-x64]
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{target: x86_64-pc-windows-msvc, runner: windows-2025, native-job: native-windows-x64, channel: candidate-cargo, producer-job: candidate-windows-x64-cargo}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    outputs: *readiness-producer-outputs
    steps: *installed-target-steps

  candidate-windows-arm64-native:
    name: candidate-windows-arm64-native
    needs: [select, packages, native-windows-arm64]
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{target: aarch64-pc-windows-msvc, runner: windows-11-arm, native-job: native-windows-arm64, channel: candidate-native, producer-job: candidate-windows-arm64-native}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    outputs: *readiness-producer-outputs
    steps: *installed-target-steps

  candidate-windows-arm64-cargo:
    name: candidate-windows-arm64-cargo
    needs: [select, packages, native-windows-arm64]
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include: [{target: aarch64-pc-windows-msvc, runner: windows-11-arm, native-job: native-windows-arm64, channel: candidate-cargo, producer-job: candidate-windows-arm64-cargo}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    outputs: *readiness-producer-outputs
    steps: *installed-target-steps

  assemble-payload:
    needs: [select, packages, native-linux-x64, native-linux-arm64, native-macos-x64, native-macos-arm64, native-windows-x64, native-windows-arm64]
    if: needs.select.outputs.recovery-mode == 'reprepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      assembled-artifact-id: ${{ steps.assembled.outputs.artifact-id }}
    steps:
      - run: rustup toolchain install 1.97.1 --profile minimal
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.preparation-tool-artifact-id }}
          path: .release/tool
          merge-multiple: true
          digest-mismatch: error
      - run: tar -xzf .release/tool/memcordon-publication-tool.tar.gz -C .release/tool
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.selection-artifact-id }}
          path: .release
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.packages.outputs.artifact-id }}
          path: .release/packages
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.native-linux-x64.outputs.artifact-id }}
          path: .release/targets/linux-x64
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.native-linux-arm64.outputs.artifact-id }}
          path: .release/targets/linux-arm64
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.native-macos-x64.outputs.artifact-id }}
          path: .release/targets/macos-x64
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.native-macos-arm64.outputs.artifact-id }}
          path: .release/targets/macos-arm64
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.native-windows-x64.outputs.artifact-id }}
          path: .release/targets/windows-x64
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.native-windows-arm64.outputs.artifact-id }}
          path: .release/targets/windows-arm64
          merge-multiple: true
          digest-mismatch: error
      - run: ./.release/tool/memcordon-ci release assemble --build-source .release/build-source.json --consumer-readiness --destination .release/assembled
      - id: assembled
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assembled-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/assembled
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false

      - name: Retain bounded preparation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostics-assemble-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: *diagnostic-paths
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: false

  assemble:
    needs: [select, packages, source-checks, msrv, supply-chain, assemble-payload, rehearse, miri, fuzz, native-linux-x64, native-linux-arm64, native-macos-x64, native-macos-arm64, native-windows-x64, native-windows-arm64, candidate-linux-x64-native, candidate-linux-x64-cargo, candidate-linux-arm64-native, candidate-linux-arm64-cargo, installed-macos-x64-native, installed-macos-x64-cargo, installed-macos-arm64-native, installed-macos-arm64-cargo, candidate-windows-x64-native, candidate-windows-x64-cargo, candidate-windows-arm64-native, candidate-windows-arm64-cargo]
    if: needs.select.outputs.recovery-mode == 'reprepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      candidate-artifact-id: ${{ steps.candidate.outputs.artifact-id }}
      prepared-artifact-id: ${{ steps.prepared.outputs.artifact-id }}
      publication-tool-artifact-id: ${{ steps.publication-tool.outputs.artifact-id }}
    steps:
      - run: rustup toolchain install 1.97.1 --profile minimal
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.preparation-tool-artifact-id }}
          path: .release/tool
          merge-multiple: true
          digest-mismatch: error
      - run: tar -xzf .release/tool/memcordon-publication-tool.tar.gz -C .release/tool
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.selection-artifact-id }}
          path: .release
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.assemble-payload.outputs.assembled-artifact-id }}
          path: .release/assembled
          merge-multiple: true
          digest-mismatch: error
      - run: ./.release/tool/memcordon-ci release finalize-preparation --build-source .release/build-source.json --input .release/assembled --publisher-archive .release/tool/memcordon-publication-tool.tar.gz --destination .release/final
      - id: candidate
        if: needs.select.outputs.preparation-kind == 'candidate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/final/candidate
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          overwrite: false
      - id: prepared
        if: needs.select.outputs.preparation-kind == 'tagged'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/final/prepared
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
      - id: publication-tool
        if: needs.select.outputs.preparation-kind == 'tagged'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publication-tool-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/final/tool/memcordon-publication-tool.tar.gz
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false

      - name: Retain bounded preparation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: *diagnostic-paths
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: false

  rehearse:
    name: Release rehearsal
    needs: [select, assemble-payload, rehearsal-tool]
    if: needs.select.outputs.recovery-mode == 'reprepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.rehearsal-tool.outputs.artifact-id }}
          path: .release/rehearsal-tool
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.preparation-tool-artifact-id }}
          path: .release/tool
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.assemble-payload.outputs.assembled-artifact-id }}
          path: .release/rehearsal-input
          merge-multiple: true
          digest-mismatch: error
      - run: tar -xzf .release/rehearsal-tool/memcordon-release-rehearsal.tar.gz -C .release/rehearsal-tool
      - run: tar -xzf .release/tool/memcordon-publication-tool.tar.gz -C .release/tool
      - id: rehearsal
        run: ./.release/rehearsal-tool/memcordon-release-rehearsal run --publisher .release/tool/memcordon-ci --input .release/rehearsal-input --report-dir .release/rehearsal-results --jobs 2
      - name: Retain rehearsal diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/rehearsal-results
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
          overwrite: false

  recovery-inputs:
    needs: select
    if: needs.select.outputs.preparation-kind == 'tagged' && needs.select.outputs.recovery-mode == 'publication-only' && github.event_name == 'workflow_dispatch' && inputs.preparation-mode == 'release' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      original-run-id: ${{ steps.recovery.outputs.original-run-id }}
      prepared-artifact-id: ${{ steps.recovery.outputs.prepared-artifact-id }}
      tool-artifact-id: ${{ steps.recovery.outputs.tool-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.preparation-tool-artifact-id }}
          path: .release/tool
          merge-multiple: true
          digest-mismatch: error
      - run: tar -xzf .release/tool/memcordon-publication-tool.tar.gz -C .release/tool
      - run: ./.release/tool/memcordon-ci release select-preparation
      - id: recovery
        name: Read original preparation artifacts
        run: ./.release/tool/memcordon-ci release recovery-inputs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Retain bounded preparation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: *diagnostic-paths
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: false

  recovery-rehearse:
    name: Release recovery rehearsal
    needs: [select, recovery-inputs, rehearsal-tool]
    if: needs.select.outputs.preparation-kind == 'tagged' && needs.select.outputs.recovery-mode == 'publication-only' && github.event_name == 'workflow_dispatch' && inputs.preparation-mode == 'release' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.rehearsal-tool.outputs.artifact-id }}
          path: .release/rehearsal-tool
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.recovery-inputs.outputs.tool-artifact-id }}
          run-id: ${{ needs.recovery-inputs.outputs.original-run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: .release/tool
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.recovery-inputs.outputs.prepared-artifact-id }}
          run-id: ${{ needs.recovery-inputs.outputs.original-run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: .release/rehearsal-input
          merge-multiple: true
          digest-mismatch: error
      - run: tar -xzf .release/rehearsal-tool/memcordon-release-rehearsal.tar.gz -C .release/rehearsal-tool
      - run: tar -xzf .release/tool/memcordon-publication-tool.tar.gz -C .release/tool
      - id: rehearsal
        run: ./.release/rehearsal-tool/memcordon-release-rehearsal run --publisher .release/tool/memcordon-ci --input .release/rehearsal-input --report-dir .release/rehearsal-results --jobs 2
      - name: Retain recovery rehearsal diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovery-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/rehearsal-results
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
          overwrite: false

  publish:
    needs: [select, assemble, rehearse]
    if: needs.select.outputs.preparation-kind == 'tagged' && needs.select.outputs.recovery-mode == 'reprepare' && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' && inputs.preparation-mode == 'release' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: memcordon-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.assemble.outputs.publication-tool-artifact-id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: .release/tool
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.assemble.outputs.prepared-artifact-id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: .release/prepared
          merge-multiple: true
          digest-mismatch: error
      - run: tar -xzf .release/tool/memcordon-publication-tool.tar.gz -C .release/tool
      - id: registry-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish prepared bytes
        run: ./.release/tool/memcordon-ci release publish
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.registry-auth.outputs.token }}

  recovery-publish:
    needs: [select, recovery-inputs, recovery-rehearse]
    if: needs.select.outputs.preparation-kind == 'tagged' && needs.select.outputs.recovery-mode == 'publication-only' && github.event_name == 'workflow_dispatch' && inputs.preparation-mode == 'release' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: memcordon-publication
      cancel-in-progress: false
