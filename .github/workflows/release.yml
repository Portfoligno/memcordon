      - name: Acquire crates.io token for publication slot 1
        id: crates_auth_1
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Attempt crates.io OIDC publication in slot 1
        id: publish_oidc_1
        continue-on-error: true
        env:
          CARGO_HOME: target/ci/cargo-publish-home/slot-1
          CARGO_REGISTRIES_CRATES_IO_TOKEN: ${{ steps.crates_auth_1.outputs.token }}
        run: target/ci/publish-bootstrap/debug/memcordon-ci release attempt-oidc --publication-slot 1
      - name: Authorize new-crate token fallback in slot 1
        id: authorize_fallback_1
        if: steps.publish_oidc_1.outcome == 'failure'
        run: target/ci/publish-bootstrap/debug/memcordon-ci release authorize-new-crate-fallback --publication-slot 1
      - name: Publish new crate with fallback credential in slot 1
        if: steps.authorize_fallback_1.outcome == 'success' && steps.authorize_fallback_1.outputs.authorized == 'true'
        env:
          CARGO_HOME: target/ci/cargo-publish-home/slot-1
          CARGO_REGISTRIES_CRATES_IO_TOKEN: ${{ secrets.MEMCORDON_CRATES_IO_NEW_CRATE_FALLBACK }}
        run: target/ci/publish-bootstrap/debug/memcordon-ci release publish-token-fallback --publication-slot 1
      - name: Acquire crates.io token for publication slot 2
        id: crates_auth_2
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Attempt crates.io OIDC publication in slot 2
        id: publish_oidc_2
