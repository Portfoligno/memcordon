name: Release

on:
  push:
    branches: ["**"]
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      preparation-mode:
        description: Candidate preparation or an existing tagged release
        required: true
        default: release
        type: choice
        options: [candidate, release]
      tag:
        description: Existing unprefixed release tag; release mode only
        required: false
        type: string
      recovery-mode:
        description: Rebuild or reuse the original prepared bytes
        required: true
        default: reprepare
        type: choice
        options: [reprepare, publication-only]
      original-run-id:
        description: Original preparation run for publication-only
        type: string
      prepared-artifact-id:
        description: Original immutable prepared artifact id
        type: string
      tool-artifact-id:
        description: Original immutable publication tool artifact id
        type: string

permissions:
  contents: read

concurrency:
  group: memcordon-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}

jobs:
  select:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      selected-commit: ${{ steps.source.outputs.selected-commit }}
      public-consumer: ${{ steps.source.outputs.public-consumer }}
      recovery-mode: ${{ steps.source.outputs.recovery-mode }}
      preparation-kind: ${{ steps.source.outputs.preparation-kind }}
      selection-artifact-id: ${{ steps.selection.outputs.artifact-id }}
      preparation-tool-artifact-id: ${{ steps.tool.outputs.artifact-id }}
      rehearsal-tool-artifact-id: ${{ steps.rehearsal-tool.outputs.artifact-id }}
    steps:
      - name: Configure checkout line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: deps
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: release-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'ci/toolchains.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci --bin memcordon-release-rehearsal
      - id: source
        run: ./target/ci/release/memcordon-ci release select-preparation
      - name: Package the rehearsal helper
        run: ./target/ci/release/memcordon-ci release rehearsal-tool
      - id: rehearsal-tool
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rehearsal-tool-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/rehearsal-tool/memcordon-release-rehearsal.tar.gz
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
      - if: steps.source.outputs.recovery-mode == 'reprepare'
        run: ./target/ci/release/memcordon-ci release publication-tool
      - id: selection
        if: steps.source.outputs.recovery-mode == 'reprepare'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: selected-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release/build-source.json
            .release/source.json
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
      - id: tool
        if: steps.source.outputs.recovery-mode == 'reprepare'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preparation-tool-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/tool
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
      - if: always() && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Retain bounded preparation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: &diagnostic-paths |
            target/ci/reports/execution
            target/ci/deadline-evidence
            target/ci/reports/release-macos-native.json
            target/ci/reports/release-macos-acceptance.json
            target/ci/reports/backend-macos-watchdog.json
            target/ci/reports/memcordon-macos-acceptance-*
            .release/installed-results
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: false

  packages:
    needs: select
    if: needs.select.outputs.recovery-mode == 'reprepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.payload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.select.outputs.selection-artifact-id }}
          path: .release
          merge-multiple: true
          digest-mismatch: error
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: &release-check-source-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: release-check-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml', 'ci/toolchains.toml', 'ci/tools.toml', 'rust-toolchain.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - run: ./target/ci/release/memcordon-ci release verify-source --build-source .release/build-source.json
      - id: packages
        run: ./target/ci/release/memcordon-ci release packages --build-source .release/build-source.json
      - id: payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/packages
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
      - if: always() && steps.packages.outputs.cache-quiescent == 'true' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *release-check-source-paths
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Retain bounded preparation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: *diagnostic-paths
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: false

  source-checks:
    needs: select
    if: needs.select.outputs.recovery-mode == 'reprepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.select.outputs.selection-artifact-id }}
          path: .release
          merge-multiple: true
          digest-mismatch: error
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *release-check-source-paths
          key: release-check-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml', 'ci/toolchains.toml', 'ci/tools.toml', 'rust-toolchain.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - run: ./target/ci/release/memcordon-ci release verify-source --build-source .release/build-source.json
      - run: ./target/ci/release/memcordon-ci suite policy
      - id: quality-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose quality --shard complete
      - id: quality-products
        if: steps.quality-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/quality
          key: ${{ steps.quality-context.outputs.product-key }}
      - id: quality
        run: ./target/ci/release/memcordon-ci suite quality
      - run: rustup toolchain install 1.85.0 --profile minimal
      - id: msrv-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose msrv --shard complete
      - id: msrv-products
        if: steps.msrv-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/msrv
          key: ${{ steps.msrv-context.outputs.product-key }}
      - id: msrv
        run: ./target/ci/release/memcordon-ci suite msrv
      - id: supply-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose supply --shard complete
      - id: supply-products
        if: steps.supply-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: &release-check-tool-paths |
            target/ci-tools/bin
            target/ci-tools-build
          key: ${{ steps.supply-context.outputs.product-key }}
      - id: supply
        run: ./target/ci/release/memcordon-ci suite supply-chain
      - if: always() && steps.quality-context.outputs.compiled-cache-usable == 'true' && steps.quality.outputs.cache-quiescent == 'true' && steps.quality-products.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/quality
          key: ${{ steps.quality-products.outputs.cache-primary-key }}
      - if: always() && steps.msrv-context.outputs.compiled-cache-usable == 'true' && steps.msrv.outputs.cache-quiescent == 'true' && steps.msrv-products.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/msrv
          key: ${{ steps.msrv-products.outputs.cache-primary-key }}
      - if: always() && steps.supply-context.outputs.compiled-cache-usable == 'true' && steps.supply.outputs.cache-quiescent == 'true' && steps.supply-products.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *release-check-tool-paths
          key: ${{ steps.supply-products.outputs.cache-primary-key }}
      - if: always() && steps.quality.outputs.cache-quiescent == 'true' && steps.msrv.outputs.cache-quiescent == 'true' && steps.supply.outputs.cache-quiescent == 'true' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *release-check-source-paths
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Retain bounded preparation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: *diagnostic-paths
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: false

  miri:
    needs: select
    if: needs.select.outputs.recovery-mode == 'reprepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [first, second]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.select.outputs.selection-artifact-id }}
          path: .release
          merge-multiple: true
          digest-mismatch: error
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *release-check-source-paths
          key: release-check-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml', 'ci/toolchains.toml', 'ci/tools.toml', 'rust-toolchain.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - run: ./target/ci/release/memcordon-ci release verify-source --build-source .release/build-source.json
      - run: ./target/ci/release/memcordon-ci ci prepare --profile miri
      - id: context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose miri --shard complete
      - id: products
        if: steps.context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/miri-*
          key: ${{ steps.context.outputs.product-key }}-${{ matrix.shard }}
      - id: first
        if: matrix.shard == 'first'
        run: ./target/ci/release/memcordon-ci suite miri-first
      - id: second
        if: matrix.shard == 'second'
        run: ./target/ci/release/memcordon-ci suite miri-second
      - if: always() && steps.context.outputs.compiled-cache-usable == 'true' && (steps.first.conclusion == 'skipped' || steps.first.outputs.cache-quiescent == 'true') && (steps.second.conclusion == 'skipped' || steps.second.outputs.cache-quiescent == 'true') && steps.products.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/miri-*
          key: ${{ steps.products.outputs.cache-primary-key }}
      - if: always() && (steps.first.conclusion == 'skipped' || steps.first.outputs.cache-quiescent == 'true') && (steps.second.conclusion == 'skipped' || steps.second.outputs.cache-quiescent == 'true') && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *release-check-source-paths
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Retain bounded preparation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostics-${{ github.job }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: *diagnostic-paths
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: false

  fuzz:
    needs: select
    if: needs.select.outputs.recovery-mode == 'reprepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [first, second]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.select.outputs.selection-artifact-id }}
          path: .release
          merge-multiple: true
          digest-mismatch: error
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *release-check-source-paths
          key: release-check-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml', 'ci/toolchains.toml', 'ci/tools.toml', 'rust-toolchain.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - run: ./target/ci/release/memcordon-ci release verify-source --build-source .release/build-source.json
      - id: prepare
        run: ./target/ci/release/memcordon-ci ci prepare --profile fuzz
      - id: context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose fuzz --shard complete
      - id: products
        if: steps.context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: &release-fuzz-product-paths |
            fuzz/target
            target/ci-tools/bin
            target/ci-tools-build
          key: ${{ steps.context.outputs.product-key }}-${{ matrix.shard }}
      - id: first
        if: matrix.shard == 'first'
        run: ./target/ci/release/memcordon-ci suite fuzz-first
      - id: second
        if: matrix.shard == 'second'
        run: ./target/ci/release/memcordon-ci suite fuzz-second
      - if: always() && steps.context.outputs.compiled-cache-usable == 'true' && steps.prepare.outputs.cache-quiescent == 'true' && (steps.first.conclusion == 'skipped' || steps.first.outputs.cache-quiescent == 'true') && (steps.second.conclusion == 'skipped' || steps.second.outputs.cache-quiescent == 'true') && steps.products.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *release-fuzz-product-paths
          key: ${{ steps.products.outputs.cache-primary-key }}
      - if: always() && steps.prepare.outputs.cache-quiescent == 'true' && (steps.first.conclusion == 'skipped' || steps.first.outputs.cache-quiescent == 'true') && (steps.second.conclusion == 'skipped' || steps.second.outputs.cache-quiescent == 'true') && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *release-check-source-paths
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Retain bounded preparation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostics-${{ github.job }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: *diagnostic-paths
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: false

  native-linux-x64:
    needs: select
    if: needs.select.outputs.recovery-mode == 'reprepare'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    outputs:
      artifact-id: ${{ steps.payload.outputs.artifact-id }}
    steps: &native-target-steps
      - name: Configure checkout line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.select.outputs.selection-artifact-id }}
          path: .release
          merge-multiple: true
          digest-mismatch: error
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: release-native-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'ci/toolchains.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: cache
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose native-release --shard complete
      - id: products
        if: steps.cache.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci-build
            target/ci/native
          key: ${{ steps.cache.outputs.product-key }}
      - id: build
        run: ./target/ci/release/memcordon-ci release build-target --build-source .release/build-source.json
      - id: payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/target
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
      - if: always() && steps.cache.outputs.compiled-cache-usable == 'true' && steps.build.outputs.cache-quiescent == 'true' && steps.products.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci-build
            target/ci/native
          key: ${{ steps.products.outputs.cache-primary-key }}
      - if: always() && steps.build.outputs.cache-quiescent == 'true' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Retain bounded preparation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostics-${{ github.job }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
