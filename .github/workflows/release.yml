name: Release

on:
  push:
    branches: ["**"]
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      failure-mode:
        description: Stop quickly or collect all native test failures
        type: choice
        default: stop-after-failure
        options: [stop-after-failure, collect-all]
      preparation-mode:
        description: Candidate preparation or an existing tagged release
        required: true
        default: release
        type: choice
        options: [candidate, release]
      tag:
        description: Existing unprefixed release tag; release mode only
        required: false
        type: string
      recovery-mode:
        description: Rebuild or reuse the original prepared bytes
        required: true
        default: reprepare
        type: choice
        options: [reprepare, publication-only]
      original-run-id:
        description: Original preparation run for publication-only
        type: string
      prepared-artifact-id:
        description: Original immutable prepared artifact id
        type: string
      tool-artifact-id:
        description: Original immutable publication tool artifact id
        type: string

permissions:
  contents: read

concurrency:
  group: memcordon-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}

jobs:
  select:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      selected-commit: ${{ steps.source.outputs.selected-commit }}
      public-consumer: ${{ steps.source.outputs.public-consumer }}
      recovery-mode: ${{ steps.source.outputs.recovery-mode }}
      preparation-kind: ${{ steps.source.outputs.preparation-kind }}
      selection-artifact-id: ${{ steps.selection.outputs.artifact-id }}
      preparation-tool-artifact-id: ${{ steps.tool.outputs.artifact-id }}
    steps:
      - name: Configure checkout line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        if: hashFiles('Cargo.lock') != ''
        id: deps
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: mc-download-bootstrap-v5-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'ci/toolchains.toml') }}
          restore-keys: mc-download-bootstrap-v5-${{ runner.os }}-
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Check formatting before driver compilation
        if: github.event_name != 'workflow_dispatch' || inputs.recovery-mode == 'reprepare'
        run: rustup run 1.97.1 cargo fmt --all -- --check
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: workspace-download-context
        run: ./target/ci/release/memcordon-ci ci download-cache-context --family workspace
      - id: source
        run: ./target/ci/release/memcordon-ci release select-preparation
      - name: Validate inexpensive preparation inputs
        if: steps.source.outputs.recovery-mode == 'reprepare'
        run: ./target/ci/release/memcordon-ci release check-preparation --build-source .release/build-source.json --consumer-readiness
      - run: ./target/ci/release/memcordon-ci release publication-tool
      - id: selection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: selected-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release/build-source.json
            .release/source.json
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
      - id: tool
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preparation-tool-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/tool
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
      - if: always() && steps.workspace-download-context.outputs.bootstrap-home-matches == 'true' && steps.deps.outputs.cache-hit != 'true' && success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.deps.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Retain bounded preparation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: &diagnostic-paths |
            target/ci/reports/execution
            target/ci/deadline-evidence
            target/ci/reports/release-macos-native.json
            target/ci/reports/release-macos-acceptance.json
            target/ci/reports/backend-macos-watchdog.json
            target/ci/reports/memcordon-macos-acceptance-*
            .release/installed-results
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: false

  packages:
    needs: select
    if: needs.select.outputs.recovery-mode == 'reprepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.payload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.selection-artifact-id }}
          path: .release
          merge-multiple: true
          digest-mismatch: error
      - id: deps
        continue-on-error: true
        if: hashFiles('Cargo.lock') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: mc-download-bootstrap-v5-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'ci/toolchains.toml') }}
          restore-keys: mc-download-bootstrap-v5-${{ runner.os }}-
      - run: rustup toolchain install 1.97.1 --profile minimal
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.preparation-tool-artifact-id }}
          path: .release/tool
          merge-multiple: true
          digest-mismatch: error
      - run: tar -xzf .release/tool/memcordon-publication-tool.tar.gz -C .release/tool
      - id: workspace-download-context
        run: ./.release/tool/memcordon-ci ci download-cache-context --family workspace
      - id: workspace-downloads
        if: steps.workspace-download-context.outputs.source-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-download-context.outputs.source-key }}
          restore-keys: ${{ steps.workspace-download-context.outputs.source-restore-prefix }}
      - id: workspace-fetch
        run: ./.release/tool/memcordon-ci ci fetch-downloads --family workspace
      - run: ./.release/tool/memcordon-ci release verify-source --build-source .release/build-source.json
      - id: packages
        run: ./.release/tool/memcordon-ci release packages --build-source .release/build-source.json
      - id: payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/packages
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
      - if: always() && steps.workspace-download-context.outputs.bootstrap-home-matches == 'true' && steps.packages.outputs.cache-quiescent == 'true' && steps.deps.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.deps.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - id: workspace-download-save-context
        if: always() && steps.packages.outputs.cache-quiescent == 'true' && steps.workspace-downloads.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.workspace-downloads.outputs.cache-primary-key != ''
        continue-on-error: true
        run: ./.release/tool/memcordon-ci ci download-cache-context --family workspace
      - name: Save complete workspace downloads
        if: always() && steps.packages.outputs.cache-quiescent == 'true' && steps.workspace-downloads.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.workspace-downloads.outputs.cache-primary-key != '' && steps.workspace-download-save-context.outcome == 'success' && steps.workspace-download-save-context.outputs.source-key == steps.workspace-download-context.outputs.source-key && steps.workspace-fetch.outputs.cache-quiescent == 'true' && steps.workspace-fetch.outputs.workspace-downloads-populated == 'true' && steps.workspace-download-save-context.outputs.source-key == steps.workspace-fetch.outputs.workspace-downloads-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-downloads.outputs.cache-primary-key }}

      - name: Retain bounded preparation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: *diagnostic-paths
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: false

  source-checks:
    needs: select
    if: needs.select.outputs.recovery-mode == 'reprepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.selection-artifact-id }}
          path: .release
          merge-multiple: true
          digest-mismatch: error
      - id: deps
        continue-on-error: true
        if: hashFiles('Cargo.lock') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: mc-download-bootstrap-v5-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'ci/toolchains.toml') }}
          restore-keys: mc-download-bootstrap-v5-${{ runner.os }}-
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.preparation-tool-artifact-id }}
          path: .release/tool
          merge-multiple: true
          digest-mismatch: error
      - run: tar -xzf .release/tool/memcordon-publication-tool.tar.gz -C .release/tool
      - id: workspace-download-context
        run: ./.release/tool/memcordon-ci ci download-cache-context --family workspace
      - id: workspace-downloads
        if: steps.workspace-download-context.outputs.source-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-download-context.outputs.source-key }}
          restore-keys: ${{ steps.workspace-download-context.outputs.source-restore-prefix }}
      - id: workspace-fetch
        run: ./.release/tool/memcordon-ci ci fetch-downloads --family workspace
      - run: ./.release/tool/memcordon-ci release verify-source --build-source .release/build-source.json
      - id: quality-context
        timeout-minutes: 2
        continue-on-error: true
        run: ./.release/tool/memcordon-ci ci cache-context --purpose quality --shard complete
      - id: quality-products
        continue-on-error: true
        if: steps.quality-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.quality-context.outputs.product-paths }}
          key: ${{ steps.quality-context.outputs.product-key }}
          restore-keys: ${{ steps.quality-context.outputs.product-restore-prefix }}
      - name: Sanitize quality-products discard restore
        if: steps.quality-products.outcome == 'failure'
        run: ./.release/tool/memcordon-ci ci prepare-restored-cache --purpose quality --shard complete --mode discard
      - name: Sanitize quality-products exact restore
        if: steps.quality-products.outcome == 'success' && steps.quality-products.outputs.cache-hit == 'true'
        run: ./.release/tool/memcordon-ci ci prepare-restored-cache --purpose quality --shard complete --mode exact
      - name: Sanitize quality-products compatible restore
        if: steps.quality-products.outcome == 'success' && steps.quality-products.outputs.cache-matched-key != '' && steps.quality-products.outputs.cache-hit != 'true'
        run: ./.release/tool/memcordon-ci ci prepare-restored-cache --purpose quality --shard complete --mode compatible
      - id: quality
        if: github.event_name != 'workflow_dispatch' || inputs.failure-mode != 'collect-all'
        run: ./.release/tool/memcordon-ci suite quality-compile --failure-mode stop-after-failure
      - id: quality-diagnostic
        if: github.event_name == 'workflow_dispatch' && inputs.failure-mode == 'collect-all'
        run: ./.release/tool/memcordon-ci suite quality-compile --failure-mode collect-all
      - id: quality-products-save-context
        if: always() && steps.quality-context.outputs.compiled-cache-usable == 'true' && (steps.quality.outputs.cache-quiescent || steps.quality-diagnostic.outputs.cache-quiescent) == 'true' && steps.quality-products.outputs.cache-hit != 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: ./.release/tool/memcordon-ci ci cache-context --purpose quality --shard complete
      - if: always() && success() && steps.quality-context.outputs.compiled-cache-usable == 'true' && (steps.quality.outputs.cache-quiescent || steps.quality-diagnostic.outputs.cache-quiescent) == 'true' && steps.quality-products.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.quality-products.outputs.cache-primary-key != '' && steps.quality-products-save-context.outcome == 'success' && steps.quality-products-save-context.outputs.product-key == steps.quality-context.outputs.product-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.quality-context.outputs.product-paths }}
          key: ${{ steps.quality-products.outputs.cache-primary-key }}
      - if: always() && steps.workspace-download-context.outputs.bootstrap-home-matches == 'true' && (steps.quality.outputs.cache-quiescent || steps.quality-diagnostic.outputs.cache-quiescent) == 'true' && steps.deps.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.deps.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - id: workspace-download-save-context
        if: always() && (steps.quality.outputs.cache-quiescent || steps.quality-diagnostic.outputs.cache-quiescent) == 'true' && steps.workspace-downloads.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.workspace-downloads.outputs.cache-primary-key != ''
        continue-on-error: true
        run: ./.release/tool/memcordon-ci ci download-cache-context --family workspace
      - name: Save complete workspace downloads
        if: always() && (steps.quality.outputs.cache-quiescent || steps.quality-diagnostic.outputs.cache-quiescent) == 'true' && steps.workspace-downloads.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.workspace-downloads.outputs.cache-primary-key != '' && steps.workspace-download-save-context.outcome == 'success' && steps.workspace-download-save-context.outputs.source-key == steps.workspace-download-context.outputs.source-key && steps.workspace-fetch.outputs.cache-quiescent == 'true' && steps.workspace-fetch.outputs.workspace-downloads-populated == 'true' && steps.workspace-download-save-context.outputs.source-key == steps.workspace-fetch.outputs.workspace-downloads-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-downloads.outputs.cache-primary-key }}


      - name: Retain bounded preparation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: *diagnostic-paths
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: false

  msrv:
    needs: select
    if: needs.select.outputs.recovery-mode == 'reprepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.selection-artifact-id }}
          path: .release
          merge-multiple: true
          digest-mismatch: error
      - id: deps
        continue-on-error: true
        if: hashFiles('Cargo.lock') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: mc-download-bootstrap-v5-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'ci/toolchains.toml') }}
          restore-keys: mc-download-bootstrap-v5-${{ runner.os }}-
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.preparation-tool-artifact-id }}
          path: .release/tool
          merge-multiple: true
          digest-mismatch: error
      - run: tar -xzf .release/tool/memcordon-publication-tool.tar.gz -C .release/tool
      - id: workspace-download-context
        run: ./.release/tool/memcordon-ci ci download-cache-context --family workspace
      - id: workspace-downloads
        if: steps.workspace-download-context.outputs.source-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-download-context.outputs.source-key }}
          restore-keys: ${{ steps.workspace-download-context.outputs.source-restore-prefix }}
      - id: workspace-fetch
        run: ./.release/tool/memcordon-ci ci fetch-downloads --family workspace
      - run: ./.release/tool/memcordon-ci release verify-source --build-source .release/build-source.json
      - run: rustup toolchain install 1.85.0 --profile minimal
      - id: msrv-context
        timeout-minutes: 2
        continue-on-error: true
        run: ./.release/tool/memcordon-ci ci cache-context --purpose msrv --shard complete
      - id: msrv-products
        continue-on-error: true
        if: steps.msrv-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.msrv-context.outputs.product-paths }}
          key: ${{ steps.msrv-context.outputs.product-key }}
          restore-keys: ${{ steps.msrv-context.outputs.product-restore-prefix }}
      - name: Sanitize msrv-products discard restore
        if: steps.msrv-products.outcome == 'failure'
        run: ./.release/tool/memcordon-ci ci prepare-restored-cache --purpose msrv --shard complete --mode discard
      - name: Sanitize msrv-products exact restore
        if: steps.msrv-products.outcome == 'success' && steps.msrv-products.outputs.cache-hit == 'true'
        run: ./.release/tool/memcordon-ci ci prepare-restored-cache --purpose msrv --shard complete --mode exact
      - name: Sanitize msrv-products compatible restore
        if: steps.msrv-products.outcome == 'success' && steps.msrv-products.outputs.cache-matched-key != '' && steps.msrv-products.outputs.cache-hit != 'true'
        run: ./.release/tool/memcordon-ci ci prepare-restored-cache --purpose msrv --shard complete --mode compatible
      - id: msrv
        if: github.event_name != 'workflow_dispatch' || inputs.failure-mode != 'collect-all'
        run: ./.release/tool/memcordon-ci suite msrv --failure-mode stop-after-failure
      - id: msrv-diagnostic
        if: github.event_name == 'workflow_dispatch' && inputs.failure-mode == 'collect-all'
        run: ./.release/tool/memcordon-ci suite msrv --failure-mode collect-all
      - id: msrv-products-save-context
        if: always() && steps.msrv-context.outputs.compiled-cache-usable == 'true' && (steps.msrv.outputs.cache-quiescent || steps.msrv-diagnostic.outputs.cache-quiescent) == 'true' && steps.msrv-products.outputs.cache-hit != 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: ./.release/tool/memcordon-ci ci cache-context --purpose msrv --shard complete
      - if: always() && success() && steps.msrv-context.outputs.compiled-cache-usable == 'true' && (steps.msrv.outputs.cache-quiescent || steps.msrv-diagnostic.outputs.cache-quiescent) == 'true' && steps.msrv-products.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.msrv-products.outputs.cache-primary-key != '' && steps.msrv-products-save-context.outcome == 'success' && steps.msrv-products-save-context.outputs.product-key == steps.msrv-context.outputs.product-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.msrv-context.outputs.product-paths }}
          key: ${{ steps.msrv-products.outputs.cache-primary-key }}
      - if: always() && steps.workspace-download-context.outputs.bootstrap-home-matches == 'true' && (steps.msrv.outputs.cache-quiescent || steps.msrv-diagnostic.outputs.cache-quiescent) == 'true' && steps.deps.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.deps.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
