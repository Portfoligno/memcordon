name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected SemVer tag to publish or reconcile
        required: true
        type: string
      private_native:
        description: Run fail-closed private native qualification diagnostics
        required: false
        type: boolean
        default: false
      collector_intent_sha256:
        description: Digest only of the verifier host's protected candidate collector intent; no signing key or root policy
        required: false
        type: string
      policy_intent_sha256:
        description: Digest only of the independently provisioned protected private-policy release intent
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: memcordon-release
  cancel-in-progress: false

jobs:
  linux-standard-certification:
    name: Release / Linux standard certification / x64
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out pushed tag
        id: source-push
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out dispatched tag
        id: source-dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: standard-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: managed-sources-v2-cargo-deps-release-standard-v1-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'ci/**', '.cargo/**', 'rust-toolchain.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 rustc --edition=2021 tools/ci-native-fingerprint.rs -o ci-native-fingerprint.exe
      - id: build-context-prepare
        run: ./ci-native-fingerprint.exe --output target/ci/native-inputs.bin
      - id: inventory-observation
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: inventory-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            target/ci/reports/inventory-observation/v1/**/run-start.json
            target/ci/reports/inventory-observation/v1/**/phase-*.json
            target/ci/reports/inventory-observation/v1/**/inventory-*.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - id: standard-target
        if: steps.build-context-prepare.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/bootstrap
            target/ci/standard-backend
          key: managed-v2-cargo-target-release-standard-v1-${{ runner.os }}-${{ runner.arch }}-1.97.1-push-${{ steps.source-push.outputs.commit }}-dispatch-${{ steps.source-dispatch.outputs.commit }}-${{ hashFiles('target/ci/native-inputs.bin', 'Cargo.lock', 'Cargo.toml', 'crates/**', 'tools/**', 'ci/**', 'rust-toolchain.toml', '.github/workflows/**') }}
      - run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite backend-linux-cgroup
      - uses: ./.github/actions/upload-artifact
        with:
          name: release-certification-standard-linux-x64
          path: target/ci/reports/standard/linux-x64/backend-linux-cgroup-v2.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: diagnostics-standard-linux-x64
          path: target/ci/standard-diagnostics/linux-x64
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - id: build-context-audit
        if: always() && steps.build-context-prepare.outcome == 'success'
        run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci audit-build-context --input target/ci/native-inputs.bin
      - if: always() && steps.standard-target.outputs.cache-hit != 'true' && steps.build-context-audit.outcome == 'success' && steps.build-context-prepare.outcome == 'success' && steps.standard-target.outputs.cache-primary-key != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/bootstrap
            target/ci/standard-backend
          key: ${{ steps.standard-target.outputs.cache-primary-key }}
      - if: always() && steps.standard-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: ${{ steps.standard-deps.outputs.cache-primary-key }}

  windows-standard-certification:
    name: Release / Windows standard certification / x64
    needs: preflight
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - name: Check out pushed tag
        id: source-push
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out dispatched tag
        id: source-dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: standard-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: managed-sources-v2-cargo-deps-release-standard-v1-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'ci/**', '.cargo/**', 'rust-toolchain.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 rustc --edition=2021 tools/ci-native-fingerprint.rs -o ci-native-fingerprint.exe
      - id: build-context-prepare
        run: ./ci-native-fingerprint.exe --output target/ci/native-inputs.bin
      - id: inventory-observation
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: inventory-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            target/ci/reports/inventory-observation/v1/**/run-start.json
            target/ci/reports/inventory-observation/v1/**/phase-*.json
            target/ci/reports/inventory-observation/v1/**/inventory-*.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - id: standard-target
        if: steps.build-context-prepare.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/bootstrap
            target/ci/standard-backend
          key: managed-v2-cargo-target-release-standard-v1-${{ runner.os }}-${{ runner.arch }}-1.97.1-push-${{ steps.source-push.outputs.commit }}-dispatch-${{ steps.source-dispatch.outputs.commit }}-${{ hashFiles('target/ci/native-inputs.bin', 'Cargo.lock', 'Cargo.toml', 'crates/**', 'tools/**', 'ci/**', 'rust-toolchain.toml', '.github/workflows/**') }}
      - run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite backend-windows-job
      - uses: ./.github/actions/upload-artifact
        with:
          name: release-certification-standard-windows-x64
          path: target/ci/reports/standard/windows-x64/backend-windows-job-object.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: diagnostics-standard-windows-x64
          path: target/ci/standard-diagnostics/windows-x64
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - id: build-context-audit
        if: always() && steps.build-context-prepare.outcome == 'success'
        run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci audit-build-context --input target/ci/native-inputs.bin
      - if: always() && steps.standard-target.outputs.cache-hit != 'true' && steps.build-context-audit.outcome == 'success' && steps.build-context-prepare.outcome == 'success' && steps.standard-target.outputs.cache-primary-key != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/bootstrap
            target/ci/standard-backend
          key: ${{ steps.standard-target.outputs.cache-primary-key }}
      - if: always() && steps.standard-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: ${{ steps.standard-deps.outputs.cache-primary-key }}

  preflight:
    name: Release / preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out pushed tag
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out dispatched tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: preflight-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: managed-sources-v2-cargo-deps-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: rustup run 1.97.1 rustc --edition=2021 tools/ci-native-fingerprint.rs -o ci-native-fingerprint.exe
      - id: build-context-prepare
        run: ./ci-native-fingerprint.exe --output target/ci/native-inputs.bin
      - id: inventory-observation
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: inventory-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            target/ci/reports/inventory-observation/v1/**/run-start.json
            target/ci/reports/inventory-observation/v1/**/phase-*.json
            target/ci/reports/inventory-observation/v1/**/inventory-*.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - id: preflight-target
        if: steps.build-context-prepare.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci
            !target/ci/control-bootstrap
            !target/ci/source-home
            !target/ci/native-inputs.bin
            !target/ci/native-inputs.admission.json
            !target/ci/reports
            !target/ci/*evidence*
            !target/ci/*diagnostic*
            !target/ci/release-bundle
            !target/ci/release-inputs
          key: managed-v2-cargo-target-release-v3-preflight-1.97.1-msrv-1.85.0-${{ hashFiles('target/ci/native-inputs.bin', 'Cargo.lock', 'Cargo.toml', 'crates/**', 'tools/**', 'fuzz/**', 'ci/**', 'docs/**', 'spec/**', 'packaging/**', 'README.md', 'LICENSE', 'CHANGELOG.md', 'RELEASING.md', 'rust-toolchain.toml', '.github/workflows/backend-certification.yml', '.github/workflows/release.yml') }}
      - run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite release-preflight
      - id: build-context-audit
        if: always() && steps.build-context-prepare.outcome == 'success'
        run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci audit-build-context --input target/ci/native-inputs.bin
      - if: always() && steps.preflight-target.outputs.cache-hit != 'true' && steps.build-context-audit.outcome == 'success' && steps.build-context-prepare.outcome == 'success' && steps.preflight-target.outputs.cache-primary-key != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci
            !target/ci/control-bootstrap
            !target/ci/source-home
            !target/ci/native-inputs.bin
            !target/ci/native-inputs.admission.json
            !target/ci/reports
            !target/ci/*evidence*
            !target/ci/*diagnostic*
            !target/ci/release-bundle
            !target/ci/release-inputs
          key: ${{ steps.preflight-target.outputs.cache-primary-key }}
      - if: always() && steps.preflight-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: ${{ steps.preflight-deps.outputs.cache-primary-key }}

  native:
    name: Release / native / ${{ matrix.id }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-24.04
          - id: linux-arm64
            runner: ubuntu-24.04-arm
          - id: macos-arm64
            runner: macos-15
          - id: macos-x64
            runner: macos-15-intel
          - id: windows-x64
            runner: windows-2025
          - id: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - name: Check out pushed tag
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out dispatched tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: native-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: managed-sources-v2-cargo-deps-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 rustc --edition=2021 tools/ci-native-fingerprint.rs -o ci-native-fingerprint.exe
      - id: build-context-prepare
        run: ./ci-native-fingerprint.exe --output target/ci/native-inputs.bin
      - id: inventory-observation
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: inventory-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            target/ci/reports/inventory-observation/v1/**/run-start.json
            target/ci/reports/inventory-observation/v1/**/phase-*.json
            target/ci/reports/inventory-observation/v1/**/inventory-*.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - id: native-target
        if: steps.build-context-prepare.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/release-native
          key: managed-v2-cargo-target-release-v1-native-${{ matrix.id }}-1.97.1-${{ hashFiles('target/ci/native-inputs.bin', 'Cargo.lock', 'Cargo.toml', 'crates/**', 'tools/**', 'ci/**', 'docs/**', 'spec/**', 'packaging/**', 'README.md', 'LICENSE', 'CHANGELOG.md', 'RELEASING.md', 'rust-toolchain.toml', '.github/workflows/release.yml') }}
      - run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite release-native
      - uses: ./.github/actions/upload-artifact
        with:
          name: release-native-${{ matrix.id }}
          path: target/ci/release-output
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - id: build-context-audit
        if: always() && steps.build-context-prepare.outcome == 'success'
        run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci audit-build-context --input target/ci/native-inputs.bin
      - if: always() && steps.native-target.outputs.cache-hit != 'true' && steps.build-context-audit.outcome == 'success' && steps.build-context-prepare.outcome == 'success' && steps.native-target.outputs.cache-primary-key != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/release-native
          key: ${{ steps.native-target.outputs.cache-primary-key }}
      - if: always() && steps.native-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: ${{ steps.native-deps.outputs.cache-primary-key }}

  linux-private-candidate-inputs:
    name: Release / private candidate inputs / ${{ matrix.id }}
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-24.04
          - id: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out pushed tag
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out dispatched tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: candidate-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: managed-sources-v2-cargo-deps-release-private-candidate-inputs-v1-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml', 'ci/**', '.cargo/**', 'rust-toolchain.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 rustc --edition=2021 tools/ci-native-fingerprint.rs -o ci-native-fingerprint.exe
      - id: build-context-prepare
        run: ./ci-native-fingerprint.exe --output target/ci/native-inputs.bin
      - id: candidate-target
        if: steps.build-context-prepare.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/bootstrap
          key: managed-v2-cargo-target-release-private-candidate-inputs-v1-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('target/ci/native-inputs.bin', 'Cargo.lock', 'Cargo.toml', 'crates/**', 'tools/**', 'fuzz/**', 'ci/**', '.cargo/**', 'docs/**', 'spec/**', 'packaging/**', 'README.md', 'LICENSE', 'CHANGELOG.md', 'RELEASING.md', 'rust-toolchain.toml', '.github/workflows/**') }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-native-${{ matrix.id }}
          path: target/ci/release-inputs/release-native-${{ matrix.id }}
      - run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin release verify-private-candidate
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: private-candidate-inputs-${{ matrix.id }}
          path: target/ci/reports/private-candidate-inputs
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - id: build-context-audit
        if: always() && steps.build-context-prepare.outcome == 'success'
        run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci audit-build-context --input target/ci/native-inputs.bin
      - if: always() && steps.candidate-target.outputs.cache-hit != 'true' && steps.build-context-audit.outcome == 'success' && steps.build-context-prepare.outcome == 'success' && steps.candidate-target.outputs.cache-primary-key != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/bootstrap
          key: ${{ steps.candidate-target.outputs.cache-primary-key }}
      - if: always() && steps.candidate-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: ${{ steps.candidate-deps.outputs.cache-primary-key }}

  linux-private-candidate:
    name: Release / Linux private candidate / ${{ matrix.id }}
    if: github.event_name == 'workflow_dispatch' && inputs.private_native == true
    needs: linux-private-candidate-inputs
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: x64
            runner: ubuntu-24.04
            asset: linux-x64
          - id: arm64
            runner: ubuntu-24.04-arm
            asset: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
