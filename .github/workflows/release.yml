          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: .release/prepared
          merge-multiple: true
          digest-mismatch: error
      - run: tar -xzf .release/tool/memcordon-publication-tool.tar.gz -C .release/tool
      - id: registry-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish original prepared bytes
        run: ./.release/tool/memcordon-ci release publish
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.registry-auth.outputs.token }}

  public-linux-x64-native:
    name: public-linux-x64-native
    needs: [select, assemble, publish, recovery-inputs, recovery-publish]
    if: &public-readiness-condition always() && (needs.publish.result == 'success' || needs.recovery-publish.result == 'success') && needs.select.outputs.preparation-kind == 'tagged'
    permissions: &public-readiness-permissions
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: [{target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, channel: public-native, producer-job: public-linux-x64-native}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    outputs: *readiness-producer-outputs
    steps: &public-readiness-steps
      - name: Configure checkout line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.selected-commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select.outputs.selection-artifact-id }}
          path: .release
          merge-multiple: true
          digest-mismatch: error
      - if: needs.select.outputs.recovery-mode == 'reprepare'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.assemble.outputs.prepared-artifact-id }}
          path: .release/prepared
          merge-multiple: true
          digest-mismatch: error
      - if: needs.select.outputs.recovery-mode == 'publication-only'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.recovery-inputs.outputs.prepared-artifact-id }}
          run-id: ${{ needs.recovery-inputs.outputs.original-run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: .release/prepared
          merge-multiple: true
          digest-mismatch: error
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci --bin consumer-readiness
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci/native -p memcordon --features test-fixtures --bin memcordon-test-fixture
      - run: ./target/ci/release/consumer-readiness identity --github-context --build-source .release/build-source.json --output .release/readiness-identity.json
      - id: readiness-cache
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose consumer-readiness --shard public
      - run: ./target/ci/release/consumer-readiness acquire --github-context --driver ./target/ci/release/memcordon-ci --identity .release/readiness-identity.json --destination .release/readiness-cell
      - id: readiness-cleanup
        if: always()
        run: ./target/ci/release/consumer-readiness cleanup --github-context --driver ./target/ci/release/memcordon-ci --identity .release/readiness-identity.json --destination .release/readiness-cell
      - if: always()
        run: ./target/ci/release/consumer-readiness seal-producer --github-context --identity .release/readiness-identity.json --manifest ci/consumer-readiness-v1.toml --cell .release/readiness-cell/cell.json --output .release/readiness-cell/producer-manifest.json
      - id: readiness-upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: readiness-${{ matrix.producer-job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/readiness-cell
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false

