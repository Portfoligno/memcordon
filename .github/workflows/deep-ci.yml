      - id: workspace-download-save-context
        if: always() && steps.stress-run.outputs.cache-quiescent == 'true' && steps.workspace-downloads.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.workspace-downloads.outputs.cache-primary-key != ''
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci download-cache-context --family workspace
      - name: Save complete workspace downloads
        if: always() && steps.stress-run.outputs.cache-quiescent == 'true' && steps.workspace-downloads.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.workspace-downloads.outputs.cache-primary-key != '' && steps.workspace-download-save-context.outcome == 'success' && steps.workspace-download-save-context.outputs.source-key == steps.workspace-download-context.outputs.source-key && steps.workspace-fetch.outputs.cache-quiescent == 'true' && steps.workspace-fetch.outputs.workspace-downloads-populated == 'true' && steps.workspace-download-save-context.outputs.source-key == steps.workspace-fetch.outputs.workspace-downloads-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-downloads.outputs.cache-primary-key }}

  stress-lifecycle:
    name: stress lifecycle / ${{ matrix.id }}
    needs: performance-plan
    if: needs.performance-plan.outputs.has-split == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.performance-plan.outputs.split) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: sources
        continue-on-error: true
        if: hashFiles('Cargo.lock') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: mc-download-bootstrap-v5-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'ci/toolchains.toml') }}
          restore-keys: mc-download-bootstrap-v5-${{ runner.os }}-
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: workspace-download-context
        run: ./target/ci/release/memcordon-ci ci download-cache-context --family workspace
      - id: workspace-downloads
        if: steps.workspace-download-context.outputs.source-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-download-context.outputs.source-key }}
          restore-keys: ${{ steps.workspace-download-context.outputs.source-restore-prefix }}
      - id: workspace-fetch
        run: ./target/ci/release/memcordon-ci ci fetch-downloads --family workspace
      - id: compiled-context
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose stress-lifecycle --shard complete
      - id: compiled
        continue-on-error: true
        if: steps.compiled-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.compiled-context.outputs.product-paths }}
          key: ${{ steps.compiled-context.outputs.product-key }}
          restore-keys: ${{ steps.compiled-context.outputs.product-restore-prefix }}
      - name: Sanitize compiled discard restore
        if: steps.compiled.outcome == 'failure'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose stress-lifecycle --shard complete --mode discard
      - name: Sanitize compiled exact restore
        if: steps.compiled.outcome == 'success' && steps.compiled.outputs.cache-hit == 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose stress-lifecycle --shard complete --mode exact
      - name: Sanitize compiled compatible restore
        if: steps.compiled.outcome == 'success' && steps.compiled.outputs.cache-matched-key != '' && steps.compiled.outputs.cache-hit != 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose stress-lifecycle --shard complete --mode compatible
      - id: stress-run
        run: ./target/ci/release/memcordon-ci suite stress-lifecycle
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: stress-lifecycle-${{ matrix.id }}
          include-hidden-files: true
          path: |
            target/ci/reports/stress
            target/ci/reports/stress-seed.txt
            target/ci/reports/stress-deep_short_child_iterations.json
          if-no-files-found: warn
      - id: compiled-save-context
        if: always() && steps.compiled-context.outputs.compiled-cache-usable == 'true' && steps.stress-run.outputs.cache-quiescent == 'true' && steps.compiled.outputs.cache-hit != 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose stress-lifecycle --shard complete
      - if: always() && success() && steps.compiled-context.outputs.compiled-cache-usable == 'true' && steps.stress-run.outputs.cache-quiescent == 'true' && steps.compiled.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.compiled.outputs.cache-primary-key != '' && steps.compiled-save-context.outcome == 'success' && steps.compiled-save-context.outputs.product-key == steps.compiled-context.outputs.product-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.compiled-context.outputs.product-paths }}
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - if: always() && steps.workspace-download-context.outputs.bootstrap-home-matches == 'true' && steps.stress-run.outputs.cache-quiescent == 'true' && steps.sources.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.sources.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.sources.outputs.cache-primary-key }}
      - id: workspace-download-save-context
        if: always() && steps.stress-run.outputs.cache-quiescent == 'true' && steps.workspace-downloads.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.workspace-downloads.outputs.cache-primary-key != ''
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci download-cache-context --family workspace
      - name: Save complete workspace downloads
        if: always() && steps.stress-run.outputs.cache-quiescent == 'true' && steps.workspace-downloads.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.workspace-downloads.outputs.cache-primary-key != '' && steps.workspace-download-save-context.outcome == 'success' && steps.workspace-download-save-context.outputs.source-key == steps.workspace-download-context.outputs.source-key && steps.workspace-fetch.outputs.cache-quiescent == 'true' && steps.workspace-fetch.outputs.workspace-downloads-populated == 'true' && steps.workspace-download-save-context.outputs.source-key == steps.workspace-fetch.outputs.workspace-downloads-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-downloads.outputs.cache-primary-key }}

  stress-assessment:
    if: always() && github.event.deleted != true
    needs: [performance-plan, stress, stress-packages, stress-lifecycle]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: stress-*
          path: target/ci/stress-artifacts
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - run: ./target/ci/release/memcordon-ci ci aggregate-stress
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: stress-assessment
          path: target/ci/reports/stress-assessment.json
          if-no-files-found: warn
