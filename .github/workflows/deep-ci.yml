  stress:
    name: stress / ${{ matrix.id }}
    needs: performance-plan
    if: needs.performance-plan.outputs.has-combined == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.performance-plan.outputs.combined) }}
    runs-on: ${{ matrix.runner }}
    # Includes a cold driver build, package checks, and the bounded lifecycle run.
    # Measured cold prefix ~72 min + admitted lifecycle 35 min + evidence margin.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: stress-deps
        continue-on-error: true
        if: hashFiles('Cargo.lock') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: mc-download-bootstrap-v5-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'ci/toolchains.toml') }}
          restore-keys: mc-download-bootstrap-v5-${{ runner.os }}-
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: workspace-download-context
        run: ./target/ci/release/memcordon-ci ci download-cache-context --family workspace
      - id: workspace-downloads
        if: steps.workspace-download-context.outputs.source-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-download-context.outputs.source-key }}
          restore-keys: ${{ steps.workspace-download-context.outputs.source-restore-prefix }}
      - id: workspace-fetch
        run: ./target/ci/release/memcordon-ci ci fetch-downloads --family workspace
      - id: compiled-context
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose stress --shard complete
      - id: compiled
        continue-on-error: true
        if: steps.compiled-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.compiled-context.outputs.product-paths }}
          key: ${{ steps.compiled-context.outputs.product-key }}
          restore-keys: ${{ steps.compiled-context.outputs.product-restore-prefix }}
      - name: Sanitize compiled discard restore
        if: steps.compiled.outcome == 'failure'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose stress --shard complete --mode discard
      - name: Sanitize compiled exact restore
        if: steps.compiled.outcome == 'success' && steps.compiled.outputs.cache-hit == 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose stress --shard complete --mode exact
      - name: Sanitize compiled compatible restore
        if: steps.compiled.outcome == 'success' && steps.compiled.outputs.cache-matched-key != '' && steps.compiled.outputs.cache-hit != 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose stress --shard complete --mode compatible
      - id: stress-run
        run: ./target/ci/release/memcordon-ci suite stress
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: stress-combined-${{ matrix.id }}
          include-hidden-files: true
          path: |
            target/ci/reports/stress
            target/ci/reports/stress-seed.txt
            target/ci/reports/stress-active-target.txt
            target/ci/reports/stress-deep_short_child_iterations.json
          if-no-files-found: warn
      - id: compiled-save-context
        if: always() && steps.compiled-context.outputs.compiled-cache-usable == 'true' && steps.stress-run.outputs.cache-quiescent == 'true' && steps.compiled.outputs.cache-hit != 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose stress --shard complete
      - if: always() && success() && steps.compiled-context.outputs.compiled-cache-usable == 'true' && steps.stress-run.outputs.cache-quiescent == 'true' && steps.compiled.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.compiled.outputs.cache-primary-key != '' && steps.compiled-save-context.outcome == 'success' && steps.compiled-save-context.outputs.product-key == steps.compiled-context.outputs.product-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.compiled-context.outputs.product-paths }}
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - if: always() && steps.workspace-download-context.outputs.bootstrap-home-matches == 'true' && steps.stress-deps.outputs.cache-hit != 'true' && success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.stress-deps.outputs.cache-primary-key != ''
