name: Deep CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      combined: ${{ steps.plan.outputs.stress-combined }}
      split: ${{ steps.plan.outputs.stress-split }}
      has-combined: ${{ steps.plan.outputs.stress-has-combined }}
      has-split: ${{ steps.plan.outputs.stress-has-split }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: plan
        run: ./target/ci/release/memcordon-ci ci performance-plan
  miri:
    name: Miri / ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [first, second]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: miri-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ordinary-sources-v1-cargo-deps-deep-v2-miri-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - run: ./target/ci/release/memcordon-ci ci prepare --profile miri
      - id: compiled-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose miri --shard complete
      - id: compiled
        if: steps.compiled-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/miri-*
          key: ${{ steps.compiled-context.outputs.product-key }}-${{ matrix.shard }}
      - id: miri-first
        if: matrix.shard == 'first'
        run: ./target/ci/release/memcordon-ci suite miri-first
      - id: miri-second
        if: matrix.shard == 'second'
        run: ./target/ci/release/memcordon-ci suite miri-second
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: miri-plan-${{ matrix.shard }}
          path: target/ci/reports/miri
          if-no-files-found: warn
      - if: always() && steps.compiled-context.outputs.compiled-cache-usable == 'true' && (steps.miri-first.outputs.cache-quiescent == 'true' || steps.miri-second.outputs.cache-quiescent == 'true') && steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/miri-*
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - if: always() && matrix.shard == 'first' && steps.miri-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.miri-deps.outputs.cache-primary-key }}

  fuzz:
    name: fuzz smoke / ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [quarter-one, quarter-two, quarter-three, quarter-four]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: fuzz-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ordinary-sources-v1-cargo-deps-deep-v2-fuzz-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - run: ./target/ci/release/memcordon-ci ci prepare --profile fuzz
      - id: compiled-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose fuzz --shard complete
      - id: compiled
        if: steps.compiled-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            fuzz/target
            target/ci-tools/bin
            target/ci-tools-build
          key: ${{ steps.compiled-context.outputs.product-key }}-${{ matrix.shard }}
      - id: fuzz-one
        if: matrix.shard == 'quarter-one'
        run: ./target/ci/release/memcordon-ci suite fuzz-quarter-one
      - id: fuzz-two
        if: matrix.shard == 'quarter-two'
        run: ./target/ci/release/memcordon-ci suite fuzz-quarter-two
      - id: fuzz-three
        if: matrix.shard == 'quarter-three'
        run: ./target/ci/release/memcordon-ci suite fuzz-quarter-three
      - id: fuzz-four
        if: matrix.shard == 'quarter-four'
        run: ./target/ci/release/memcordon-ci suite fuzz-quarter-four
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: fuzz-plan-${{ matrix.shard }}
          path: target/ci/reports/fuzz
          if-no-files-found: warn
      - if: always() && steps.compiled-context.outputs.compiled-cache-usable == 'true' && (steps.fuzz-one.outputs.cache-quiescent == 'true' || steps.fuzz-two.outputs.cache-quiescent == 'true' || steps.fuzz-three.outputs.cache-quiescent == 'true' || steps.fuzz-four.outputs.cache-quiescent == 'true') && steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            fuzz/target
            target/ci-tools/bin
            target/ci-tools-build
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - if: always() && matrix.shard == 'quarter-one' && steps.fuzz-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.fuzz-deps.outputs.cache-primary-key }}

  stress:
    name: stress / ${{ matrix.id }}
    needs: performance-plan
    if: needs.performance-plan.outputs.has-combined == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.performance-plan.outputs.combined) }}
    runs-on: ${{ matrix.runner }}
    # Includes a cold driver build, package checks, and the bounded lifecycle run.
    # Measured cold prefix ~72 min + admitted lifecycle 35 min + evidence margin.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: stress-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ordinary-sources-v1-cargo-deps-deep-v2-stress-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: compiled-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose stress --shard complete
      - id: compiled
        if: steps.compiled-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/stress
          key: ${{ steps.compiled-context.outputs.product-key }}-${{ matrix.id }}
      - id: stress-run
        run: ./target/ci/release/memcordon-ci suite stress
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: stress-combined-${{ matrix.id }}
          include-hidden-files: true
          path: |
            target/ci/reports/stress
            target/ci/reports/stress-seed.txt
            target/ci/reports/stress-active-target.txt
            target/ci/reports/stress-deep_short_child_iterations.json
          if-no-files-found: warn
      - if: always() && steps.compiled-context.outputs.compiled-cache-usable == 'true' && steps.stress-run.outputs.cache-quiescent == 'true' && steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/stress
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - if: always() && steps.stress-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.stress-deps.outputs.cache-primary-key }}

  stress-packages:
    name: stress packages / ${{ matrix.id }}
    needs: performance-plan
    if: needs.performance-plan.outputs.has-split == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.performance-plan.outputs.split) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: stress-sources-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: compiled-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose stress-packages --shard complete
      - id: compiled
        if: steps.compiled-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/stress-packages
          key: ${{ steps.compiled-context.outputs.product-key }}-${{ matrix.id }}
      - id: stress-run
        run: ./target/ci/release/memcordon-ci suite stress-packages
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: stress-packages-${{ matrix.id }}
          include-hidden-files: true
          path: |
            target/ci/reports/stress
            target/ci/reports/stress-active-target.txt
          if-no-files-found: warn
      - if: always() && steps.compiled-context.outputs.compiled-cache-usable == 'true' && steps.stress-run.outputs.cache-quiescent == 'true' && steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/stress-packages
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - if: always() && steps.stress-run.outputs.cache-quiescent == 'true' && steps.sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.sources.outputs.cache-primary-key }}

  stress-lifecycle:
    name: stress lifecycle / ${{ matrix.id }}
    needs: performance-plan
    if: needs.performance-plan.outputs.has-split == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.performance-plan.outputs.split) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: stress-sources-lifecycle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: compiled-context
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose stress-lifecycle --shard complete
      - id: compiled
        if: steps.compiled-context.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/stress-lifecycle
          key: ${{ steps.compiled-context.outputs.product-key }}-${{ matrix.id }}
      - id: stress-run
        run: ./target/ci/release/memcordon-ci suite stress-lifecycle
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: stress-lifecycle-${{ matrix.id }}
          include-hidden-files: true
          path: |
            target/ci/reports/stress
            target/ci/reports/stress-seed.txt
            target/ci/reports/stress-deep_short_child_iterations.json
          if-no-files-found: warn
      - if: always() && steps.compiled-context.outputs.compiled-cache-usable == 'true' && steps.stress-run.outputs.cache-quiescent == 'true' && steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci/stress-lifecycle
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - if: always() && steps.stress-run.outputs.cache-quiescent == 'true' && steps.sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.sources.outputs.cache-primary-key }}

  stress-assessment:
    if: always()
    needs: [performance-plan, stress, stress-packages, stress-lifecycle]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: stress-*
          path: target/ci/stress-artifacts
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - run: ./target/ci/release/memcordon-ci ci aggregate-stress
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: stress-assessment
          path: target/ci/reports/stress-assessment.json
          if-no-files-found: warn
