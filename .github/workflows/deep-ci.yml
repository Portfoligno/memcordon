    name: Public Cargo source seed / ${{ matrix.runner }}
    if: github.event.deleted != true && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/tags/') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/'))
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 62
    continue-on-error: true
    env:
      CARGO_HOME: ${{ github.workspace }}/target/ci-cargo-home
    steps:
      - name: Configure checkout line endings
        run: git config --global core.autocrlf false
        timeout-minutes: 1
      - uses: *action_0
