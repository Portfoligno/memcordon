        with:
          path: ${{ steps.compiled-context.outputs.product-paths }}
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - if: always() && steps.stress-run.outputs.cache-quiescent == 'true' && steps.sources.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.sources.outputs.cache-primary-key != ''
