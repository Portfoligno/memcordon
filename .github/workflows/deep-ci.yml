name: Deep CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  miri:
    name: Miri
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: miri-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: managed-sources-v2-cargo-deps-deep-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 rustc --edition=2021 tools/ci-native-fingerprint.rs -o ci-native-fingerprint.exe
      - run: ./ci-native-fingerprint.exe --output target/ci/native-inputs.bin
      - id: miri-target
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci
            !target/ci/control-bootstrap
            !target/ci/source-home
            !target/ci/miri-sysroot
            !target/ci/native-inputs.bin
            !target/ci/reports
            !target/ci/*evidence*
            !target/ci/*diagnostic*
            !target/ci/source-observations
            !target/ci/release-bundle
            !target/ci/release-inputs
          key: managed-v2-cargo-target-deep-v1-miri-nightly-2026-07-31-${{ hashFiles('target/ci/native-inputs.bin', 'Cargo.lock', 'crates/**', 'tools/**', 'ci/**') }}
      - run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite miri
      - id: build-context-audit
        if: always()
        run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci audit-build-context --input target/ci/native-inputs.bin
      - if: always() && steps.miri-target.outputs.cache-hit != 'true' && steps.build-context-audit.outcome == 'success' && steps.miri-target.outputs.cache-primary-key != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci
            !target/ci/control-bootstrap
            !target/ci/source-home
            !target/ci/miri-sysroot
            !target/ci/native-inputs.bin
            !target/ci/reports
            !target/ci/*evidence*
            !target/ci/*diagnostic*
            !target/ci/source-observations
            !target/ci/release-bundle
            !target/ci/release-inputs
          key: ${{ steps.miri-target.outputs.cache-primary-key }}
      - if: always() && steps.miri-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: ${{ steps.miri-deps.outputs.cache-primary-key }}

  fuzz:
    name: fuzz smoke / ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [first, second]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: fuzz-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: managed-sources-v2-cargo-deps-deep-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 rustc --edition=2021 tools/ci-native-fingerprint.rs -o ci-native-fingerprint.exe
      - run: ./ci-native-fingerprint.exe --output target/ci/native-inputs.bin
      - id: fuzz-target
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci
            !target/ci/control-bootstrap
            !target/ci/source-home
            !target/ci/native-inputs.bin
            !target/ci/reports
            !target/ci/*evidence*
            !target/ci/*diagnostic*
            !target/ci/source-observations
            !target/ci/release-bundle
            !target/ci/release-inputs
            fuzz/target
          key: managed-v2-cargo-target-deep-v3-fuzz-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-nightly-2026-07-31-${{ hashFiles('target/ci/native-inputs.bin', 'Cargo.toml', 'Cargo.lock', '.cargo/**', 'rust-toolchain.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml', 'fuzz/fuzz_targets/**', 'fuzz/targets.toml', 'fuzz/seeds/**', 'crates/**', 'tools/**', 'ci/**', '.github/workflows/deep-ci.yml') }}
      - id: fuzz-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci-tools
          key: managed-v2-cargo-tools-deep-v1-fuzz-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('target/ci/native-inputs.bin', 'ci/tools.toml', 'tools/**') }}
      - if: matrix.shard == 'first'
        run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite fuzz-first
      - if: matrix.shard == 'second'
        run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite fuzz-second
      - id: build-context-audit
        if: always()
        run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci audit-build-context --input target/ci/native-inputs.bin
      - if: always() && steps.fuzz-target.outputs.cache-hit != 'true' && steps.build-context-audit.outcome == 'success' && steps.fuzz-target.outputs.cache-primary-key != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci
            !target/ci/control-bootstrap
            !target/ci/source-home
            !target/ci/native-inputs.bin
            !target/ci/reports
            !target/ci/*evidence*
            !target/ci/*diagnostic*
            !target/ci/source-observations
            !target/ci/release-bundle
            !target/ci/release-inputs
            fuzz/target
          key: ${{ steps.fuzz-target.outputs.cache-primary-key }}
      - if: always() && steps.fuzz-tools.outputs.cache-hit != 'true' && steps.build-context-audit.outcome == 'success' && steps.fuzz-tools.outputs.cache-primary-key != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci-tools
          key: ${{ steps.fuzz-tools.outputs.cache-primary-key }}
      - if: always() && steps.fuzz-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: ${{ steps.fuzz-deps.outputs.cache-primary-key }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-evidence-${{ matrix.shard }}
          path: target/ci/reports/fuzz
          retention-days: 90
          if-no-files-found: warn

  stress:
    name: stress / ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-24.04
          - id: macos-arm64
            runner: macos-15
          - id: macos-x64
            runner: macos-15-intel
          - id: windows-x64
            runner: windows-2025
          - id: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: stress-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: managed-sources-v2-cargo-deps-deep-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 rustc --edition=2021 tools/ci-native-fingerprint.rs -o ci-native-fingerprint.exe
      - run: ./ci-native-fingerprint.exe --output target/ci/native-inputs.bin
      - id: stress-target
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci
            !target/ci/control-bootstrap
            !target/ci/source-home
            !target/ci/native-inputs.bin
            !target/ci/reports
            !target/ci/*evidence*
            !target/ci/*diagnostic*
            !target/ci/source-observations
            !target/ci/release-bundle
            !target/ci/release-inputs
          key: managed-v2-cargo-target-deep-v1-stress-${{ matrix.id }}-${{ hashFiles('target/ci/native-inputs.bin', 'Cargo.lock', 'crates/**', 'tools/**', 'ci/**') }}
      - run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite stress
      - name: Upload source execution observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-observations-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: target/ci/source-observations
          if-no-files-found: warn
      - id: build-context-audit
        if: always()
        run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci audit-build-context --input target/ci/native-inputs.bin
      - if: always() && steps.stress-target.outputs.cache-hit != 'true' && steps.build-context-audit.outcome == 'success' && steps.stress-target.outputs.cache-primary-key != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci
            !target/ci/control-bootstrap
            !target/ci/source-home
            !target/ci/native-inputs.bin
            !target/ci/reports
            !target/ci/*evidence*
            !target/ci/*diagnostic*
            !target/ci/source-observations
            !target/ci/release-bundle
            !target/ci/release-inputs
          key: ${{ steps.stress-target.outputs.cache-primary-key }}
      - if: always() && steps.stress-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: ${{ steps.stress-deps.outputs.cache-primary-key }}

  source-evidence:
    name: source-evidence
    runs-on: ubuntu-24.04
    needs: stress
    if: always()
    permissions:
      contents: read
      actions: read
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Cargo sources
        id: source-evidence-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: managed-sources-v2-cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'rust-toolchain.toml') }}
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 rustc --edition=2021 tools/ci-native-fingerprint.rs -o ci-native-fingerprint.exe
      - run: ./ci-native-fingerprint.exe --output target/ci/native-inputs.bin
      - name: Restore source-evidence target
        id: source-evidence-target
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci
            !target/ci/control-bootstrap
            !target/ci/source-home
            !target/ci/native-inputs.bin
            !target/ci/reports
            !target/ci/*evidence*
            !target/ci/*diagnostic*
            !target/ci/source-observations
            !target/ci/release-bundle
            !target/ci/release-inputs
          key: managed-v2-cargo-target-v1-${{ runner.os }}-${{ runner.arch }}-source-evidence-1.97.1-${{ hashFiles('target/ci/native-inputs.bin', 'Cargo.lock', 'Cargo.toml', 'tools/**', 'ci/**', '.github/**') }}
      - name: Collect and verify source execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin source collect --workflow .github/workflows/deep-ci.yml --output target/ci/reports/source-coverage/deep.json
      - id: build-context-audit
        if: always()
        run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci audit-build-context --input target/ci/native-inputs.bin
      - name: Upload verified source coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-coverage-deep
          path: target/ci/reports/source-coverage/deep.json
          if-no-files-found: error
      - name: Save source-evidence target
        if: always() && steps.source-evidence-target.outputs.cache-hit != 'true' && steps.build-context-audit.outcome == 'success' && steps.source-evidence-target.outputs.cache-primary-key != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci
            !target/ci/control-bootstrap
            !target/ci/source-home
            !target/ci/native-inputs.bin
            !target/ci/reports
            !target/ci/*evidence*
            !target/ci/*diagnostic*
            !target/ci/source-observations
            !target/ci/release-bundle
            !target/ci/release-inputs
          key: ${{ steps.source-evidence-target.outputs.cache-primary-key }}
      - name: Save Cargo sources
        if: always() && steps.source-evidence-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: ${{ steps.source-evidence-deps.outputs.cache-primary-key }}
