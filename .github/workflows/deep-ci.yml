name: Deep CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  miri:
    name: Miri
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: miri-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: managed-sources-v2-cargo-deps-deep-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 rustc --edition=2021 tools/ci-native-fingerprint.rs -o ci-native-fingerprint.exe
      - id: build-context-prepare
        run: ./ci-native-fingerprint.exe --output target/ci/native-inputs.bin
      - id: inventory-observation
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: inventory-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            target/ci/reports/inventory-observation/v1/**/run-start.json
            target/ci/reports/inventory-observation/v1/**/phase-*.json
            target/ci/reports/inventory-observation/v1/**/inventory-*.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - id: miri-target
        if: steps.build-context-prepare.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci
            !target/ci/control-bootstrap
            !target/ci/source-home
            !target/ci/native-inputs.bin
            !target/ci/native-inputs.admission.json
            !target/ci/reports
            !target/ci/*evidence*
            !target/ci/*diagnostic*
            !target/ci/release-bundle
            !target/ci/release-inputs
          key: managed-v2-cargo-target-deep-v1-miri-nightly-2026-07-31-${{ hashFiles('target/ci/native-inputs.bin', 'Cargo.lock', 'crates/**', 'tools/**', 'ci/**') }}
      - run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite miri
      - id: build-context-audit
        if: always() && steps.build-context-prepare.outcome == 'success'
        run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci audit-build-context --input target/ci/native-inputs.bin
      - if: always() && steps.miri-target.outputs.cache-hit != 'true' && steps.build-context-audit.outcome == 'success' && steps.build-context-prepare.outcome == 'success' && steps.miri-target.outputs.cache-primary-key != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci
            !target/ci/control-bootstrap
            !target/ci/source-home
            !target/ci/native-inputs.bin
            !target/ci/native-inputs.admission.json
            !target/ci/reports
            !target/ci/*evidence*
            !target/ci/*diagnostic*
            !target/ci/release-bundle
            !target/ci/release-inputs
          key: ${{ steps.miri-target.outputs.cache-primary-key }}
      - if: always() && steps.miri-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: ${{ steps.miri-deps.outputs.cache-primary-key }}

  fuzz:
    name: fuzz smoke / ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [first, second]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: fuzz-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: managed-sources-v2-cargo-deps-deep-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 rustc --edition=2021 tools/ci-native-fingerprint.rs -o ci-native-fingerprint.exe
      - id: build-context-prepare
        run: ./ci-native-fingerprint.exe --output target/ci/native-inputs.bin
      - id: inventory-observation
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: inventory-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            target/ci/reports/inventory-observation/v1/**/run-start.json
            target/ci/reports/inventory-observation/v1/**/phase-*.json
            target/ci/reports/inventory-observation/v1/**/inventory-*.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - id: fuzz-target
        if: steps.build-context-prepare.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci
            !target/ci/control-bootstrap
            !target/ci/source-home
            !target/ci/native-inputs.bin
            !target/ci/native-inputs.admission.json
            !target/ci/reports
            !target/ci/*evidence*
            !target/ci/*diagnostic*
            !target/ci/release-bundle
            !target/ci/release-inputs
            fuzz/target
          key: managed-v2-cargo-target-deep-v3-fuzz-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-nightly-2026-07-31-${{ hashFiles('target/ci/native-inputs.bin', 'Cargo.toml', 'Cargo.lock', '.cargo/**', 'rust-toolchain.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml', 'fuzz/fuzz_targets/**', 'crates/**', 'tools/**', 'ci/**', '.github/workflows/deep-ci.yml') }}
      - id: fuzz-tools
        if: steps.build-context-prepare.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci-tools
          key: managed-v2-cargo-tools-deep-v1-fuzz-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('target/ci/native-inputs.bin', 'ci/tools.toml', 'tools/**') }}
      - if: matrix.shard == 'first'
        run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite fuzz-first
      - if: matrix.shard == 'second'
        run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite fuzz-second
      - id: build-context-audit
        if: always() && steps.build-context-prepare.outcome == 'success'
        run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci audit-build-context --input target/ci/native-inputs.bin
      - if: always() && steps.fuzz-target.outputs.cache-hit != 'true' && steps.build-context-audit.outcome == 'success' && steps.build-context-prepare.outcome == 'success' && steps.fuzz-target.outputs.cache-primary-key != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci
            !target/ci/control-bootstrap
            !target/ci/source-home
            !target/ci/native-inputs.bin
            !target/ci/native-inputs.admission.json
            !target/ci/reports
            !target/ci/*evidence*
            !target/ci/*diagnostic*
            !target/ci/release-bundle
            !target/ci/release-inputs
            fuzz/target
          key: ${{ steps.fuzz-target.outputs.cache-primary-key }}
      - if: always() && steps.fuzz-tools.outputs.cache-hit != 'true' && steps.build-context-audit.outcome == 'success' && steps.build-context-prepare.outcome == 'success' && steps.fuzz-tools.outputs.cache-primary-key != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/ci-tools
          key: ${{ steps.fuzz-tools.outputs.cache-primary-key }}
      - if: always() && steps.fuzz-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: ${{ steps.fuzz-deps.outputs.cache-primary-key }}

  stress:
    name: stress / ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-24.04
          - id: macos-arm64
            runner: macos-15
          - id: macos-x64
            runner: macos-15-intel
          - id: windows-x64
            runner: windows-2025
          - id: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: stress-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: managed-sources-v2-cargo-deps-deep-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml') }}
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 rustc --edition=2021 tools/ci-native-fingerprint.rs -o ci-native-fingerprint.exe
      - id: build-context-prepare
        run: ./ci-native-fingerprint.exe --output target/ci/native-inputs.bin
      - id: inventory-observation
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: inventory-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            target/ci/reports/inventory-observation/v1/**/run-start.json
            target/ci/reports/inventory-observation/v1/**/phase-*.json
            target/ci/reports/inventory-observation/v1/**/inventory-*.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - id: stress-target
        if: steps.build-context-prepare.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci
            !target/ci/control-bootstrap
            !target/ci/source-home
            !target/ci/native-inputs.bin
            !target/ci/native-inputs.admission.json
            !target/ci/reports
            !target/ci/*evidence*
            !target/ci/*diagnostic*
            !target/ci/release-bundle
            !target/ci/release-inputs
          key: managed-v2-cargo-target-deep-v1-stress-${{ matrix.id }}-${{ hashFiles('target/ci/native-inputs.bin', 'Cargo.lock', 'crates/**', 'tools/**', 'ci/**') }}
      - run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci --build-context target/ci/native-inputs.bin suite stress
      - id: build-context-audit
        if: always() && steps.build-context-prepare.outcome == 'success'
        run: ./target/ci/control-bootstrap/ci-bootstrap/memcordon-ci audit-build-context --input target/ci/native-inputs.bin
      - if: always() && steps.stress-target.outputs.cache-hit != 'true' && steps.build-context-audit.outcome == 'success' && steps.build-context-prepare.outcome == 'success' && steps.stress-target.outputs.cache-primary-key != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci
            !target/ci/control-bootstrap
            !target/ci/source-home
            !target/ci/native-inputs.bin
            !target/ci/native-inputs.admission.json
            !target/ci/reports
            !target/ci/*evidence*
            !target/ci/*diagnostic*
            !target/ci/release-bundle
            !target/ci/release-inputs
          key: ${{ steps.stress-target.outputs.cache-primary-key }}
      - if: always() && steps.stress-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/ci/source-home/registry/index
            target/ci/source-home/registry/cache
            target/ci/source-home/git/db
          key: ${{ steps.stress-deps.outputs.cache-primary-key }}
