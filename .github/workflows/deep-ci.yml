name: Deep CI

on:
  push:
  workflow_dispatch:
    inputs:
      failure-mode:
        description: Stop independent work after a failure or collect applicable diagnostics
        type: choice
        default: collect-all
        options: [stop-after-failure, collect-all]

permissions:
  contents: read

concurrency:
  group: deep-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-plan:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      combined: ${{ steps.plan.outputs.stress-combined }}
      split: ${{ steps.plan.outputs.stress-split }}
      has-combined: ${{ steps.plan.outputs.stress-has-combined }}
      has-split: ${{ steps.plan.outputs.stress-has-split }}
      standalone-common: ${{ steps.scope.outputs.standalone-common }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: scope
        run: ./target/ci/release/memcordon-ci ci workflow-scope
      - id: plan
        run: ./target/ci/release/memcordon-ci ci performance-plan
  miri:
    needs: performance-plan
    if: needs.performance-plan.outputs.standalone-common == 'true'
    name: Miri / ${{ matrix.shard }}
    strategy:
      fail-fast: ${{ github.event_name != 'workflow_dispatch' || inputs.failure-mode != 'collect-all' }}
      max-parallel: 4
      matrix:
        shard: [quarter-one, quarter-two, quarter-three, quarter-four]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: miri-deps
        continue-on-error: true
        if: hashFiles('Cargo.lock') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: mc-download-bootstrap-v5-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'ci/toolchains.toml') }}
          restore-keys: mc-download-bootstrap-v5-${{ runner.os }}-
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build ordinary CI driver
        run: rustup run 1.97.1 cargo build --locked --release --target-dir target/ci -p memcordon-ci --bin memcordon-ci
      - id: workspace-download-context
        run: ./target/ci/release/memcordon-ci ci download-cache-context --family workspace
      - id: workspace-downloads
        if: steps.workspace-download-context.outputs.source-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.workspace-download-context.outputs.source-paths }}
          key: ${{ steps.workspace-download-context.outputs.source-key }}
          restore-keys: ${{ steps.workspace-download-context.outputs.source-restore-prefix }}
      - id: archive-seed-context
        run: ./target/ci/release/memcordon-ci ci seed-context --kind registry-archives
      - id: archive-seed-restore
        if: steps.archive-seed-context.outputs.seed-lookup-key != '' && steps.workspace-downloads.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.archive-seed-context.outputs.seed-lookup-key }}
          restore-keys: ${{ steps.archive-seed-context.outputs.seed-restore-prefix }}
          path: ${{ steps.archive-seed-context.outputs.seed-import-path }}
      - if: steps.archive-seed-restore.outcome == 'success' && steps.archive-seed-restore.outputs.cache-matched-key != ''
        run: ./target/ci/release/memcordon-ci ci import-cache-snapshot --kind registry-archives
      - id: index-snapshot-context
        run: ./target/ci/release/memcordon-ci ci seed-context --kind registry-index
      - id: index-snapshot-restore
        if: steps.index-snapshot-context.outputs.seed-lookup-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.index-snapshot-context.outputs.seed-lookup-key }}
          restore-keys: ${{ steps.index-snapshot-context.outputs.seed-restore-prefix }}
          path: ${{ steps.index-snapshot-context.outputs.seed-import-path }}
      - if: steps.index-snapshot-restore.outcome == 'success' && steps.index-snapshot-restore.outputs.cache-matched-key != ''
        run: ./target/ci/release/memcordon-ci ci import-cache-snapshot --kind registry-index
      - id: workspace-fetch
        run: ./target/ci/release/memcordon-ci ci fetch-downloads --family workspace
      - run: ./target/ci/release/memcordon-ci ci prepare-miri-components
      - id: miri-sysroot-context
        run: ./target/ci/release/memcordon-ci ci miri-cache-context
      - id: miri-sysroot-cache
        if: steps.miri-sysroot-context.outputs.sysroot-key != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.miri-sysroot-context.outputs.sysroot-key }}
          path: ${{ steps.miri-sysroot-context.outputs.sysroot-path }}
      - id: miri-sysroot-setup
        run: ./target/ci/release/memcordon-ci ci prepare-miri-sysroot
      - id: miri-sysroot-save-context
        if: always() && steps.miri-sysroot-setup.outputs.miri-sysroot-ready == 'true' && steps.miri-sysroot-setup.outputs.miri-sysroot-quiescent == 'true'
        run: ./target/ci/release/memcordon-ci ci miri-cache-context
      - name: Save generated Miri standard library
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.miri-sysroot-setup.outputs.miri-sysroot-ready == 'true' && steps.miri-sysroot-setup.outputs.miri-sysroot-quiescent == 'true' && steps.miri-sysroot-context.outputs.sysroot-key != '' && steps.miri-sysroot-save-context.outputs.sysroot-key == steps.miri-sysroot-context.outputs.sysroot-key && steps.miri-sysroot-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.miri-sysroot-context.outputs.sysroot-key }}
          path: ${{ steps.miri-sysroot-context.outputs.sysroot-path }}
      - id: compiled-context-quarter-one
        if: matrix.shard == 'quarter-one'
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose miri --shard quarter-one
      - id: compiled-context-quarter-three
        if: matrix.shard == 'quarter-three'
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose miri --shard quarter-three
      - id: compiled-context-quarter-two
        if: matrix.shard == 'quarter-two'
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose miri --shard quarter-two
      - id: compiled-context-quarter-four
        if: matrix.shard == 'quarter-four'
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose miri --shard quarter-four
      - id: compiled-quarter-one
        continue-on-error: true
        if: matrix.shard == 'quarter-one' && steps.compiled-context-quarter-one.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.compiled-context-quarter-one.outputs.product-paths }}
          key: ${{ steps.compiled-context-quarter-one.outputs.product-key }}
          restore-keys: ${{ steps.compiled-context-quarter-one.outputs.product-restore-prefix }}
      - id: compiled-quarter-three
        continue-on-error: true
        if: matrix.shard == 'quarter-three' && steps.compiled-context-quarter-three.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.compiled-context-quarter-three.outputs.product-paths }}
          key: ${{ steps.compiled-context-quarter-three.outputs.product-key }}
          restore-keys: ${{ steps.compiled-context-quarter-three.outputs.product-restore-prefix }}
      - name: Sanitize compiled-quarter-one discard restore
        if: steps.compiled-quarter-one.outcome == 'failure'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose miri --shard quarter-one --mode discard
      - name: Sanitize compiled-quarter-three discard restore
        if: steps.compiled-quarter-three.outcome == 'failure'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose miri --shard quarter-three --mode discard
      - name: Sanitize compiled-quarter-one exact restore
        if: steps.compiled-quarter-one.outcome == 'success' && steps.compiled-quarter-one.outputs.cache-hit == 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose miri --shard quarter-one --mode exact
      - name: Sanitize compiled-quarter-three exact restore
        if: steps.compiled-quarter-three.outcome == 'success' && steps.compiled-quarter-three.outputs.cache-hit == 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose miri --shard quarter-three --mode exact
      - name: Sanitize compiled-quarter-one compatible restore
        if: steps.compiled-quarter-one.outcome == 'success' && steps.compiled-quarter-one.outputs.cache-matched-key != '' && steps.compiled-quarter-one.outputs.cache-hit != 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose miri --shard quarter-one --mode compatible
      - name: Sanitize compiled-quarter-three compatible restore
        if: steps.compiled-quarter-three.outcome == 'success' && steps.compiled-quarter-three.outputs.cache-matched-key != '' && steps.compiled-quarter-three.outputs.cache-hit != 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose miri --shard quarter-three --mode compatible
      - id: compiled-quarter-two
        continue-on-error: true
        if: matrix.shard == 'quarter-two' && steps.compiled-context-quarter-two.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.compiled-context-quarter-two.outputs.product-paths }}
          key: ${{ steps.compiled-context-quarter-two.outputs.product-key }}
          restore-keys: ${{ steps.compiled-context-quarter-two.outputs.product-restore-prefix }}
      - id: compiled-quarter-four
        continue-on-error: true
        if: matrix.shard == 'quarter-four' && steps.compiled-context-quarter-four.outputs.compiled-cache-usable == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.compiled-context-quarter-four.outputs.product-paths }}
          key: ${{ steps.compiled-context-quarter-four.outputs.product-key }}
          restore-keys: ${{ steps.compiled-context-quarter-four.outputs.product-restore-prefix }}
      - name: Sanitize compiled-quarter-two discard restore
        if: steps.compiled-quarter-two.outcome == 'failure'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose miri --shard quarter-two --mode discard
      - name: Sanitize compiled-quarter-four discard restore
        if: steps.compiled-quarter-four.outcome == 'failure'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose miri --shard quarter-four --mode discard
      - name: Sanitize compiled-quarter-two exact restore
        if: steps.compiled-quarter-two.outcome == 'success' && steps.compiled-quarter-two.outputs.cache-hit == 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose miri --shard quarter-two --mode exact
      - name: Sanitize compiled-quarter-four exact restore
        if: steps.compiled-quarter-four.outcome == 'success' && steps.compiled-quarter-four.outputs.cache-hit == 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose miri --shard quarter-four --mode exact
      - name: Sanitize compiled-quarter-two compatible restore
        if: steps.compiled-quarter-two.outcome == 'success' && steps.compiled-quarter-two.outputs.cache-matched-key != '' && steps.compiled-quarter-two.outputs.cache-hit != 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose miri --shard quarter-two --mode compatible
      - name: Sanitize compiled-quarter-four compatible restore
        if: steps.compiled-quarter-four.outcome == 'success' && steps.compiled-quarter-four.outputs.cache-matched-key != '' && steps.compiled-quarter-four.outputs.cache-hit != 'true'
        run: ./target/ci/release/memcordon-ci ci prepare-restored-cache --purpose miri --shard quarter-four --mode compatible
      - id: miri-quarter-one
        if: matrix.shard == 'quarter-one' && (github.event_name != 'workflow_dispatch' || inputs.failure-mode != 'collect-all')
        run: ./target/ci/release/memcordon-ci suite miri-quarter-one --failure-mode stop-after-failure
      - id: miri-quarter-one-diagnostic
        if: matrix.shard == 'quarter-one' && (github.event_name == 'workflow_dispatch' && inputs.failure-mode == 'collect-all')
        run: ./target/ci/release/memcordon-ci suite miri-quarter-one --failure-mode collect-all
      - id: miri-quarter-three
        if: matrix.shard == 'quarter-three' && (github.event_name != 'workflow_dispatch' || inputs.failure-mode != 'collect-all')
        run: ./target/ci/release/memcordon-ci suite miri-quarter-three --failure-mode stop-after-failure
      - id: miri-quarter-three-diagnostic
        if: matrix.shard == 'quarter-three' && (github.event_name == 'workflow_dispatch' && inputs.failure-mode == 'collect-all')
        run: ./target/ci/release/memcordon-ci suite miri-quarter-three --failure-mode collect-all
      - id: miri-quarter-two
        if: matrix.shard == 'quarter-two' && (github.event_name != 'workflow_dispatch' || inputs.failure-mode != 'collect-all')
        run: ./target/ci/release/memcordon-ci suite miri-quarter-two --failure-mode stop-after-failure
      - id: miri-quarter-two-diagnostic
        if: matrix.shard == 'quarter-two' && (github.event_name == 'workflow_dispatch' && inputs.failure-mode == 'collect-all')
        run: ./target/ci/release/memcordon-ci suite miri-quarter-two --failure-mode collect-all
      - id: miri-quarter-four
        if: matrix.shard == 'quarter-four' && (github.event_name != 'workflow_dispatch' || inputs.failure-mode != 'collect-all')
        run: ./target/ci/release/memcordon-ci suite miri-quarter-four --failure-mode stop-after-failure
      - id: miri-quarter-four-diagnostic
        if: matrix.shard == 'quarter-four' && (github.event_name == 'workflow_dispatch' && inputs.failure-mode == 'collect-all')
        run: ./target/ci/release/memcordon-ci suite miri-quarter-four --failure-mode collect-all
      - if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: miri-plan-${{ matrix.shard }}
          path: target/ci/reports/miri
          if-no-files-found: warn
      - id: compiled-quarter-one-save-context
        if: always() && steps.compiled-context-quarter-one.outputs.compiled-cache-usable == 'true' && ((steps.miri-quarter-one.outputs.cache-quiescent || steps.miri-quarter-one-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-two.outputs.cache-quiescent || steps.miri-quarter-two-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-three.outputs.cache-quiescent || steps.miri-quarter-three-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-four.outputs.cache-quiescent || steps.miri-quarter-four-diagnostic.outputs.cache-quiescent) == 'true') && steps.compiled-quarter-one.outputs.cache-hit != 'true' && matrix.shard == 'quarter-one'
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose miri --shard quarter-one
      - id: compiled-quarter-three-save-context
        if: always() && steps.compiled-context-quarter-three.outputs.compiled-cache-usable == 'true' && ((steps.miri-quarter-one.outputs.cache-quiescent || steps.miri-quarter-one-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-two.outputs.cache-quiescent || steps.miri-quarter-two-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-three.outputs.cache-quiescent || steps.miri-quarter-three-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-four.outputs.cache-quiescent || steps.miri-quarter-four-diagnostic.outputs.cache-quiescent) == 'true') && steps.compiled-quarter-three.outputs.cache-hit != 'true' && matrix.shard == 'quarter-three'
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose miri --shard quarter-three
      - if: always() && success() && steps.compiled-context-quarter-one.outputs.compiled-cache-usable == 'true' && ((steps.miri-quarter-one.outputs.cache-quiescent || steps.miri-quarter-one-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-two.outputs.cache-quiescent || steps.miri-quarter-two-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-three.outputs.cache-quiescent || steps.miri-quarter-three-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-four.outputs.cache-quiescent || steps.miri-quarter-four-diagnostic.outputs.cache-quiescent) == 'true') && steps.compiled-quarter-one.outputs.cache-hit != 'true' && matrix.shard == 'quarter-one' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.compiled-quarter-one.outputs.cache-primary-key != '' && steps.compiled-quarter-one-save-context.outcome == 'success' && steps.compiled-quarter-one-save-context.outputs.product-key == steps.compiled-context-quarter-one.outputs.product-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.compiled-context-quarter-one.outputs.product-paths }}
          key: ${{ steps.compiled-quarter-one.outputs.cache-primary-key }}
      - if: always() && success() && steps.compiled-context-quarter-three.outputs.compiled-cache-usable == 'true' && ((steps.miri-quarter-one.outputs.cache-quiescent || steps.miri-quarter-one-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-two.outputs.cache-quiescent || steps.miri-quarter-two-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-three.outputs.cache-quiescent || steps.miri-quarter-three-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-four.outputs.cache-quiescent || steps.miri-quarter-four-diagnostic.outputs.cache-quiescent) == 'true') && steps.compiled-quarter-three.outputs.cache-hit != 'true' && matrix.shard == 'quarter-three' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.compiled-quarter-three.outputs.cache-primary-key != '' && steps.compiled-quarter-three-save-context.outcome == 'success' && steps.compiled-quarter-three-save-context.outputs.product-key == steps.compiled-context-quarter-three.outputs.product-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.compiled-context-quarter-three.outputs.product-paths }}
          key: ${{ steps.compiled-quarter-three.outputs.cache-primary-key }}
      - id: compiled-quarter-two-save-context
        if: always() && steps.compiled-context-quarter-two.outputs.compiled-cache-usable == 'true' && ((steps.miri-quarter-one.outputs.cache-quiescent || steps.miri-quarter-one-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-two.outputs.cache-quiescent || steps.miri-quarter-two-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-three.outputs.cache-quiescent || steps.miri-quarter-three-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-four.outputs.cache-quiescent || steps.miri-quarter-four-diagnostic.outputs.cache-quiescent) == 'true') && steps.compiled-quarter-two.outputs.cache-hit != 'true' && matrix.shard == 'quarter-two'
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose miri --shard quarter-two
      - id: compiled-quarter-four-save-context
        if: always() && steps.compiled-context-quarter-four.outputs.compiled-cache-usable == 'true' && ((steps.miri-quarter-one.outputs.cache-quiescent || steps.miri-quarter-one-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-two.outputs.cache-quiescent || steps.miri-quarter-two-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-three.outputs.cache-quiescent || steps.miri-quarter-three-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-four.outputs.cache-quiescent || steps.miri-quarter-four-diagnostic.outputs.cache-quiescent) == 'true') && steps.compiled-quarter-four.outputs.cache-hit != 'true' && matrix.shard == 'quarter-four'
        timeout-minutes: 2
        continue-on-error: true
        run: ./target/ci/release/memcordon-ci ci cache-context --purpose miri --shard quarter-four
      - if: always() && success() && steps.compiled-context-quarter-two.outputs.compiled-cache-usable == 'true' && ((steps.miri-quarter-one.outputs.cache-quiescent || steps.miri-quarter-one-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-two.outputs.cache-quiescent || steps.miri-quarter-two-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-three.outputs.cache-quiescent || steps.miri-quarter-three-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-four.outputs.cache-quiescent || steps.miri-quarter-four-diagnostic.outputs.cache-quiescent) == 'true') && steps.compiled-quarter-two.outputs.cache-hit != 'true' && matrix.shard == 'quarter-two' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.compiled-quarter-two.outputs.cache-primary-key != '' && steps.compiled-quarter-two-save-context.outcome == 'success' && steps.compiled-quarter-two-save-context.outputs.product-key == steps.compiled-context-quarter-two.outputs.product-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.compiled-context-quarter-two.outputs.product-paths }}
          key: ${{ steps.compiled-quarter-two.outputs.cache-primary-key }}
      - if: always() && success() && steps.compiled-context-quarter-four.outputs.compiled-cache-usable == 'true' && ((steps.miri-quarter-one.outputs.cache-quiescent || steps.miri-quarter-one-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-two.outputs.cache-quiescent || steps.miri-quarter-two-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-three.outputs.cache-quiescent || steps.miri-quarter-three-diagnostic.outputs.cache-quiescent) == 'true' || (steps.miri-quarter-four.outputs.cache-quiescent || steps.miri-quarter-four-diagnostic.outputs.cache-quiescent) == 'true') && steps.compiled-quarter-four.outputs.cache-hit != 'true' && matrix.shard == 'quarter-four' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.compiled-quarter-four.outputs.cache-primary-key != '' && steps.compiled-quarter-four-save-context.outcome == 'success' && steps.compiled-quarter-four-save-context.outputs.product-key == steps.compiled-context-quarter-four.outputs.product-key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.compiled-context-quarter-four.outputs.product-paths }}
          key: ${{ steps.compiled-quarter-four.outputs.cache-primary-key }}
      - if: always() && steps.workspace-download-context.outputs.bootstrap-home-matches == 'true' && matrix.shard == 'quarter-one' && steps.miri-deps.outputs.cache-hit != 'true' && success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.miri-deps.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.miri-deps.outputs.cache-primary-key }}

      - id: archive-seed-snapshot
